<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- every visible string comes from copy.zh.js / copy.en.js via app.js. The Chinese title and description below are
     static defaults for crawlers and link previews that do not run script; app.js replaces both on load and on a
     language switch. Keep them equal to doc.title / doc.desc in copy.zh.js (tests/copy.cjs checks this). -->
<title>稀缺会搬家 · 经济学的基本道理与 AI 之后</title>
<meta name="description" content="十个经济学的基本道理，每个配一个可以动手的小模型；再用它们推演 AI 普及之后，工作、收入和稀缺会怎样变化。">
<style>
  :root { --bg:#0c0e13; --card:#141821; --card2:#1a1f2b; --line:#272d3b; --ink:#ebe8e0; --mute:#9aa1b0; --dim:#6b7283;
    --gold:#e9b949; --cyan:#63c7e6; --red:#ef6f61; --green:#7ad6a0; --violet:#a78bfa;
    --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",Georgia,serif;
    --sans:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif; }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.85 var(--sans); -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  a { color:var(--cyan); }
  #bar { position:fixed; top:0; left:0; height:3px; width:0; background:linear-gradient(90deg,var(--gold),var(--cyan)); z-index:20; }
  #langToggle { position:absolute; top:8px; right:12px; z-index:5; display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--card); }
  #langToggle[hidden] { display:none; }
  #langToggle button { min-width:48px; min-height:48px; border:0; border-radius:0; background:transparent; color:var(--mute); font:600 14px/1 var(--sans); padding:0 12px; cursor:pointer; }
  #langToggle button + button { border-left:1px solid var(--line); }
  #langToggle button[aria-pressed="true"] { background:rgba(233,185,73,.16); color:var(--gold); }
  .wrap { max-width:760px; margin:0 auto; padding:0 20px; }
  .wide { max-width:980px; margin:0 auto; padding:0 20px; }

  .hero { position:relative; min-height:100vh; display:flex; align-items:center; border-bottom:1px solid var(--line); overflow:hidden; }
  #heroCv { position:absolute; inset:0; width:100%; height:100%; opacity:.75; }
  .hero::after { content:""; position:absolute; inset:0; background:radial-gradient(ellipse at 30% 50%, rgba(12,14,19,.88) 0%, rgba(12,14,19,.55) 55%, rgba(12,14,19,.15) 100%); pointer-events:none; }
  .hero .wrap { position:relative; z-index:2; padding-top:72px; padding-bottom:72px; width:100%; }
  .kicker { font:12px/1 ui-monospace,Menlo,monospace; letter-spacing:.28em; color:var(--gold); text-transform:uppercase; }
  h1 { font:400 clamp(52px,11vw,124px)/1.08 var(--serif); letter-spacing:.06em; margin:.28em 0 .22em; }
  .sub { font:400 clamp(18px,2.6vw,26px)/1.6 var(--serif); color:var(--ink); margin:0 0 1.6em; }
  .lead { color:#cfd2da; max-width:36em; }
  .note { font-size:14px; color:var(--mute); border-left:2px solid var(--line); padding-left:14px; margin-top:2em; max-width:36em; line-height:1.75; }
  #heroStat { font:12px/1.6 ui-monospace,Menlo,monospace; color:var(--dim); letter-spacing:.08em; margin-top:2.4em; }
  #heroStat b { color:var(--gold); font-weight:400; }

  .toc { padding:56px 0 8px; }
  .toc h3 { font:12px/1 ui-monospace,Menlo,monospace; letter-spacing:.28em; color:var(--dim); margin:0 0 18px; font-weight:400; }
  .toc ol { list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:4px 22px; }
  .toc a { display:flex; align-items:center; gap:12px; min-height:48px; padding:7px 0; text-decoration:none; color:var(--ink); border-bottom:1px solid var(--line); font-size:15px; }
  .toc a:hover { color:var(--gold); }
  .toc a span { font:12px/2.1 ui-monospace,Menlo,monospace; color:var(--dim); }
  .toc a b { font-weight:inherit; }

  .part { margin:110px 0 0; padding:44px 0 0; border-top:1px solid var(--line); }
  .part .kicker { color:var(--cyan); }
  .part h2 { font:400 clamp(30px,5vw,48px)/1.3 var(--serif); margin:.5em 0 .4em; letter-spacing:.04em; }
  .part p { color:var(--mute); max-width:34em; }

  .ch { padding-top:92px; }
  .num { font:400 15px/1 ui-monospace,Menlo,monospace; color:var(--gold); letter-spacing:.2em; }
  .ch h3 { font:400 clamp(26px,4.2vw,38px)/1.35 var(--serif); margin:.45em 0 .5em; letter-spacing:.03em; }
  .law { font:400 clamp(19px,2.5vw,23px)/1.7 var(--serif); color:var(--ink); border-left:3px solid var(--gold); padding:4px 0 4px 18px; margin:0 0 1.5em; }
  .ch p { margin:0 0 1.15em; color:#d5d7de; }
  .ch p strong, .ch li strong { color:var(--ink); font-weight:600; }
  .ch ul, .ch ol.plain { padding-left:1.3em; margin:0 0 1.2em; color:#d5d7de; }
  .ch li { margin:.4em 0; }
  .take { color:var(--mute) !important; font-size:15.5px; }

  figure.lab { margin:34px auto 34px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px 22px 18px; }
  .lab h4 { margin:0 0 4px; font:600 15px/1.5 var(--sans); color:var(--ink); }
  .lab .how { margin:0 0 14px; font-size:14px; color:var(--mute); line-height:1.65; }
  .cv { width:100%; height:300px; display:block; border-radius:10px; background:#0f1219; touch-action:pan-y; }
  .cv.short { height:150px; margin-top:10px; }
  .cv.tall { height:360px; }
  .ctl { display:flex; flex-wrap:wrap; gap:10px 22px; align-items:center; margin:14px 0 4px; font-size:14px; color:var(--mute); }
  .ctl label { display:flex; align-items:center; gap:10px; flex:1 1 240px; min-width:0; min-height:48px; }
  .ctl label.chk { flex:0 0 auto; cursor:pointer; color:var(--ink); }
  .ctl label > span:first-child { flex:0 1 auto; }
  .ctl output { flex:0 0 auto; min-width:3.6em; text-align:right; color:var(--ink); font-variant-numeric:tabular-nums; }
  input[type=range] { flex:1 1 auto; min-width:60px; accent-color:var(--gold); height:48px; margin:0; cursor:pointer; }
  input[type=checkbox] { accent-color:var(--gold); width:17px; height:17px; }
  button { font:inherit; font-size:14px; color:var(--ink); background:var(--card2); border:1px solid var(--line); border-radius:999px; min-height:48px; padding:7px 16px; cursor:pointer; line-height:1.3; }
  button:hover, button:focus-visible { border-color:var(--gold); outline:none; }
  button:focus-visible, input:focus-visible, .toc a:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
  button.on { background:rgba(233,185,73,.16); border-color:var(--gold); color:var(--gold); }
  .read { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-top:14px; }
  .read div { background:var(--card2); border-radius:10px; padding:10px 12px; font-size:12.5px; color:var(--mute); line-height:1.5; }
  .read b { display:block; font:600 20px/1.3 var(--sans); color:var(--ink); font-variant-numeric:tabular-nums; }
  .read b.g { color:var(--gold); } .read b.r { color:var(--red); } .read b.c { color:var(--cyan); } .read b.n { color:var(--green); }
  .say { margin:14px 0 0; font-size:14.5px; color:var(--ink); line-height:1.7; min-height:3.4em; }
  .say em { font-style:normal; color:var(--gold); }
  .legend { display:flex; flex-wrap:wrap; gap:6px 18px; font-size:13px; color:var(--mute); margin-top:10px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:-1px; }

  /* trade */
  .people { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:14px; }
  .person { background:var(--card2); border-radius:12px; padding:12px 14px; }
  .person h5 { margin:0 0 6px; font:600 14px/1.5 var(--sans); }
  .person .ctl { margin:2px 0; }
  .plans { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:14px; margin-top:14px; }
  .plan { border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .plan h5 { margin:0 0 8px; font:600 14px/1.5 var(--sans); color:var(--mute); }
  .plan.win { border-color:rgba(233,185,73,.55); } .plan.win h5 { color:var(--gold); }
  .row { display:grid; grid-template-columns:3.2em 1fr; gap:8px; align-items:center; font-size:12.5px; color:var(--mute); margin:5px 0; }
  .hbar { display:flex; height:16px; border-radius:4px; overflow:hidden; background:#0f1219; }
  .hbar i { display:block; height:100%; transition:width .25s; }
  .t1 { background:var(--cyan); } .t2 { background:var(--gold); }
  .tot { margin-top:10px; padding-top:8px; border-top:1px dashed var(--line); }
  .tot .row { grid-template-columns:3.2em 1fr 3.4em; } .tot .row b { color:var(--ink); text-align:right; font-variant-numeric:tabular-nums; }

  /* cases */
  .cases { display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:14px; margin:30px 0; }
  .case { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; font-size:15px; line-height:1.75; color:#d5d7de; }
  .case b { display:block; color:var(--gold); font-weight:600; margin-bottom:4px; }

  .sum { margin:70px 0 0; padding:26px 26px; border:1px solid var(--line); border-radius:16px; background:linear-gradient(180deg,rgba(233,185,73,.07),transparent); font:400 clamp(17px,2.2vw,20px)/2 var(--serif); }
  .sum em { font-style:normal; color:var(--gold); }

  /* shares */
  .split { display:flex; height:30px; border-radius:8px; overflow:hidden; margin-top:14px; font-size:12px; line-height:30px; color:#0c0e13; font-weight:600; }
  .split i { display:block; height:100%; transition:width .25s; overflow:hidden; white-space:nowrap; text-indent:8px; font-style:normal; }

  /* scarcity map */
  .map { margin-top:14px; display:grid; gap:6px; }
  .mrow { display:grid; grid-template-columns:1fr 46%; gap:12px; align-items:center; font-size:14px; }
  .mrow span { text-align:right; color:#d5d7de; line-height:1.4; }
  .track { position:relative; height:16px; }
  .track::before { content:""; position:absolute; left:50%; top:-3px; bottom:-3px; width:1px; background:var(--line); }
  .track i { position:absolute; top:0; height:100%; border-radius:3px; transition:all .2s; }
  .maphead { display:grid; grid-template-columns:1fr 46%; gap:12px; font-size:12px; color:var(--dim); }
  .maphead div { display:flex; justify-content:space-between; }

  /* forecast */
  .era { margin:34px 0 0; }
  .era h4 { font:400 21px/1.5 var(--serif); margin:0 0 10px; color:var(--cyan); letter-spacing:.04em; }
  .fc { list-style:none; margin:0; padding:0; }
  .fc li { display:grid; grid-template-columns:auto 1fr; gap:14px; padding:12px 0; border-bottom:1px solid var(--line); color:#d5d7de; }
  .tag { align-self:start; margin-top:5px; font:600 11px/1 var(--sans); padding:5px 8px; border-radius:6px; white-space:nowrap; }
  .tag.h { background:rgba(122,214,160,.16); color:var(--green); } .tag.m { background:rgba(233,185,73,.16); color:var(--gold); } .tag.l { background:rgba(239,111,97,.16); color:var(--red); }

  .scen { display:grid; grid-template-columns:minmax(220px,340px) 1fr; gap:22px; align-items:start; }
  .pad { position:relative; aspect-ratio:1; background:#0f1219; border-radius:12px; border:1px solid var(--line); touch-action:none; cursor:crosshair; user-select:none;
    background-image:linear-gradient(var(--line),var(--line)),linear-gradient(var(--line),var(--line)); background-size:100% 1px,1px 100%; background-position:center; background-repeat:no-repeat; }
  .pad small { position:absolute; font-size:11.5px; color:var(--dim); line-height:1.3; }
  .pad .ax { color:var(--mute); }
  #dot { position:absolute; width:22px; height:22px; margin:-11px 0 0 -11px; border-radius:50%; background:var(--gold); box-shadow:0 0 0 6px rgba(233,185,73,.2),0 0 24px rgba(233,185,73,.6); cursor:grab; }
  #dot:focus-visible { outline:2px solid var(--ink); outline-offset:6px; }
  #mine { position:absolute; width:12px; height:12px; margin:-6px 0 0 -6px; border:2px solid var(--cyan); border-radius:50%; pointer-events:none; }
  .scen h5 { font:400 24px/1.4 var(--serif); margin:0 0 6px; color:var(--gold); }
  .scen p { font-size:15px; margin:0 0 12px; color:#d5d7de; line-height:1.75; min-height:8.5em; }
  .meter { display:grid; grid-template-columns:5em 1fr; gap:10px; align-items:center; font-size:13px; color:var(--mute); margin:6px 0; }
  .meter div { height:8px; background:#0f1219; border-radius:4px; overflow:hidden; }
  .meter i { display:block; height:100%; border-radius:4px; transition:width .2s; }

  footer { margin:110px 0 0; padding:40px 0 70px; border-top:1px solid var(--line); color:var(--dim); font-size:13.5px; line-height:1.8; }
  footer a { color:var(--mute); }
  /* English: words are longer than the Chinese, so give them room without changing the Chinese layout */
  html[lang=en] .kicker { line-height:1.5; }
  html[lang=en] .row { grid-template-columns:4.6em 1fr; } html[lang=en] .tot .row { grid-template-columns:4.6em 1fr 3.4em; }
  html[lang=en] .maphead div { gap:8px; } html[lang=en] .maphead div span { white-space:nowrap; }
  html[lang=en] .fc .tag { min-width:6.6em; text-align:center; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior:auto; } *, *::before, *::after { transition:none !important; } }
  @media (max-width:640px) {
    body { font-size:16px; } .wrap,.wide { padding:0 16px; } figure.lab { padding:16px 14px 14px; border-radius:14px; margin-left:-4px; margin-right:-4px; }
    .cv { height:250px; } .cv.tall { height:320px; } .scen { grid-template-columns:1fr; } .pad { max-width:340px; }
    .mrow, .maphead { grid-template-columns:1fr 40%; gap:8px; } .mrow { font-size:13px; } .ch { padding-top:72px; } .scen p { min-height:0; }
    /* English slider labels are too long to share a row with the slider: label on its own line, slider and value below */
    html[lang=en] .ctl label:not(.chk) { flex-wrap:wrap; row-gap:0; }
    html[lang=en] .ctl label:not(.chk) > span:first-child { flex:1 1 100%; line-height:1.4; padding-top:6px; }
    html[lang=en] .mrow, html[lang=en] .maphead { grid-template-columns:1fr 44%; } html[lang=en] .maphead { font-size:11.5px; }
  }
</style>
</head>
<body>
<div id="bar"></div>
<!-- Language toggle: app.js copies the buttons in and shows it only when LANG_TOGGLE_ON is true (copy.en.js translated).
     Until then the buttons stay inside the template, so nothing on the page (or a test) can find a toggle that does nothing. -->
<div id="langToggle" role="group" data-i18n-aria="nav.lang" hidden></div>
<template id="langToggleButtons"><button type="button" data-lang="zh" aria-pressed="false">中</button><button type="button" data-lang="en" aria-pressed="false">EN</button></template>

<header class="hero">
  <canvas id="heroCv" aria-hidden="true"></canvas>
  <div class="wrap">
    <div class="kicker" data-i18n="hero.kicker"></div>
    <h1 data-i18n="hero.title"></h1>
    <p class="sub" data-i18n-html="hero.sub"></p>
    <p class="lead" data-i18n="hero.lead"></p>
    <p class="note" data-i18n="hero.note"></p>
    <div id="heroStat"></div>
  </div>
</header>

<nav class="wrap toc" data-i18n-aria="toc.label">
  <h3 data-i18n="toc.title"></h3>
  <ol>
    <li><a href="#c1"><span>01</span><b data-i18n="ch1.title"></b></a></li>

    <li><a href="#c4"><span>04</span><b data-i18n="ch4.title"></b></a></li>
    <li><a href="#c5"><span>05</span><b data-i18n="ch5.title"></b></a></li>
    <li><a href="#c6"><span>06</span><b data-i18n="ch6.title"></b></a></li>
    <li><a href="#c7"><span>07</span><b data-i18n="ch7.title"></b></a></li>
    <li><a href="#c8"><span>08</span><b data-i18n="ch8.title"></b></a></li>
    <li><a href="#c9"><span>09</span><b data-i18n="ch9.title"></b></a></li>
    <li><a href="#c10"><span>10</span><b data-i18n="ch10.title"></b></a></li>
    <li><a href="#c11"><span>11</span><b data-i18n="ch11.title"></b></a></li>
    <li><a href="#c12"><span>12</span><b data-i18n="ch12.title"></b></a></li>

<main>

<!-- 01 -->

  <div class="wrap">

<!-- 03 -->
<article class="ch" id="c3">

    <div class="num">03</div>
    <h3 data-i18n="ch3.title"></h3>
    <p class="law" data-i18n="ch3.law"></p>
    <p data-i18n-html="ch3.p1"></p>
    <p data-i18n="ch3.p2"></p>
  </div>
  <div class="wide"><figure class="lab">
    <h4 data-i18n="ch3.lab.title"></h4>
    <p class="how" data-i18n="ch3.lab.how"></p>
    <div class="people">
      <div class="person"><h5 data-i18n="ch3.nameA"></h5>
        <div class="ctl"><label><span data-i18n="ch3.ctl.q"></span><input type="range" id="tA1" min="1" max="10" value="8"><output id="tA1o"></output></label></div>

    </div>

  <div class="wrap">

<!-- 04 -->
<article class="ch" id="c4">
  <div class="wrap">
    <div class="num">04</div>
    <h3 data-i18n="ch4.title"></h3>
    <p class="law" data-i18n="ch4.law"></p>
    <p data-i18n="ch4.p1"></p>
    <p data-i18n="ch4.p2"></p>
  </div>
