/* The window, as a function: shared by pages, dust and the volumetric pass,

const GLSL_WINDOW = /* glsl */`
uniform vec3 uL;

  float k=(p.z+40.0)/uL.z;

  float m=(1.0-smoothstep(5.0-s,5.0+s,ax))*smoothstep(5.0-s,5.0+s,q.y);
  float top=1.0-smoothstep(5.0-s,5.0+s,length(q-vec2(0.0,15.0)));
  float thin=min(1.0,0.09/(s*1.5+0.02));   // thin bars lose their shadow with distance

  float upper=smoothstep(0.10,0.10+s*2.0,abs(length(q-vec2(0.0,16.9))-1.9));
  float bars=mix(lower,upper,step(15.0,q.y))*smoothstep(0.09,0.09+s*2.0,abs(q.y-15.0));

}`;
const GLSL_NOISE = /* glsl */`

float hash3(vec3 p){ p=fract(p*0.3183099+vec3(0.1,0.2,0.3)); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }

  return mix(mix(mix(hash3(i),hash3(i+vec3(1,0,0)),f.x),mix(hash3(i+vec3(0,1,0)),hash3(i+vec3(1,1,0)),f.x),f.y),

function canvasTex(w, h, draw, opts = {}) {

}

/* ───────────────────────── architecture ───────────────────────── */
const boxGeo = new THREE.BoxGeometry(1, 1, 1);
const dummy = new THREE.Object3D();
function batch(mat, { cast = false, geo = boxGeo } = {}) {
  const items = [];
  return {
    add(x, y, z, sx, sy, sz, col) { items.push([x, y, z, sx, sy, sz, col]); },
    build() {
      const m = new THREE.InstancedMesh(geo, mat, items.length);
      items.forEach((it, i) => { dummy.position.set(it[0], it[1], it[2]); dummy.scale.set(it[3], it[4], it[5]); dummy.rotation.set(0, 0, 0); dummy.updateMatrix(); m.setMatrixAt(i, dummy.matrix); if (it[6]) m.setColorAt(i, it[6]); });
      m.castShadow = cast; m.receiveShadow = true; m.frustumCulled = false; scene.add(m); return m;
    }

}

{

    if (e.whoosh) playWhoosh(when, e.whoosh); else if (e.flick) playFlick(when, e.flick * 1.6, (Math.random() - .5) * 0.6); else playNote(e.m, when, e.v);
  }
  const lv = paperLevel(T), now = AC.currentTime;
  audio.rush.gain.setTargetAtTime(lv * lv * 0.05, now, 0.25); audio.wind.gain.setTargetAtTime(0.05 + lv * 0.11, now, 0.5);
  if (audio.nextFlick < T) audio.nextFlick = T;
  while (audio.nextFlick < T + 0.2) {
    if (lv > 0.01) { const n = Math.random() < 0.25 ? 3 + (Math.random() * 4 | 0) : 1, pan = Math.random() * 1.8 - 0.9;   // sometimes a whole page riffles
      for (let k = 0; k < n; k++) playFlick(audio.t0 + audio.nextFlick + k * (0.025 + Math.random() * 0.02), lv, pan); }
    audio.nextFlick += -Math.log(1 - Math.random()) / (1.5 + 30 * lv);
  }
}

/* ───────────────────────── run ───────────────────────── */
let playing = false, paused = false, silentT0 = 0, lastNow = performance.now(), slow = 0, warm = 0;
const gate = el('gate'), go = el('go'), hint = el('hint');
function now() { return performance.now() / 1000; }
function filmTime() {
  if (FREEZE !== null) return FREEZE;
  if (!playing) return 6.0;
  let T = audio.ctx ? audio.ctx.currentTime - audio.t0 : (paused ? silentT0 : now() - silentT0);
  if (T >= DUR) { restart(); T = 0; }
  return Math.max(T, 0);
}
function restart() { audio.idx = 0; audio.nextFlick = 0; if (audio.ctx) audio.t0 = audio.ctx.currentTime + 0.1; else silentT0 = now(); }
async function start() {
  go.disabled = true;
  try { buildAudio(); await audio.ctx.resume(); } catch (e) { audio.ctx = null; }
  playing = true; restart(); gate.classList.add('gone');
  hint.classList.add('on'); setTimeout(() => hint.classList.remove('on'), 6000);
}
go.addEventListener('click', start);
function togglePause() {
  if (!playing) return; paused = !paused;
  if (audio.ctx) paused ? audio.ctx.suspend() : audio.ctx.resume();
  else silentT0 = paused ? now() - silentT0 : now() - silentT0;
}
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); playing ? togglePause() : start(); }
  else if (e.key === 'm' || e.key === 'M') { audio.muted = !audio.muted; if (audio.master) audio.master.gain.value = audio.muted ? 0 : 0.85; }
  else if (e.key === 'f' || e.key === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); }
  else if (e.key === 'r' || e.key === 'R') { if (playing) restart(); }
});
window.addEventListener('pointermove', () => { if (!playing) return; hint.classList.add('on'); clearTimeout(hint._t); hint._t = setTimeout(() => hint.classList.remove('on'), 2500); });
document.addEventListener('visibilitychange', () => { if (!audio.ctx || paused) return; document.hidden ? audio.ctx.suspend() : audio.ctx.resume(); });

function frame() {
  requestAnimationFrame(frame);
  const n = performance.now(), dt = n - lastNow; lastNow = n;
  uClock.value = n / 1000;
  const T = filmTime();
  direct(T, uClock.value);
  if (playing && !paused) schedule(T);
  composer.render();
  // if the machine is struggling, give up pixels before giving up pages
  if (playing && !paused && ++warm > 90) { slow = dt > 30 ? slow + 1 : Math.max(0, slow - 1); if (slow > 45 && pixelRatio > 0.75) { pixelRatio = Math.max(0.75, pixelRatio - 0.25); slow = 0; warm = 0; resize(); } }
}
direct(FREEZE ?? 6, 0);
renderer.shadowMap.needsUpdate = true;
if (FREEZE !== null) gate.style.display = 'none';
go.disabled = false; go.textContent = '开始放映';
window.__ready = true;
frame();
</script>
