<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识索引</title>
<meta name="description" content="把难懂的知识点，做成可以上手玩的交互页。">
<style>
  :root{
    --bg:#0a0e14; --panel:#111826; --panel2:#0d1420; --line:#1f2c42;
    --text:#e6edf6; --dim:#93a5bd; --cyan:#67d7f9; --cyan-d:#164e63;
    --amber:#f5b04c; --green:#4ade80; --on-cyan:#08131a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.65;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1020px;margin:0 auto;padding:44px 22px 64px}
  header.head{margin-bottom:30px}
  .head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .kicker{color:var(--cyan);font-size:13px;letter-spacing:.35em;margin:0 0 10px}
  .lang-toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;
    overflow:hidden;background:var(--panel2);flex:0 0 auto}
  .lang-toggle button{appearance:none;border:0;background:transparent;color:var(--dim);
    font:inherit;font-size:13px;line-height:1.4;padding:5px 14px;cursor:pointer}
  .lang-toggle button + button{border-left:1px solid var(--line)}
  .lang-toggle button.on{background:var(--cyan);color:#08131a;font-weight:700}
  h1{font-size:40px;line-height:1.2;margin:0 0 10px;font-weight:800}
  .intro{color:var(--dim);font-size:16.5px;max-width:640px;margin:0}
  .intro b{color:var(--text)}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  .site-search{margin-top:22px;max-width:640px}
  .search-row{display:flex;flex-wrap:wrap;gap:8px}
  .search-row input{flex:1 1 300px;min-width:0;width:100%;min-height:48px;
    font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--dim);
    border-radius:12px;padding:12px}
  .search-row input::placeholder{color:var(--dim);opacity:1}
  .site-search .search-row input{flex-basis:160px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
  .chips + .chips{margin-top:10px}
  .chip{appearance:none;font:inherit;font-size:13.5px;color:var(--dim);cursor:pointer;
    background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 15px}
  .chip:hover{color:var(--text);border-color:var(--cyan-d)}
  .chip.on{background:var(--cyan);border-color:var(--cyan);color:#08131a;font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:18px}
  .section-head{grid-column:1/-1;margin:0}
  .section-title{font-size:22px;line-height:1.3;margin:0;font-weight:800}
  .section-sub{color:var(--dim);font-size:14.5px;margin:4px 0 0}
  .group-head{grid-column:1/-1;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;
    border-bottom:1px solid var(--line);padding-bottom:8px;margin-top:18px}
  .group-head:first-child{margin-top:0}
  .group-head h2{font-size:19px;line-height:1.3;margin:0;font-weight:800}
  .group-count{color:var(--dim);font-size:13.5px}
  a.card,div.card{display:block;background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid var(--line);border-radius:16px;padding:20px 22px;
    text-decoration:none;color:var(--text);position:relative;overflow:hidden;overflow-wrap:anywhere}
  a.card{transition:transform .15s ease,border-color .15s ease}
  a.card:hover{transform:translateY(-3px);border-color:var(--cyan-d)}
  a.card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;
    background:linear-gradient(90deg,var(--cyan),transparent 70%)}
  .card-badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .cat-badge,.stage-badge{display:inline-block;font-size:11.5px;color:var(--amber);
    border:1px solid #713f12;background:rgba(245,176,76,.08);border-radius:999px;padding:1px 10px}
  .stage-badge{color:var(--cyan);border-color:var(--cyan-d);background:rgba(103,215,249,.08)}
  .concept-badge{color:var(--cyan);border-color:var(--cyan-d);background:rgba(103,215,249,.08)}
  .card p.concept-in{margin-top:8px;font-size:13px}
  .card h2{font-size:20px;margin:0 0 8px 0;line-height:1.35}
  .card p{color:var(--dim);font-size:14.5px;margin:0}
  .badge{position:absolute;top:18px;right:18px;font-size:12px;border-radius:999px;padding:2px 10px}
  .badge.planned{color:var(--amber);border:1px solid #713f12;background:rgba(245,176,76,.08)}
  div.card.planned{opacity:.62}
  div.card.planned h2{padding-right:84px}
  .entrances{grid-column:1/-1;margin-top:26px}
  .essays{grid-column:1/-1;margin-top:26px}
  .essay-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:18px;margin-top:12px}
  .lang-badge{display:inline-block;font-size:11.5px;color:var(--text);border:1px solid var(--line);
    background:rgba(255,255,255,.04);border-radius:999px;padding:1px 10px}
  .entrance-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:14px;margin-top:12px}
  a.card.entrance{padding:18px 20px}
  a.card.entrance h3{font-size:17px;line-height:1.35;margin:0 0 6px;color:var(--cyan)}
  a.card.entrance p{font-size:14px}
  .tags{display:flex;flex-wrap:wrap;gap:7px}
  .tag{font-size:12px;color:var(--cyan);border:1px solid var(--cyan-d);
    border-radius:999px;padding:2px 10px;background:rgba(103,215,249,.06)}
  footer{margin-top:48px;color:var(--dim);font-size:13px;border-top:1px solid var(--line);padding-top:18px}
  .empty{color:var(--dim);border:1px dashed var(--line);border-radius:16px;padding:28px;text-align:center;grid-column:1/-1;margin:0}
  [hidden]{display:none!important}
  .chip,.lang-toggle button{min-width:48px;min-height:48px}
  :focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
  .lang-toggle button:focus-visible{outline-offset:-3px}
  .lang-toggle button.on:focus-visible{outline-color:var(--on-cyan)}
  .leetcode-search{margin-bottom:26px}
  .leetcode-search label{display:block;font-weight:700;margin-bottom:8px}
  .section-button{font:inherit;min-height:48px;min-width:48px;padding:8px 16px;
    color:var(--cyan);background:var(--panel2);border:1px solid var(--dim);
    border-radius:12px;cursor:pointer}
  .search-help,.result-status{font-size:.875rem;color:var(--dim);margin:12px 0 0}
  .site-search .result-status{margin-top:8px}
  .section-error{margin-top:16px}
  .section-error p{color:var(--text)}
  article.lesson-card{background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid var(--line);border-radius:16px;padding:22px;overflow-wrap:anywhere}
  .lesson-card h2{font-size:1.25rem;line-height:1.35;margin:12px 0;font-weight:700}
  .lesson-card h2 a{display:flex;align-items:center;min-height:48px;color:var(--text);text-decoration:none}
  .lesson-card a:hover{text-decoration:underline}
  .problem-number{color:var(--cyan);white-space:nowrap}
  .lesson-card p{font-size:1rem;margin:0 0 16px;color:var(--dim)}
  .lesson-meta{display:flex;flex-wrap:wrap;gap:8px;font-size:.875rem;color:var(--dim)}
  .lesson-actions{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:16px}
  .lesson-actions a{display:inline-flex;align-items:center;min-height:48px;color:var(--cyan);font-size:.875rem}
  @media(prefers-reduced-motion:reduce){a.card{transition:none}a.card:hover{transform:none}}
  @media(forced-colors:active){:focus-visible,.lang-toggle button.on:focus-visible{outline-color:Highlight}}
  @media (max-width:560px){
    .wrap{padding:28px 16px 52px}
    h1{font-size:31px}
    .intro{font-size:15.5px}
    .site-search{margin-top:18px}
    /* 窄屏：每行 chip 单行横向滚动，免得 20 个 chip 占满首屏；左右出血到屏幕边缘提示可滑动，
       上下留白避免 3px 焦点框被滚动容器裁掉 */
    .chips{flex-wrap:nowrap;overflow-x:auto;gap:6px;margin:10px -16px 0;padding:5px 16px;
      scrollbar-width:thin;scrollbar-color:var(--line) transparent}
    .chips + .chips{margin-top:2px}
    .chip{flex:0 0 auto;white-space:nowrap;padding:5px 12px}
    header.head{margin-bottom:24px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div class="head-row">
      <p class="kicker">KNOWLEDGE</p>
      <div class="lang-toggle" id="langToggle" role="group" aria-label="Language / 语言">
        <button type="button" data-lang="zh">中</button><button type="button" data-lang="en">EN</button>
      </div>
    </div>
    <h1 data-i18n="h1">知识索引</h1>
    <p class="intro" data-i18n-html="intro">把难懂的知识点，做成<b>可以上手玩的交互页</b>。一页一个主题，一步一个交互。</p>
    <div id="siteSearchBox" class="site-search" role="search">
      <label class="sr-only" for="siteSearch" data-i18n="siteSearchLabel">搜索全部页面</label>
      <div class="search-row">
        <input id="siteSearch" type="search" autocomplete="off" spellcheck="false" data-i18n-placeholder="siteSearchPlaceholder">
        <button id="siteSearchClear" class="section-button" type="button" data-i18n="siteSearchClear" hidden></button>
      </div>
      <p id="siteSearchCount" class="result-status" role="status" aria-live="polite" aria-atomic="true"></p>
    </div>
    <div class="chips" id="catChips" role="group" aria-label="Category filter / 分类筛选"></div>
    <div class="chips" id="stageChips" role="group" aria-label="Stage filter / 学段筛选"></div>
  </header>

  <section id="leetcodeSearch" class="leetcode-search" hidden aria-labelledby="searchLabel">
    <label id="searchLabel" for="problemSearch" data-i18n="searchLabel"></label>
    <div class="search-row">
      <input id="problemSearch" type="search" aria-describedby="searchHelp" autocomplete="off" spellcheck="false">
      <button id="clearSearch" class="section-button" type="button" data-i18n="clearSearch"></button>
    </div>
    <p id="searchHelp" class="search-help" data-i18n="searchHelp"></p>
    <p id="resultCount" class="result-status" role="status" aria-live="polite" aria-atomic="true"></p>
    <div id="sectionError" class="section-error" hidden>
      <p data-i18n="loadError"></p>
      <button id="retryLessons" class="section-button" type="button" data-i18n="retry"></button>
    </div>
  </section>
  <main id="grid" class="grid"></main>
  <noscript><p class="empty">这个索引页需要 JavaScript 才能列出条目。</p></noscript>

  <footer id="footer"></footer>
</div>

<script src="pages.config.js?v=20261115-net"></script>
<script>
(function(){
  'use strict';
  /* ---------- 索引页字典（与各知识页同一套双语规范） ---------- */
  var STR = {
    zh: {
      docTitle: '知识索引', h1: '知识索引',
      intro: '把难懂的知识点，做成<b>可以上手玩的交互页</b>。一页一个主题，一步一个交互。',
      featuredChip: '精选', allStage: '全部学段', badgePlanned: '筹备中',
      featuredTitle: '精选 · 从这里开始', featuredSub: '从 {total} 个页面里挑出的 {n} 个，小学到大学各有入口。',
      essaysTitle: '长文 · 一篇讲透一个领域', essaysSub: '每篇取一门学问里最要紧的十来个道理，每个都配一个可以亲手推动的模型。',
      onlyZh: '只有中文',
      entrancesTitle: '更多入口',
      entranceAtlasTitle: '知识图谱', entranceAtlasDesc: '沿着概念之间的关系逛，从一个问题走到一串知识点。',
      entranceLeetcodeTitle: 'LeetCode 专区', entranceLeetcodeDesc: '困难题的解法，一步一步推出来。',
      entranceDemosTitle: '演示', entranceDemosDesc: '不讲课，只看效果的作品。',
      entranceEditionsTitle: 'Claude Code 平行版本', entranceEditionsDesc: '同一个主题的另一种讲法，可以和原版对照着看。',
      siteSearchLabel: '搜索全部页面和概念', siteSearchPlaceholder: '搜一个不懂的词，例如：傅里叶、利息、光合作用',
      siteSearchCount: '找到 {n} 个页面', siteSearchEmpty: '没有匹配的页面或概念，换个词试试。', siteSearchClear: '清空',
      siteSearchBoth: '找到 {c} 个概念、{n} 个页面', conceptBadge: '概念 · 直达讲解处', conceptIn: '在「{page}」里', conceptInAtlas: '在知识地图里',
      otherSubtopic: '其他', groupCount: '{n} 个页面',
      emptyText: '还没有登记任何知识页。', emptyFilter: '这个组合下还没有页面。',
      searchLabel:'查找 LeetCode 课程', searchHelp:'输入准确题号（如 #51）、中英文题名或知识点。多个词用空格分隔，需同时匹配。',
      clearSearch:'清空搜索', loading:'正在读取课程列表…', loadError:'暂时无法读取课程列表，请重试。', retry:'重试',
      count:'找到 {shown} / {total} 篇可用课程', noMatches:'没有匹配的课程。试试题号、题名或知识点，或清空搜索。',
      emptyCollection:'课程列表目前为空。', hard:'困难', explore:'开始推导 →', official:'LeetCode 原题 ↗',
      footerText: '共 {total} 个交互页 · 每页都是纯静态单页，可离线打开。'
    },
    en: {
      docTitle: 'Knowledge Index', h1: 'Knowledge Index',
      intro: 'Turn hard ideas into <b>interactive pages you can try for yourself</b>. One topic per page, one interaction per step.',
      featuredChip: 'Featured', allStage: 'All Stages', badgePlanned: 'Planned',
      featuredTitle: 'Featured · Start Here', featuredSub: '{n} picks from {total} pages, with entry points from primary school through university.',
      essaysTitle: 'Long Reads · One Essay, One Field', essaysSub: 'Each takes the ten or so core ideas of a subject and gives every one a model you can push around.',
      onlyZh: 'Chinese only',
      entrancesTitle: 'More Ways In',
      entranceAtlasTitle: 'Knowledge Atlas', entranceAtlasDesc: 'Wander along the links between concepts, from one question to a chain of ideas.',
      entranceLeetcodeTitle: 'LeetCode Corner', entranceLeetcodeDesc: 'Solutions to hard problems, worked out one step at a time.',
      entranceDemosTitle: 'Demos', entranceDemosDesc: 'Pieces that skip the lecture and just show you what happens.',
      entranceEditionsTitle: 'Claude Code Parallel Editions', entranceEditionsDesc: 'Another take on the same topic, to read side by side with the original.',
      siteSearchLabel: 'Search all pages and concepts', siteSearchPlaceholder: 'Look up anything, e.g. Fourier, interest, photosynthesis',
      siteSearchCount: '{n} pages found', siteSearchCountOne: '1 page found', siteSearchEmpty: 'No matching pages or concepts. Try different words.', siteSearchClear: 'Clear',
      siteSearchBoth: '{c} concepts and {n} pages found', siteSearchBothOne: '{c} concept and {n} pages found', conceptBadge: 'Concept · jumps to the explanation', conceptIn: 'In: {page}', conceptInAtlas: 'In the Knowledge Atlas',
      otherSubtopic: 'Other', groupCount: '{n} pages', groupCountOne: '1 page',
      emptyText: 'No knowledge pages have been registered yet.', emptyFilter: 'No pages yet for this combination.',
      searchLabel:'Find a LeetCode lesson', searchHelp:'Enter an exact ID (such as #51), a title in either language, or a topic. Space-separated words must all match.',
      clearSearch:'Clear search', loading:'Loading lessons…', loadError:'The lesson list could not be loaded. Please retry.', retry:'Retry',
      count:'{shown} of {total} available lessons', noMatches:'No matching lessons. Try an ID, title or topic, or clear the search.',
      emptyCollection:'This collection currently has no lessons.', hard:'Hard', explore:'Explore the lesson →', official:'View on LeetCode ↗',
      footerText: '{total} interactive pages · Each page is a self-contained static page that opens offline.'
    }
  };

  /* ---------- 语言状态（全站共享 knowledge-lang，规则同 UI-I18N-SPEC） ---------- */
  var memLang = null;
  function readStored() {
    try {
      var v = localStorage.getItem('knowledge-lang');
      if (v === 'zh' || v === 'en') return v;
    } catch (e) {}
    return memLang;
  }
  var lang = readStored() || (((navigator.language || 'en').toLowerCase().indexOf('zh') === 0) ? 'zh' : 'en');
  function t(key) {
    return (STR[lang] && STR[lang][key] != null) ? STR[lang][key]
         : (STR.zh[key] != null ? STR.zh[key] : key);
  }
  // 配置字段取值：{zh,en} 对象按当前语言；纯字符串（旧条目）原样返回
  function pick(v) {
    if (v == null) return '';
    if (typeof v === 'string') return v;
    return v[lang] != null ? v[lang] : (v.zh != null ? v.zh : (v.en != null ? v.en : ''));
  }
  function fill(str, vars) {
    return str.replace(/\{(\w+)\}/g, function(m, k){ return vars[k] != null ? String(vars[k]) : m; });
  }

  var grid = document.getElementById('grid');
  var chipsBox = document.getElementById('catChips');
  var stageBox = document.getElementById('stageChips');
  var siteBox = document.getElementById('siteSearchBox');
  var siteInput = document.getElementById('siteSearch');
  var siteClear = document.getElementById('siteSearchClear');
  var siteCount = document.getElementById('siteSearchCount');
  var footer = document.getElementById('footer');
  var categories = window.KNOWLEDGE_CATEGORIES || [];
  var stages = window.KNOWLEDGE_STAGES || [];
  var subtopics = window.KNOWLEDGE_SUBTOPICS || {};
  // 已上线的排在前面（Array.prototype.sort 稳定，其余保持登记顺序）
  var pages = (window.KNOWLEDGE_PAGES || []).slice().sort(function(a, b){
    return (a.status === 'live' ? 0 : 1) - (b.status === 'live' ? 0 : 1);
  });
  var bySlug = {};
  pages.forEach(function(pg){ if (pg.slug && !bySlug[pg.slug]) bySlug[pg.slug] = pg; });
  // 精选：按 KNOWLEDGE_FEATURED 的顺序取，未登记的 slug 静默跳过
  var featured = (window.KNOWLEDGE_FEATURED || []).map(function(s){ return bySlug[s]; }).filter(Boolean);
  // 长文：按 KNOWLEDGE_ESSAYS 的顺序取，规则同精选
  var essays = (window.KNOWLEDGE_ESSAYS || []).map(function(s){ return bySlug[s]; }).filter(Boolean);
  var essaySlugs = {};
  (window.KNOWLEDGE_ESSAYS || []).forEach(function(s){ essaySlugs[s] = true; });
  var liveCount = pages.filter(function(pg){ return pg.status === 'live'; }).length;
  var activeCat = 'all';
  var activeStage = 'all';
  var siteComposing = false, siteCompositionQuery = '';

  function catName(id) {
    for (var i = 0; i < categories.length; i++) if (categories[i].id === id) return pick(categories[i].name);
    return id;
  }
  function stageName(id) {
    for (var i = 0; i < stages.length; i++) if (stages[i].id === id) return pick(stages[i].name);
    return id;
  }
  function pageStage(pg) { return pg.stage || 'university'; }

  function renderChips() {
    // 按钮只建一次：之后仅同步文案与选中态，不重建节点——否则每次点击/切语言都会丢键盘焦点
    if (!chipsBox.children.length) {
      var defs = [{ id: 'all' }];
      categories.forEach(function(c){ defs.push({ id: c.id }); });
      defs.forEach(function(d){
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'chip';
        b.dataset.cat = d.id;
        b.addEventListener('click', function(){ selectCategory(d.id); });
        chipsBox.appendChild(b);
      });
    }
    chipsBox.querySelectorAll('button').forEach(function(b){
      var id = b.dataset.cat;
      // 第一个 chip 代表首页（精选），仍用 data-cat="all"
      b.textContent = id === 'all' ? t('featuredChip') : catName(id);
      b.classList.toggle('on', activeCat === id);
      b.setAttribute('aria-pressed', String(activeCat === id));
    });
  }

  function renderStageChips() {
    // 同 renderChips：节点只建一次，之后仅同步文案与选中态
    if (!stageBox.children.length) {
      var defs = [{ id: 'all' }];
      stages.forEach(function(s){ defs.push({ id: s.id }); });
      defs.forEach(function(d){
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'chip';
        b.dataset.stage = d.id;
        b.addEventListener('click', function(){
          if (activeStage === d.id) return;
          activeStage = d.id;
          saveView(true); renderStageChips(); renderCards();
        });
        stageBox.appendChild(b);
      });
    }
    stageBox.querySelectorAll('button').forEach(function(b){
      var id = b.dataset.stage;
      b.textContent = id === 'all' ? t('allStage') : stageName(id);
      b.classList.toggle('on', activeStage === id);
      b.setAttribute('aria-pressed', String(activeStage === id));
    });
  }

  /* ---------- 全站搜索（?s=，与 LeetCode 的 ?q= 互不干扰） ---------- */
  var normalized = function(value) { return value.normalize('NFKC').toLowerCase(); };
  function textsOf(v) {
    if (v == null) return [];
    if (typeof v === 'string') return [v];
    return [v.zh, v.en].filter(function(x){ return typeof x === 'string'; });
  }
  var searchIndex = pages.map(function(pg){
    var parts = textsOf(pg.title).concat(textsOf(pg.desc));
    (pg.tags || []).forEach(function(tag){ parts = parts.concat(textsOf(tag)); });
    return normalized(parts.join(' '));
  });
  function siteQuery() { return (siteComposing ? siteCompositionQuery : siteInput.value).trim(); }
  function matchesQuery(list, query) {

    siteInput.value = ''; siteComposing = false; saveView(false); renderCards(); siteInput.focus();
  });
  window.addEventListener('popstate',function() { composing = false; siteComposing = false; readView(); renderChips(); renderStageChips(); renderCards(); revealPressed(chipsBox); revealPressed(stageBox); });
  readView();
  if (siteInput.value) loadConcepts();

  function applyLang() {
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    document.title = t('docTitle');
    document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent = t(el.getAttribute('data-i18n')); });
    document.querySelectorAll('[data-i18n-html]').forEach(function(el){ el.innerHTML = t(el.getAttribute('data-i18n-html')); });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el){ el.placeholder = t(el.getAttribute('data-i18n-placeholder')); });
    document.querySelectorAll('#langToggle button').forEach(function(b){
      b.classList.toggle('on', b.dataset.lang === lang);
      b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
    });
    renderChips();
    renderStageChips();
    renderCards();
    renderFooter();
    revealPressed(chipsBox); revealPressed(stageBox);
  }
  function setLang(l) {
    if (l !== 'zh' && l !== 'en') return;
    lang = l; memLang = l;
    try { localStorage.setItem('knowledge-lang', l); } catch (e) {}
    applyLang();
  }
  document.querySelectorAll('#langToggle button').forEach(function(b){
    b.addEventListener('click', function(){ setLang(b.dataset.lang); });
  });
  applyLang();
})();
</script>
</body>
</html>
