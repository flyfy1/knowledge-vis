<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="category" content="biology"><meta name="stage" content="senior">
<title>Body in balance</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#0c0e13; --card:#141821; --card2:#1a1f2b; --line:#2b3242; --ink:#ebe8e0; --body:#d5d7de; --mute:#a3aab8; --dim:#9098a8;
    --gold:#e9b949; --cyan:#63c7e6; --red:#f07a6d; --green:#7ad6a0; --violet:#b39dfb;
    --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",Georgia,serif;
    --sans:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
    --mono:ui-monospace,Menlo,Consolas,monospace; }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior:auto; } *, *::before, *::after { transition:none !important; animation:none !important; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.85 var(--sans); -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  a { color:var(--cyan); }
  a:focus-visible, button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline:2px solid var(--gold); outline-offset:3px; }
  .wrap { max-width:760px; margin:0 auto; padding:0 20px; }
  .wide { max-width:980px; margin:0 auto; padding:0 20px; }

  .topbar { position:absolute; top:0; left:0; right:0; z-index:5; display:flex; justify-content:space-between; align-items:center; padding:8px 12px; gap:8px; }
  .back { display:inline-flex; align-items:center; min-height:48px; padding:0 10px; color:var(--mute); text-decoration:none; font-size:14px; }
  .back:hover { color:var(--ink); }
  #langToggle { display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--card); }
  #langToggle button { min-width:48px; min-height:48px; border:0; border-radius:0; background:transparent; color:var(--mute); font:600 14px/1 var(--sans); padding:0 12px; cursor:pointer; }
  #langToggle button + button { border-left:1px solid var(--line); }
  #langToggle button[aria-pressed="true"] { background:rgba(233,185,73,.16); color:var(--gold); }

  .hero { min-height:88vh; display:flex; align-items:center; border-bottom:1px solid var(--line); }
  .hero .wrap { padding-top:96px; padding-bottom:64px; width:100%; }
  .kicker { font:12px/1.4 var(--mono); letter-spacing:.24em; color:var(--gold); text-transform:uppercase; }
  h1 { font:400 clamp(44px,9vw,104px)/1.12 var(--serif); letter-spacing:.04em; margin:.3em 0 .25em; }
  .sub { font:400 clamp(18px,2.6vw,25px)/1.6 var(--serif); margin:0 0 1.4em; }
  .lead { color:var(--body); max-width:36em; }
  .note { font-size:15px; color:var(--mute); border-left:2px solid var(--line); padding-left:14px; margin-top:1.8em; max-width:36em; line-height:1.75; }
  .note strong { color:var(--ink); font-weight:600; }

  .toc { padding:52px 0 8px; }
  .toc h2 { font:12px/1 var(--mono); letter-spacing:.24em; color:var(--mute); margin:0 0 14px; font-weight:400; }
  .toc ol { list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:0 22px; }
  .toc a { display:flex; align-items:center; gap:12px; min-height:48px; text-decoration:none; color:var(--ink); border-bottom:1px solid var(--line); font-size:15px; line-height:1.4; }
  .toc a:hover { color:var(--gold); }
  .toc a span { font:12px/1 var(--mono); color:var(--mute); }

  .ch { padding-top:96px; }
  .num { font:400 15px/1 var(--mono); color:var(--gold); letter-spacing:.2em; }
  .ch h2 { font:400 clamp(26px,4.2vw,38px)/1.35 var(--serif); margin:.45em 0 .5em; letter-spacing:.02em; }
  .law { font:400 clamp(19px,2.5vw,23px)/1.7 var(--serif); border-left:3px solid var(--gold); padding:4px 0 4px 18px; margin:0 0 1.5em; }
  .ch p { margin:0 0 1.15em; color:var(--body); }
  .ch p strong, .ch li strong { color:var(--ink); font-weight:600; }
  .ch ul, .ch ol.plain { padding-left:1.3em; margin:0 0 1.2em; color:var(--body); }
  .ch li { margin:.45em 0; }
  .take { color:var(--mute) !important; font-size:15.5px; }
  .tag { display:inline-block; font:600 12px/1 var(--sans); padding:5px 8px; border-radius:6px; margin-right:6px; vertical-align:2px; white-space:nowrap; }
  .tag.h { background:rgba(122,214,160,.16); color:var(--green); } .tag.m { background:rgba(233,185,73,.16); color:var(--gold); } .tag.l { background:rgba(240,122,109,.16); color:var(--red); }

  figure.lab { margin:34px auto; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px 22px 18px; }
  .lab h3 { margin:0 0 4px; font:600 16px/1.5 var(--sans); color:var(--ink); }
  .lab .how { margin:0 0 14px; font-size:14.5px; color:var(--mute); line-height:1.65; }
  .cv { width:100%; height:300px; display:block; border-radius:10px; background:#0f1219; touch-action:pan-y; }
  .cv.tall { height:360px; } .cv.short { height:170px; margin-top:10px; }
  .ctl { display:flex; flex-wrap:wrap; gap:4px 22px; align-items:center; margin:12px 0 2px; font-size:14.5px; color:var(--mute); }
  .ctl label.rng { display:flex; align-items:center; gap:10px; flex:1 1 260px; min-width:0; min-height:48px; }
  .ctl label.rng > span { flex:0 0 auto; white-space:nowrap; }
  .toc a b { font-weight:400; }
  .ctl output { flex:0 0 auto; white-space:nowrap; min-width:4.6em; text-align:right; color:var(--ink); font:500 14px/1.3 var(--mono); }
  input[type=range] { flex:1 1 auto; min-width:80px; height:48px; margin:0; accent-color:var(--gold); background:transparent; cursor:pointer; }
  label.chk { display:inline-flex; align-items:center; gap:10px; min-height:48px; padding:0 4px; cursor:pointer; color:var(--ink); }
  input[type=checkbox], input[type=radio] { accent-color:var(--gold); width:20px; height:20px; margin:0; cursor:pointer; }
  .seg { display:inline-flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .seg .lbl { margin-right:4px; }
  .seg label { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; min-width:48px; padding:0 14px; border:1px solid var(--line); border-radius:999px; background:var(--card2); color:var(--ink); cursor:pointer; font-size:14px; }
  .seg label:has(input:checked) { border-color:var(--gold); color:var(--gold); background:rgba(233,185,73,.12); }
  .seg input { position:absolute; opacity:0; width:1px; height:1px; }
  .seg label:has(input:focus-visible) { outline:2px solid var(--gold); outline-offset:2px; }
  button.b { font:inherit; font-size:14.5px; color:var(--ink); background:var(--card2); border:1px solid var(--line); border-radius:999px; min-height:48px; padding:0 18px; cursor:pointer; line-height:1.3; }
  button.b:hover { border-color:var(--gold); }
  button.b[aria-pressed="true"] { background:rgba(233,185,73,.16); border-color:var(--gold); color:var(--gold); }
  .read { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-top:14px; }
  .read div { background:var(--card2); border-radius:10px; padding:10px 12px; font-size:13px; color:var(--mute); line-height:1.5; min-width:0; }
  .read b { display:block; font:600 20px/1.3 var(--sans); color:var(--ink); font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
  .read b.g { color:var(--gold); } .read b.r { color:var(--red); } .read b.c { color:var(--cyan); } .read b.n { color:var(--green); } .read b.v { color:var(--violet); }
  .say { margin:14px 0 0; font-size:15px; color:var(--ink); line-height:1.7; min-height:3.4em; }
  .say em { font-style:normal; color:var(--gold); }
  .legend { display:flex; flex-wrap:wrap; gap:6px 18px; font-size:13.5px; color:var(--mute); margin-top:10px; }
  .legend i { display:inline-block; width:14px; height:4px; border-radius:2px; margin-right:6px; vertical-align:3px; }
  .legend i.dash { background:repeating-linear-gradient(90deg,currentColor 0 4px,transparent 4px 7px) !important; }
  .legend i.band { height:10px; vertical-align:0; }

  .sum { margin:50px 0 0; padding:24px 24px; border:1px solid var(--line); border-radius:16px; background:linear-gradient(180deg,rgba(233,185,73,.07),transparent); font:400 clamp(17px,2.2vw,20px)/1.95 var(--serif); }
  .sum em { font-style:normal; color:var(--gold); }
  .qs { counter-reset:q; list-style:none; padding:0 !important; }
  .qs li { counter-increment:q; position:relative; padding:14px 0 14px 46px !important; border-bottom:1px solid var(--line); margin:0 !important; }
  .qs li::before { content:counter(q); position:absolute; left:0; top:14px; width:30px; height:30px; border-radius:50%; border:1px solid var(--gold); color:var(--gold); font:600 14px/28px var(--mono); text-align:center; }

  footer { margin:100px 0 0; padding:40px 0 70px; border-top:1px solid var(--line); color:var(--mute); font-size:14px; line-height:1.8; }
  footer a { color:var(--mute); }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  @media (max-width:640px) {
    body { font-size:16px; } .wrap,.wide { padding:0 16px; }
    figure.lab { padding:16px 12px 14px; border-radius:14px; }
    .cv { height:250px; } .cv.tall { height:330px; } .cv.short { height:150px; }
    .ch { padding-top:76px; } .read { grid-template-columns:repeat(2,minmax(0,1fr)); } .read b { font-size:17px; }
    .ctl label.rng { flex-basis:100%; }
  }
  @media (max-width:420px) {
    .ctl label.rng { flex-wrap:wrap; gap:0 10px; justify-content:space-between; }
    .ctl label.rng input[type=range] { order:3; flex:1 1 100%; }
  }
</style>
</head>

<div class="topbar">
  <a class="back" href="../../../" data-i18n="nav.back"></a>
  <div id="langToggle" role="group" data-i18n-aria="nav.lang"><button type="button" data-lang="zh" aria-pressed="false">中</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div>

<main>
<!-- 01 leaky bucket -->
<section class="ch" id="ch1">
  <div class="wrap">
    <div class="num">01</div>
    <h2 data-i18n="ch1.title"></h2>
    <p class="law" data-i18n-html="ch1.law"></p>
    <p data-i18n-html="ch1.p1"></p>
    <p data-i18n-html="ch1.p2"></p>
  </div>
  <div class="wide"><figure class="lab">
    <h3 data-i18n="ch1.model.title"></h3>
    <p class="how" data-i18n-html="ch1.model.how"></p>
    <canvas class="cv" id="bkCv" role="img" data-i18n-aria="ch1.model.aria"></canvas>
    <div class="ctl">
      <label class="rng"><span data-i18n="ch1.ctl.inflow"></span><input type="range" id="bkI" min="0.5" max="3" step="0.1" value="2"><output id="bkIo"></output></label>
      <label class="rng"><span data-i18n="ch1.ctl.hole"></span><input type="range" id="bkK" min="0.1" max="0.5" step="0.01" value="0.2"><output id="bkKo"></output></label>
    </div>
    <div class="ctl">
      <button type="button" class="b" id="bkAdd" data-i18n="ch1.btn.add"></button>
      <button type="button" class="b" id="bkSub" data-i18n="ch1.btn.sub"></button>
    </div>
    <div class="read">
      <div><b class="c" id="bkL"></b><span data-i18n="ch1.read.level"></span></div>
      <div><b id="bkIn"></b><span data-i18n="ch1.read.in"></span></div>
      <div><b class="g" id="bkOut"></b><span data-i18n="ch1.read.out"></span></div>
      <div><b class="n" id="bkHalf"></b><span data-i18n="ch1.read.half"></span></div>
    </div>
    <p class="say" id="bkSay" aria-live="polite"></p>
  </figure></div>
  <div class="wrap">
    <p data-i18n-html="ch1.p3"></p>
    <p data-i18n-html="ch1.p4"></p>
    <p class="take" data-i18n-html="ch1.limit"></p>
  </div>
</section>

<!-- 02 half-life and plateau -->
<section class="ch" id="ch2">
  <div class="wrap">
    <div class="num">02</div>
    <h2 data-i18n="ch2.title"></h2>
    <p class="law" data-i18n-html="ch2.law"></p>
    <p data-i18n-html="ch2.p1"></p>
    <p data-i18n-html="ch2.p2"></p>
  </div>
  <div class="wide"><figure class="lab">
    <h3 data-i18n="ch2.model.title"></h3>
    <p class="how" data-i18n-html="ch2.model.how"></p>
    <canvas class="cv" id="dsCv" role="img" data-i18n-aria="ch2.model.aria"></canvas>
    <div class="legend"><span><i style="background:var(--cyan)"></i><span data-i18n="ch2.leg.level"></span></span><span style="color:var(--gold)"><i class="dash"></i><span data-i18n="ch2.leg.plateau"></span></span><span><i style="background:var(--mute);width:4px;height:12px;vertical-align:-1px"></i><span data-i18n="ch2.leg.dose"></span></span></div>
    <div class="ctl">
      <label class="rng"><span data-i18n="ch2.ctl.half"></span><input type="range" id="dsH" min="2" max="24" step="1" value="8"><output id="dsHo"></output></label>
      <label class="rng"><span data-i18n="ch2.ctl.interval"></span><input type="range" id="dsT" min="4" max="24" step="2" value="8"><output id="dsTo"></output></label>
    </div>
    <div class="ctl">
      <div class="seg" role="radiogroup" data-i18n-aria="ch2.ctl.plan">
        <label><input type="radio" name="dsPlan" value="ok" checked><span data-i18n="ch2.plan.ok"></span></label>
        <label><input type="radio" name="dsPlan" value="miss"><span data-i18n="ch2.plan.miss"></span></label>
        <label><input type="radio" name="dsPlan" value="double"><span data-i18n="ch2.plan.double"></span></label>
      </div>
      <button type="button" class="b" id="dsReplay" data-i18n="common.replay"></button>
    </div>
    <div class="read">
      <div><b class="c" id="dsNow"></b><span data-i18n="ch2.read.now"></span></div>
      <div><b class="n" id="dsHalves"></b><span data-i18n="ch2.read.halves"></span></div>
      <div><b class="g" id="dsPeak"></b><span data-i18n="ch2.read.peak"></span></div>
      <div><b id="dsTrough"></b><span data-i18n="ch2.read.trough"></span></div>
    </div>
    <p class="say" id="dsSay" aria-live="polite"></p>
  </figure></div>
  <div class="wrap">
    <p data-i18n-html="ch2.p3"></p>
    <p data-i18n-html="ch2.p4"></p>
    <p class="take" data-i18n-html="ch2.limit"></p>
  </div>
</section>

<!-- 03 alcohol -->
<section class="ch" id="ch3">
  <div class="wrap">
    <div class="num">03</div>
    <h2 data-i18n="ch3.title"></h2>
    <p class="law" data-i18n-html="ch3.law"></p>
    <p data-i18n-html="ch3.p1"></p>
    <p data-i18n-html="ch3.p2"></p>
  </div>
  <div class="wide"><figure class="lab">
    <h3 data-i18n="ch3.model.title"></h3>
    <p class="how" data-i18n-html="ch3.model.how"></p>
    <canvas class="cv" id="alCv" role="img" data-i18n-aria="ch3.model.aria"></canvas>
    <div class="ctl">
      <label class="rng"><span data-i18n="ch3.ctl.n"></span><input type="range" id="alN" min="1" max="8" step="1" value="4"><output id="alNo"></output></label>
      <label class="rng"><span data-i18n="ch3.ctl.gap"></span><input type="range" id="alG" min="0.25" max="2" step="0.25" value="1"><output id="alGo"></output></label>
    </div>
    <div class="ctl"><button type="button" class="b" id="alReplay" data-i18n="common.replay"></button></div>
    <div class="read">
      <div><b class="c" id="alPeak"></b><span data-i18n="ch3.read.peak"></span></div>
      <div><b class="g" id="alClear"></b><span data-i18n="ch3.read.clear"></span></div>
      <div><b id="alRate"></b><span data-i18n="ch3.read.rate"></span></div>
      <div><b class="r" id="alPace"></b><span data-i18n="ch3.read.pace"></span></div>
    </div>
    <p class="say" id="alSay" aria-live="polite"></p>
  </figure></div>
  <div class="wrap">
    <p data-i18n-html="ch3.p3"></p>
    <p data-i18n-html="ch3.p4"></p>
    <p class="take" data-i18n-html="ch3.limit"></p>
  </div>

<!-- 04 glucose -->
<section class="ch" id="ch4">
  <div class="wrap">
    <div class="num">04</div>
    <h2 data-i18n="ch4.title"></h2>
    <p class="law" data-i18n-html="ch4.law"></p>
    <p data-i18n-html="ch4.p1"></p>
    <p data-i18n-html="ch4.p2"></p>
  </div>
  <div class="wide"><figure class="lab">
    <h3 data-i18n="ch4.model.title"></h3>
    <p class="how" data-i18n-html="ch4.model.how"></p>
    <canvas class="cv tall" id="glCv" role="img" data-i18n-aria="ch4.model.aria"></canvas>
    <div class="legend"><span><i style="background:var(--cyan)"></i><span data-i18n="ch4.leg.g"></span></span><span><i style="background:var(--violet)"></i><span data-i18n="ch4.leg.i"></span></span><span><i class="band" style="background:rgba(122,214,160,.25)"></i><span data-i18n="ch4.leg.band"></span></span><span style="color:var(--red)"><i class="dash"></i><span data-i18n="ch4.leg.line"></span></span></div>
    <div class="ctl">
      <label class="rng"><span data-i18n="ch4.ctl.gain"></span><input type="range" id="glGain" min="10" max="200" step="5" value="100"><output id="glGaino"></output></label>
      <label class="rng"><span data-i18n="ch4.ctl.delay"></span><input type="range" id="glDelay" min="0" max="40" step="1" value="10"><output id="glDelayo"></output></label>
    </div>
    <div class="ctl">
      <div class="seg" role="radiogroup" data-i18n-aria="ch4.ctl.meal">
        <span class="lbl" data-i18n="ch4.ctl.meal"></span>
        <label><input type="radio" name="glMeal" value="3"><span data-i18n="ch4.meal.s"></span></label>
        <label><input type="radio" name="glMeal" value="5.5" checked><span data-i18n="ch4.meal.m"></span></label>
        <label><input type="radio" name="glMeal" value="8"><span data-i18n="ch4.meal.l"></span></label>
      </div>
      <label class="chk"><input type="checkbox" id="glGlu" checked><span data-i18n="ch4.ctl.glucagon"></span></label>
      <button type="button" class="b" id="glReplay" data-i18n="ch4.btn.eat"></button>
    </div>
    <div class="read">
      <div><b class="c" id="glPeak"></b><span data-i18n="ch4.read.peak"></span></div>
      <div><b id="gl120"></b><span data-i18n="ch4.read.at120"></span></div>
      <div><b class="r" id="glLow"></b><span data-i18n="ch4.read.low"></span></div>
      <div><b class="g" id="glAbove"></b><span data-i18n="ch4.read.above"></span></div>
    </div>
    <p class="say" id="glSay" aria-live="polite"></p>
  </figure></div>
  <div class="wrap">
    <p data-i18n-html="ch4.p3"></p>
    <p data-i18n-html="ch4.p4"></p>
    <p class="take" data-i18n-html="ch4.limit"></p>
  </div>
</section>

<!-- 05 temperature and fever -->
<section class="ch" id="ch5">
  <div class="wrap">
    <div class="num">05</div>
    <h2 data-i18n="ch5.title"></h2>
    <p class="law" data-i18n-html="ch5.law"></p>
    <p data-i18n-html="ch5.p1"></p>
    <p data-i18n-html="ch5.p2"></p>
