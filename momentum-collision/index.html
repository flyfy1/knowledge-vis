<nav class="step-nav" aria-label="Lesson steps"><a href="#step0" data-i18n="nav0"></a><a href="#step1" data-i18n="nav1"></a><a href="#step2" data-i18n="nav2"></a><a href="#step3" data-i18n="nav3"></a><a href="#step4" data-i18n="nav4"></a></nav>
<main>
<section class="step" id="step0"><div class="step-inner"><p class="step-kicker" data-i18n="s0k"></p><h2 data-i18n="s0t"></h2><p class="explain" data-i18n-html="s0e"></p><div class="grid"><div class="stage"><canvas id="s0Canvas" role="img"></canvas><p class="readout" id="s0-ro" aria-live="polite"></p></div><div class="controls"><label class="control"><span data-i18n="mass"></span><output id="massOut"></output><input id="mass" type="range" min="1" max="10" step="0.5" value="3"></label><label class="control"><span data-i18n="velocity"></span><output id="velocityOut"></output><input id="velocity" type="range" min="-8" max="8" step="0.5" value="4"></label></div></div><p class="hint" data-i18n="s0hint"></p></div></section>
<section class="step" id="step1"><div class="step-inner"><p class="step-kicker" data-i18n="s1k"></p><h2 data-i18n="s1t"></h2><p class="explain" data-i18n-html="s1e"></p><div class="grid"><div class="stage"><canvas id="s1Canvas" role="img"></canvas><p class="readout" id="s1-ro" aria-live="polite"></p></div><div class="controls"><label class="control"><span data-i18n="force"></span><output id="forceOut"></output><input id="force" type="range" min="-12" max="12" step="1" value="6"></label><label class="control"><span data-i18n="time"></span><output id="timeOut"></output><input id="time" type="range" min="0.25" max="4" step="0.25" value="3"></label></div></div><p class="hint" data-i18n="s1hint"></p></div></section>
<section class="step" id="step2"><div class="step-inner"><p class="step-kicker" data-i18n="s2k"></p><h2 data-i18n="s2t"></h2><p class="explain" data-i18n-html="s2e"></p><div class="mode-toggle" role="group" aria-label="Collision mode"><button id="elastic" type="button" data-mode="elastic" data-i18n="elastic"></button><button id="sticky" type="button" data-mode="sticky" data-i18n="sticky"></button></div><div class="grid"><div class="stage"><canvas id="s2Canvas" role="img"></canvas><p class="readout" id="s2-ro" aria-live="polite"></p></div><div class="controls"><label class="control"><span data-i18n="mass1"></span><output id="m1Out"></output><input id="m1" type="range" min="1" max="8" step="0.5" value="2"></label><label class="control"><span data-i18n="speed1"></span><output id="u1Out"></output><input id="u1" type="range" min="-6" max="6" step="0.5" value="5"></label><label class="control"><span data-i18n="mass2"></span><output id="m2Out"></output><input id="m2" type="range" min="1" max="8" step="0.5" value="3"></label><label class="control"><span data-i18n="speed2"></span><output id="u2Out"></output><input id="u2" type="range" min="-6" max="6" step="0.5" value="-1"></label></div></div><p class="hint" data-i18n="s2hint"></p></div></section>
<section class="step" id="step3"><div class="step-inner"><p class="step-kicker" data-i18n="s3k"></p><h2 data-i18n="s3t"></h2><p class="explain" data-i18n-html="s3e"></p><div class="grid"><div class="stage"><canvas id="s3Canvas" role="img"></canvas><p class="readout" id="s3-ro" aria-live="polite"></p></div><div class="controls"><label class="control"><span data-i18n="stopMass"></span><output id="stopMassOut"></output><input id="stopMass" type="range" min="1" max="10" step="0.5" value="4"></label><label class="control"><span data-i18n="stopSpeed"></span><output id="stopSpeedOut"></output><input id="stopSpeed" type="range" min="1" max="12" step="1" value="8"></label><label class="control"><span data-i18n="stopTime"></span><output id="stopTimeOut"></output><input id="stopTime" type="range" min="1" max="8" step="1" value="2"></label></div></div><p class="hint" data-i18n="s3hint"></p></div></section>
