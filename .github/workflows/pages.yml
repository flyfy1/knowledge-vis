# 发布 visual.integ.life 到 GitHub Pages。
# 原则：线上 = git。只发布本次提交里的文件；不生成页面，只按排除规则筛掉非站点文件。
# 排除规则的依据与体积核算见 README「部署」一节。
name: Pages

# 迁移到 Pages 之前只允许手动触发：仓库的 Pages 尚未开启，push 触发只会得到失败的 deploy。
# 开启 Pages 后把 push 触发加回来：  push: { branches: [main] }
on:
  workflow_dispatch:

# 默认只读；只有 deploy 作业拿到 Pages 写权限和 OIDC token。
permissions:
  contents: read

# 同一时间只部署一次；不取消进行中的部署，避免线上处于半发布状态。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # 浅克隆 + 稀疏检出：跳过 GB 级的评审截图和测试证据，不下载它们的 blob。
      # 这里只是提速；真正决定发布内容的是下面 rsync 的排除表（两者必须保持「稀疏 ⊆ 排除」）。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/specs/
            !/docs/
            !/worklog/
            !tests/
            !evidence/
            !provenance/

      - name: Assemble _site
        run: |
          set -euo pipefail
          # 排除「明确不是站点」的路径；其余一律发布（含 leetcode/*/solution.py，页面有下载链接）。
          rsync -a --delete \
            --exclude='/.git/' --exclude='/.github/' --exclude='.git*' --exclude='.env*' \
            --exclude='/_site/' \
            --exclude='/specs/' --exclude='/docs/' --exclude='/worklog/' \
            --exclude='/scripts/' --exclude='/deploy/' --exclude='/tests/' \
            --exclude='/authorship/' --exclude='/.agent/' --exclude='/.runs/' \
            --exclude='/node_modules/' --exclude='/package.json' --exclude='/package-lock.json' \
            --exclude='/platform-shots/' --exclude='/platform-review-shots/' \
            --exclude='tests/' --exclude='evidence/' --exclude='provenance/' \
            --exclude='*.md' \
            --exclude='*.backup*' --exclude='*.bak' --exclude='*.orig' \
            --exclude='.DS_Store' --exclude='._*' \
            ./ _site/

          # 必备入口文件缺一不可。
          for f in index.html pages.config.js leetcode/problems.config.js lesson-shell.js lesson-shell.css; do
            test -s "_site/$f" || { echo "::error::missing _site/$f"; exit 1; }
          done

          # 体积预算 200 MB：当前约 40 MB（合并 all-hard 后约 43 MB），留 4 倍余量；
          # 任何一类证据目录漏进来都会超出（specs/ 1.3 GB，leetcode 测试证据 0.5–0.9 GB），远低于 Pages 1 GB 上限。
          size_kb=$(du -sk _site | cut -f1)
          files=$(find _site -type f | wc -l)
          echo "_site: ${files} files, $((size_kb / 1024)) MB"
          echo "### _site: ${files} files, $((size_kb / 1024)) MB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$size_kb" -gt $((200 * 1024)) ]; then
            echo "::error::_site is $((size_kb / 1024)) MB, over the 200 MB budget"
            du -sk _site/* | sort -rn | head -15
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
