<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="category" content="probability"><meta name="stage" content="senior"><title>统计推断 · 从样本到判断</title><link rel="stylesheet" href="style.css"></head><body>
<header class="site-head"><div><p class="backline"><a href="../" data-i18n="back"></a></p><p class="eyebrow" data-i18n="eyebrow"></p><h1 data-i18n="title"></h1><p class="tagline" data-i18n-html="tagline"></p></div><div class="lang-toggle"><button data-lang="zh">中</button><button data-lang="en">EN</button></div></header>
<nav class="step-nav"><a href="#step0" data-i18n="nav0"></a><a href="#step1" data-i18n="nav1"></a><a href="#step2" data-i18n="nav2"></a><a href="#step3" data-i18n="nav3"></a></nav><main>
<section class="step" id="step0"><div class="step-inner"><p class="step-kicker" data-i18n="s0k"></p><h2 data-i18n="s0t"></h2><p class="explain" data-i18n-html="s0e"></p><div class="grid"><div class="stage"><canvas id="samplingCanvas" role="img"></canvas><p id="samplingRo" class="readout" aria-live="polite"></p></div><div class="controls"><label class="control"><span data-i18n="mean"></span><output id="meanOut"></output><input id="mean" type="range" min="40" max="80" value="60"></label><label class="control"><span data-i18n="sigma"></span><output id="sigmaOut"></output><input id="sigma" type="range" min="4" max="24" value="12"></label><label class="control"><span data-i18n="n"></span><output id="nOut"></output><input id="n" type="range" min="4" max="400" step="4" value="36"></label></div></div><p class="hint" data-i18n="s0hint"></p></div></section>
<section class="step" id="step1"><div class="step-inner"><p class="step-kicker" data-i18n="s1k"></p><h2 data-i18n="s1t"></h2><p class="explain" data-i18n-html="s1e"></p><div class="grid"><div class="stage"><canvas id="ciCanvas" role="img"></canvas><p id="ciRo" class="readout" aria-live="polite"></p></div><div class="controls"><label class="control"><span data-i18n="sampleMean"></span><output id="sampleMeanOut"></output><input id="sampleMean" type="range" min="40" max="80" value="63"></label><label class="control"><span data-i18n="confidence"></span><output id="confidenceOut"></output><select id="confidence"><option value="1.282">80%</option><option value="1.645">90%</option><option value="1.96" selected>95%</option><option value="2.576">99%</option></select></label></div></div><p class="hint" data-i18n="s1hint"></p></div></section>
<section class="step" id="step2"><div class="step-inner"><p class="step-kicker" data-i18n="s2k"></p><h2 data-i18n="s2t"></h2><p class="explain" data-i18n-html="s2e"></p><div class="grid"><div class="stage"><canvas id="testCanvas" role="img"></canvas><p id="testRo" class="readout" aria-live="polite"></p></div><div class="controls"><label class="control"><span data-i18n="nullMean"></span><output id="nullMeanOut"></output><input id="nullMean" type="range" min="40" max="80" value="60"></label><label class="control"><span data-i18n="observed"></span><output id="observedOut"></output><input id="observed" type="range" min="40" max="80" value="63"></label><label class="control"><span data-i18n="testN"></span><output id="testNOut"></output><input id="testN" type="range" min="4" max="400" step="4" value="36"></label></div></div><p class="hint" data-i18n="s2hint"></p></div></section>
<section class="step" id="step3"><div class="step-inner"><p class="step-kicker" data-i18n="s3k"></p><h2 data-i18n="s3t"></h2><p class="explain" data-i18n-html="s3e"></p><div class="metrics"><div class="metric"><b data-i18n="rule1"></b><strong data-i18n="rule1v"></strong></div><div class="metric"><b data-i18n="rule2"></b><strong data-i18n="rule2v"></strong></div><div class="metric"><b data-i18n="rule3"></b><strong data-i18n="rule3v"></strong></div></div><div class="quiz"><p data-i18n="quizQ"></p><div class="quiz-options"><button data-answer="wrong" data-i18n="quizA"></button><button data-answer="correct" data-i18n="quizB"></button><button data-answer="wrong" data-i18n="quizC"></button></div><p id="quizFeedback" class="readout" aria-live="polite"></p></div></div></section></main><footer class="site-foot" data-i18n="foot"></footer><script src="app.js"></script></body></html>
