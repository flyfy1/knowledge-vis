<!doctype html>
{{generated}}<html lang="zh-CN"{{htmlAttrs}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<link rel="stylesheet" href="style.css{{v}}">
<link rel="stylesheet" href="{{up}}lesson-shell.css">
<link rel="stylesheet" href="{{up}}page-provenance.css">
<link rel="stylesheet" href="{{up}}edition-compare.css">
<script src="i18n.js{{v}}"></script>
{{siteNavCss}}
</head>
<body>

<header class="site-head">
  <div class="head-main">
    <p class="backline"><a href="{{up}}" data-i18n="back"></a></p>
    {{crumbs}}<h1 data-i18n="pageTitle"></h1>
    <p class="tagline" data-i18n="tagline"></p>
{{provenance}}  </div>
  <div class="lang-toggle" id="langToggle" role="group" aria-label="Language">
    <button type="button" data-lang="zh">中</button>
    <button type="button" data-lang="en">EN</button>
  </div>
</header>
{{badges}}
<nav class="step-nav" id="stepNav" data-i18n-aria="navAria">{{stepNav}}
</nav>

<main>{{steps}}</main>{{linkedFrom}}

<footer class="site-foot" data-i18n="foot"></footer>

<script src="app.js{{v}}"></script>
<script src="{{up}}lesson-shell.js"></script>
{{siteNavJs}}
</body>
</html>
