<p class="formula" data-i18n="s3formula">x ← Ax / |Ax|</p>
    <div class="stage">
      <canvas id="s3-canvas" class="drag" height="430" tabindex="0" style="height:430px"></canvas>
    </div>
    <div class="stage">
      <p class="stage-title" data-i18n="s3chartT"></p>
      <canvas id="s3-chart" height="150" style="height:150px"></canvas>
    </div>
    <div class="controls">
      <label><span><span data-i18n="s3rLab">λ₂/λ₁ 之比 r</span> <span class="val" id="s3-r-val">0.33</span></span>
        <input type="range" id="s3-r" min="0.05" max="0.98" step="0.01" value="0.33"></label>
    </div>
    <div class="btn-row">
      <button class="btn active" data-r="0.33" data-i18n="s3pFast"></button>
      <button class="btn" data-r="0.90" data-i18n="s3pSlow"></button>
      <button class="btn" data-r="0.95" data-i18n="s3pSlower"></button>
      <button class="btn" id="s3-fail" data-i18n="s3pFail"></button>
    </div>
    <div class="btn-row">
      <button class="btn" id="s3-rand" data-i18n="s3rand"></button>
      <button class="btn" id="s3-step" data-i18n="s3step"></button>
      <button class="btn" id="s3-play" data-i18n="s3play"></button>
      <button class="btn" id="s3-run" data-i18n="s3run"></button>
      <button class="btn" id="s3-reset" data-i18n="s3reset"></button>
    </div>
    <p class="readout" id="s3-readout"></p>
    <p class="readout" id="s3-note"></p>
