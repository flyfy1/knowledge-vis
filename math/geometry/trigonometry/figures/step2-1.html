<div class="stage">
      <canvas id="s2-canvas" height="320" style="height:320px"></canvas>
    </div>
    <div class="controls">
      <label><span><span data-i18n="s2amp"></span> <span class="val" id="s2-r-val">1.0</span></span>
        <input type="range" id="s2-r" min="0.5" max="2" step="0.05" value="1">
      </label>
    </div>
    <div class="btn-row">
      <span class="row-label" data-i18n="s2mark"></span>
      <button class="btn" data-mark="0">0°</button>
      <button class="btn" data-mark="90">90°</button>
      <button class="btn" data-mark="180">180°</button>
      <button class="btn" data-mark="270">270°</button>
      <button class="btn" id="s2-toggle" data-i18n="s2pause"></button>
    </div>
    <p class="readout" id="s2-readout"></p>
    <p class="readout" id="s2-marks"></p>
