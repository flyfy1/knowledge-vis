<div class="stage">
      <canvas id="s0-canvas" height="320" style="height:320px"></canvas>
    </div>
    <div class="controls">
      <label><span><span data-i18n="s0speed"></span> <span class="val" id="s0-speed-val">1.2</span></span>
        <input type="range" id="s0-speed" min="0.2" max="3" step="0.1" value="1.2">
      </label>
    </div>
    <div class="btn-row">
      <button class="btn" id="s0-toggle" data-i18n="pause"></button>
      <button class="btn" id="s0-step" data-i18n="stepOnce"></button>
    </div>
    <p class="readout" id="s0-readout"></p>
