<div class="controls">
      <label><span><span data-i18n="s5speed"></span> <span class="val" id="s5-speed-val">0.80</span></span>
        <input type="range" id="s5-speed" min="0.2" max="2.5" step="0.05" value="0.8">
      </label>
    </div>
    <div class="triple">
      <div class="third">
        <div class="stage">
          <p class="stage-title" data-i18n="s5wheelT"></p>
          <canvas id="s5-wheel" height="250" style="height:250px"></canvas>
        </div>
        <p class="readout" id="s5-wheel-ro"></p>
      </div>
      <div class="third">
        <div class="stage">
          <p class="stage-title" data-i18n="s5pistonT"></p>
          <canvas id="s5-piston" height="250" style="height:250px"></canvas>
        </div>
        <p class="readout" id="s5-piston-ro"></p>
      </div>
      <div class="third">
        <div class="stage">
          <p class="stage-title" data-i18n="s5soundT"></p>
          <canvas id="s5-sound" height="250" style="height:250px"></canvas>
        </div>
        <div class="btn-row">
          <button class="btn" id="s5-play" data-i18n="s5play"></button>
        </div>
        <p class="readout" id="s5-sound-ro"></p>
      </div>
    </div>
