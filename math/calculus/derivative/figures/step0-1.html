<div class="stage">
      <canvas id="s0-canvas" height="400"></canvas>
    </div>
    <div class="btn-row">
      <button class="btn big primary" id="s0-play" data-i18n="s0play"></button>
      <span class="row-label" id="s0-prog"></span>
    </div>
    <div class="controls">
      <label><span><span data-i18n="s0tLab"></span> <span class="val" id="s0-t-val">t = 1.0 s</span></span>
        <input type="range" id="s0-t" min="0" max="30" step="1" value="10">
      </label>
    </div>
    <p class="readout" id="s0-probe"></p>
    <div class="btn-row">
      <span class="row-label" data-i18n="s0intLab"></span>
      <button class="btn big mode active" id="s0-i0" type="button">[1, 3]</button>
      <button class="btn big mode" id="s0-i1" type="button">[1, 2]</button>
      <button class="btn big mode" id="s0-i2" type="button">[1, 1.5]</button>
    </div>
    <p class="readout" id="s0-ro"></p>
