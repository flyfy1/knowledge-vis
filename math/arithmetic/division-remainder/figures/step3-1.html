<div class="stage">
      <canvas id="s3-canvas" height="330"></canvas>
    </div>
    <div class="controls">
      <label><span><span data-i18n="s3daysLab"></span> <span class="val" id="s3-days-val">100</span></span>
        <input type="range" id="s3-days" min="1" max="365" step="1" value="100">
      </label>
    </div>
    <div class="btn-row">
      <span class="row-label" data-i18n="s3quickLab"></span>
      <button class="btn big" data-days="7">7</button>
      <button class="btn big" data-days="30">30</button>
      <button class="btn big" data-days="100">100</button>
      <button class="btn big" data-days="365">365</button>
    </div>
    <p class="readout" id="s3-readout"></p>
