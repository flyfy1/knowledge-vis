<div class="stage">
      <canvas id="s3-canvas" height="300"></canvas>
    </div>
    <div class="controls">
      <label><span><span data-i18n="s3startLab"></span> <span class="val" id="s3-start-val">3</span></span>
        <input type="range" id="s3-start" min="-5" max="5" step="1" value="3">
      </label>
      <label><span><span data-i18n="s3stepsLab"></span> <span class="val" id="s3-steps-val">5</span></span>
        <input type="range" id="s3-steps" min="1" max="8" step="1" value="5">
      </label>
    </div>
    <div class="btn-row">
      <button class="btn big active" id="s3-dir-l" data-i18n="s3dirL"></button>
      <button class="btn big" id="s3-dir-r" data-i18n="s3dirR"></button>
      <button class="btn big primary" id="s3-walk" data-i18n="s3walk"></button>
      <button class="btn big" id="s3-reset" data-i18n="s3reset"></button>
    </div>
    <div class="btn-row">
      <span class="row-label" data-i18n="s3tryLab"></span>
      <button class="btn big" data-walk="3,-1,5">3 − 5</button>
      <button class="btn big" data-walk="-2,1,5">−2 + 5</button>
      <button class="btn big" data-walk="-1,-1,4">−1 − 4</button>
      <button class="btn big" data-walk="-4,1,3">−4 + 3</button>
    </div>
    <p class="readout" id="s3-readout"></p>
