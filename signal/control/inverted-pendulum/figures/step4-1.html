<div class="stage">
      <canvas id="s4-canvas" height="280" style="height:280px"></canvas>
    </div>
    <div class="stage strip-stage">
      <canvas id="s4-strip" height="130" style="height:130px"></canvas>
    </div>
    <div class="controls">
      <label><span><span data-i18n="s4kp"></span> <span class="val" id="s4-kp-val">25</span></span>
        <input type="range" id="s4-kp" min="10" max="60" step="1" value="25">
      </label>
      <label><span><span data-i18n="s4kd"></span> <span class="val" id="s4-kd-val">0</span></span>
        <input type="range" id="s4-kd" min="0" max="12" step="0.25" value="0">
      </label>
    </div>
    <div class="btn-row">
      <button class="btn primary" id="s4-disturb" data-i18n="s4disturb"></button>
      <button class="btn" id="s4-stand" data-i18n="btnStand"></button>
    </div>
    <p class="readout" id="s4-readout"></p>
