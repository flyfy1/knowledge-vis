<div class="stage">
      <canvas id="s3-canvas" height="280" style="height:280px"></canvas>
    </div>
    <div class="stage strip-stage">
      <canvas id="s3-strip" height="110" style="height:110px"></canvas>
    </div>
    <div class="controls">
      <label><span><span data-i18n="s3kp"></span> <span class="val" id="s3-kp-val">20</span></span>
        <input type="range" id="s3-kp" min="0" max="90" step="1" value="20">
      </label>
    </div>
    <div class="btn-row">
      <button class="btn" id="s3-soft" data-i18n="s3mSoft"></button>
      <button class="btn" id="s3-mid" data-i18n="s3mMid"></button>
      <button class="btn" id="s3-hard" data-i18n="s3mHard"></button>
      <button class="btn" id="s3-push" data-i18n="btnPush"></button>
      <button class="btn" id="s3-stand" data-i18n="btnStand"></button>
    </div>
    <p class="readout" id="s3-readout"></p>
