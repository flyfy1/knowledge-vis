<div class="stage">
      <canvas id="s6-canvas" height="280" style="height:280px"></canvas>
    </div>
    <div class="stage strip-stage">
      <canvas id="s6-strip" height="110" style="height:110px"></canvas>
    </div>
    <div class="controls">
      <label><span><span data-i18n="s6delay"></span> <span class="val" id="s6-delay-val">0 ms</span></span>
        <input type="range" id="s6-delay" min="0" max="96" step="1" value="0">
      </label>
      <label><span><span data-i18n="s6noise"></span> <span class="val" id="s6-noise-val">0°</span></span>
        <input type="range" id="s6-noise" min="0" max="3" step="0.25" value="0">
      </label>
      <label><span><span data-i18n="s6sat"></span> <span class="val" id="s6-sat-val">25 m/s²</span></span>
        <input type="range" id="s6-sat" min="3" max="25" step="0.5" value="25">
      </label>
    </div>
