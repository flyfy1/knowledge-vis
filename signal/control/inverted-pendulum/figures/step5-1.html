<div class="stage">
      <canvas id="s5-canvas" height="280" style="height:280px"></canvas>
    </div>
    <div class="stage strip-stage">
      <canvas id="s5-strip" height="110" style="height:110px"></canvas>
    </div>
    <div class="controls">
      <label><span><span data-i18n="s5slope"></span> <span class="val" id="s5-slope-val">3°</span></span>
        <input type="range" id="s5-slope" min="0" max="6" step="0.5" value="3">
      </label>
      <label><span><span data-i18n="s5kp"></span> <span class="val" id="s5-kp-val">30</span></span>
        <input type="range" id="s5-kp" min="0" max="90" step="1" value="30">
      </label>
      <label><span><span data-i18n="s5ki"></span> <span class="val" id="s5-ki-val">6</span></span>
        <input type="range" id="s5-ki" min="0" max="300" step="1" value="6">
      </label>
      <label><span><span data-i18n="s5kd"></span> <span class="val" id="s5-kd-val">6</span></span>
        <input type="range" id="s5-kd" min="0" max="15" step="0.25" value="6">
      </label>
    </div>
