<div class="btn-row" id="s4-presets">
      <button class="btn active" data-preset="0" data-i18n="s4p1"></button>
      <button class="btn" data-preset="1" data-i18n="s4p2"></button>
      <button class="btn" data-preset="2" data-i18n="s4p3"></button>
      <button class="btn" data-preset="3" data-i18n="s4p4"></button>
      <button class="btn" data-preset="4" data-i18n="s4p5"></button>
    </div>
    <div class="dual">
      <div class="half"><div class="stage"><canvas id="s4-plane" height="400" tabindex="0" style="height:400px"></canvas></div></div>
      <div class="half"><div class="stage"><canvas id="s4-wave" height="400" style="height:400px"></canvas></div></div>
    </div>
    <div class="controls">
      <label><span><span data-i18n="s4tLab"></span> <span class="val" id="s4-te-val">1.0</span></span>
        <input type="range" id="s4-te" min="0" max="6" step="0.1" value="1"></label>
    </div>
    <p class="readout" id="s4-readout"></p>
