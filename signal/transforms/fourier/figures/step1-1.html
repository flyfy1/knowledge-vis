<p class="explain" data-i18n-html="s1explain">
      最简单的波是正弦波。它完全由三个参数决定：
      <strong>频率</strong>决定它抖得多快，<strong>振幅</strong>决定它摆多高，<strong>相位</strong>决定它从哪里开始。
      拖动滑杆试试——顺便点「听一听」，频率变高，声音真的会变尖。
    </p>
    <div class="stage">
      <canvas id="s1-canvas" height="260" style="height:260px"></canvas>
    </div>
    <p class="formula" id="s1-eq">y = 1.00 · sin(2π · 1.0 · t + 0.00)</p>
    <div class="controls">
      <label><span data-i18n="labelFreq"></span> <span class="val" id="s1-freq-val">1.0 Hz</span>
        <input type="range" id="s1-freq" min="0.5" max="3" step="0.1" value="1">
      </label>
      <label><span data-i18n="labelAmp"></span> <span class="val" id="s1-amp-val">1.00</span>
        <input type="range" id="s1-amp" min="0.1" max="1" step="0.05" value="1">
      </label>
      <label><span data-i18n="labelPhase"></span> <span class="val" id="s1-phase-val">0.00 rad</span>
        <input type="range" id="s1-phase" min="0" max="6.283" step="0.05" value="0">
      </label>
    </div>
    <div class="btn-row">
      <button class="btn" id="s1-sound" data-i18n="s1sound"></button>
      <button class="btn" id="s1-freeze" data-i18n="s1freeze"></button>
    </div>
