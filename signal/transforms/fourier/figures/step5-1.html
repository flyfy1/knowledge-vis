<p class="explain" data-i18n-html="s5explain">
      前四步我们都在「拼」。傅里叶变换做的是反向的「拆」：给它任意波形，
      它告诉你里面每个频率的正弦波各有多强。左边是波形（<strong>时域</strong>），右边是拆解结果（<strong>频域</strong>，叫频谱）。
      切换波形看一看：方波只含奇数频率，三角波的频谱衰减快得多，锯齿波则每个频率都有份。
    </p>
