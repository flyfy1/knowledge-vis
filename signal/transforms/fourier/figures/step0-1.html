<p class="explain" data-i18n-html="s0explain">
      先别管原理，看画面上方和左方那两串转动的圆：上面一串管<strong>横坐标</strong>，左边一串管<strong>纵坐标</strong>，
      两条投影虚线的交点，就是正在描出小人轮廓的笔尖。
      这就是傅里叶变换最震撼的一面——<strong>任何图形，都能拆成一堆旋转的圆</strong>。
      本页会从一条正弦波开始，一步步讲清它为什么成立；
      最后一步，你还能<strong>亲手画一个图形</strong>，让圆圈们把它画出来。
    </p>
