<p class="explain" data-i18n-html="s2explain">
      把几条正弦波在每个时刻的高度直接相加，就得到一条新波形。
      下面三条彩色波各自可调，最下方白色粗线是它们的和。
      大图里分量与总和用的是<strong>同一把尺子</strong>：任选一个位置量一量，总和的高度恰好等于三条分量高度之和（为了让总和不画出画布，整张图会一起等比缩放，但比例从不撒谎）。
      试试点「方波配方」：只用 1、3、5 倍频率、振幅按 1、1/3、1/5 递减，方波的雏形就出现了。
    </p>
