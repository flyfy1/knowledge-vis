<p class="readout" id="s5-top">最强的三个成分：—</p>
    <div class="formula-box">
      <p class="formula big">X(f) = ∫ x(t) · e<sup>−2πift</sup> dt</p>
      <p class="explain small" data-i18n-html="s5formulaText">
        别怕，这个公式只是在说一句话：<strong>拿一台转速为 f 的「圆」去和波形逐点相乘再加总</strong>，
        测出波形里频率 f 的成分有多强、相位差多少。其中的 e<sup>−2πift</sup> 不是别的——
        它就是第 3 步那个在单位圆上旋转的点（数学家把「旋转」写成了指数的形式）。
        对每个 f 都测一遍，就得到整条频谱。
        再补一句桥：本页演示的都是<strong>周期波形</strong>，周期信号只在基频的整数倍上才有成分，
        所以频谱是一根根分立的柱子——这正是上面公式在周期信号上的样子（数学上叫傅里叶级数）；
        换成非周期的信号，柱子会密到连成一条连续的曲线。
      </p>
    </div>
