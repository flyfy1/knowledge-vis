<div class="btn-row">
      <button class="btn active" id="s3-causal" data-i18n="s3btnC"></button>
      <button class="btn" id="s3-left" data-i18n="s3btnL"></button>
    </div>
    <div class="dual">
      <div class="half"><div class="stage"><canvas id="s3-plane" class="drag" height="400" tabindex="0"></canvas></div></div>
      <div class="half"><div class="stage"><canvas id="s3-time" height="400"></canvas></div></div>
    </div>
    <div class="controls">
      <label><span><span data-i18n="s3aLab"></span> <span class="val" id="s3-a-val">0.80</span></span>
        <input type="range" id="s3-a" min="0.3" max="1.5" step="0.05" value="0.8"></label>
    </div>
    <p class="readout" id="s3-readout"></p>
