<div class="btn-row">
      <button class="btn active" id="s5-tab-audio" data-i18n="tabAudio"></button>
      <button class="btn" id="s5-tab-image" data-i18n="tabImage"></button>
      <button class="btn" id="s5-tab-wheel" data-i18n="tabWheel"></button>
    </div>

    <div class="tab-panel" id="s5-panel-audio">
      <div class="stage">
        <canvas id="s5a-canvas" height="150" style="height:150px"></canvas>
      </div>
      <div class="controls">
        <label><span><span data-i18n="s5aF"></span> <span class="val" id="s5a-f-val">6000</span></span>
          <input type="range" id="s5a-f" min="1000" max="12000" step="100" value="6000">
        </label>
      </div>
      <div class="btn-row" id="s5a-fs-row">
        <span class="seq-label" data-i18n="s5aFs"></span>
        <button class="btn" data-fs="44100">44.1 kHz</button>
        <button class="btn" data-fs="16000">16 kHz</button>
        <button class="btn active" data-fs="8000">8 kHz</button>
        <button class="btn" data-fs="6000">6 kHz</button>
        <button class="btn" data-fs="4000">4 kHz</button>
      </div>
      <div class="btn-row">
        <button class="btn primary" id="s5a-play-alias" data-i18n="s5aPlayAlias"></button>
        <button class="btn" id="s5a-play-orig" data-i18n="s5aPlayOrig"></button>
      </div>
      <p class="readout" id="s5a-readout"></p>
      <p class="hint" data-i18n-html="s5aHint"></p>
    </div>

    <div class="tab-panel hidden" id="s5-panel-image">
      <div class="dual">
        <div class="half">
          <div class="stage">
            <p class="stage-title" data-i18n="s5iSrc"></p>
            <canvas id="s5i-src" height="240" style="height:240px"></canvas>
          </div>
        </div>
        <div class="half">
          <div class="stage">
            <p class="stage-title" data-i18n="s5iOut"></p>
            <canvas id="s5i-out" height="240" style="height:240px"></canvas>
          </div>
        </div>
      </div>
      <div class="controls">
        <label><span><span data-i18n="s5iStride"></span> <span class="val" id="s5i-stride-val">5</span></span>
          <input type="range" id="s5i-stride" min="2" max="12" step="1" value="5">
        </label>
      </div>
      <div class="btn-row">
        <button class="btn active" id="s5i-p-stripes" data-i18n="patStripes"></button>
        <button class="btn" id="s5i-p-grid" data-i18n="patGrid"></button>
      </div>
      <p class="readout" id="s5i-readout"></p>
      <p class="hint" data-i18n-html="s5iHint"></p>
    </div>

    <div class="tab-panel hidden" id="s5-panel-wheel">
      <div class="stage">
        <canvas id="s5w-canvas" height="280" style="height:280px"></canvas>
      </div>
      <div class="controls">
        <label><span><span data-i18n="s5wN"></span> <span class="val" id="s5w-n-val">6</span></span>
          <input type="range" id="s5w-n" min="3" max="10" step="1" value="6">
        </label>
        <label><span><span data-i18n="s5wRev"></span> <span class="val" id="s5w-rev-val">2.5</span></span>
          <input type="range" id="s5w-rev" min="0.5" max="5" step="0.25" value="2.5">
        </label>
        <label><span><span data-i18n="s5wFps">帧率 f<sub>s</sub>（fps）</span> <span class="val" id="s5w-fps-val">14</span></span>
          <input type="range" id="s5w-fps" min="5" max="40" step="1" value="14">
        </label>
      </div>
      <p class="readout" id="s5w-readout"></p>
      <p class="hint" data-i18n-html="s5wHint"></p>
    </div>
