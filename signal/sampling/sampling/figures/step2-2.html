<div class="stage">
      <canvas id="s2-canvas" height="320" style="height:320px" role="img" aria-labelledby="s2-title" aria-describedby="s2-pair-legend"></canvas>
    </div>
    <div class="controls">
      <label><span><span data-i18n="labF"></span> <span class="val" id="s2-f-val">9</span></span>
        <input type="range" id="s2-f" min="1" max="20" step="0.5" value="9">
      </label>
      <label><span><span data-i18n="labFs">采样率 f<sub>s</sub>（Hz）</span> <span class="val" id="s2-fs-val">10</span></span>
        <input type="range" id="s2-fs" min="2" max="30" step="0.5" value="10">
      </label>
    </div>
    <p class="hint" id="s2-pair-legend" data-i18n="pairLegend"></p>
    <div class="controls"><label for="s2-n"><span data-i18n="pairIndex"></span><input type="range" id="s2-n" min="0" max="19" step="1" value="1"></label></div>
    <p class="readout"><span data-i18n="pairSelected"></span> <span id="s2-n-val">1</span></p>
    <div class="btn-row">
      <button class="btn" id="s2-reset" data-i18n="pairReset"></button>
      <button class="btn" id="s2-p-slow" data-i18n="s2pSlow"></button>
      <button class="btn" id="s2-p-dc" data-i18n="s2pDC"></button>
      <button class="btn" id="s2-p-fold" data-i18n="s2pFold"></button>
      <button class="btn" id="s2-p-clean" data-i18n="s2pClean"></button>
    </div>
    <div class="formula-box">
      <p class="formula big">g = f − k·f<sub>s</sub>; f<sub>alias</sub> = |g|</p>
      <p class="explain small" data-i18n-html="s2formulaNote"></p>
    </div>
    <p class="readout" id="s2-readout"></p>
    <p class="readout" id="s2-pair-sample"></p><p class="readout" id="s2-pair-between"></p>
