<div class="stage">
      <canvas id="s1-canvas" height="300" style="height:300px"></canvas>
    </div>
    <div class="controls">
      <label><span><span data-i18n="labF"></span> <span class="val" id="s1-f-val">3</span></span>
        <input type="range" id="s1-f" min="1" max="8" step="0.5" value="3">
      </label>
      <label><span><span data-i18n="labFs">采样率 f<sub>s</sub>（Hz）</span> <span class="val" id="s1-fs-val">11</span></span>
        <input type="range" id="s1-fs" min="2" max="40" step="1" value="11">
      </label>
    </div>
    <div class="btn-row">
      <button class="btn active" id="s1-mode-line" data-i18n="s1line"></button>
      <button class="btn" id="s1-mode-hold" data-i18n="s1hold"></button>
    </div>
    <p class="readout" id="s1-readout"></p>
