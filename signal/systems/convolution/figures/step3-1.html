<div class="stage">
      <canvas id="s3-canvas" height="380" style="height:380px"></canvas>
    </div>
    <div class="controls">
      <label><span><span data-i18n="s3shift"></span> <span class="val" id="s3-shift-val">−4.0</span></span>
        <input type="range" id="s3-shift" min="-4" max="4" step="0.05" value="-4">
      </label>
    </div>
    <div class="btn-row">
      <button class="btn active" id="s3-mode-rr" data-i18n="s3rr"></button>
      <button class="btn" id="s3-mode-rt" data-i18n="s3rt"></button>
      <button class="btn" id="s3-play">▶ 播放</button>
    </div>
    <p class="readout" id="s3-readout"></p>
