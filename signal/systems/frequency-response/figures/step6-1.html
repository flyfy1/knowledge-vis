<ul class="spec-list">
      <li data-i18n-html="s6spec1"></li>
      <li data-i18n-html="s6spec2"></li>
    </ul>
    <div class="btn-row" id="s6-tools">
      <button class="btn active" data-tool="rc1" data-i18n="s6toolRc1"></button>
      <button class="btn" data-tool="rc2" data-i18n="s6toolRc2"></button>
      <button class="btn" data-tool="ma" data-i18n="s6toolMa"></button>
    </div>
    <div class="controls">
      <label id="s6-fc-wrap"><span><span data-i18n="s6fcLab"></span> <span class="val" id="s6-fc-val">100 Hz</span></span>
        <input type="range" id="s6-fc" min="1.3" max="3" step="0.01" value="2"></label>
      <label id="s6-m-wrap" hidden><span><span data-i18n="s6mLab"></span> <span class="val" id="s6-m-val">8</span></span>
        <input type="range" id="s6-m" min="2" max="40" step="1" value="8"></label>
    </div>
    <div class="stage"><canvas id="s6-mag" height="260" style="height:260px"></canvas></div>
    <p class="readout" id="s6-readout"></p>
    <div class="btn-row">
      <button class="btn primary" id="s6-judge" data-i18n="s6judge"></button>
    </div>
    <p class="readout" id="s6-verdict"></p>
