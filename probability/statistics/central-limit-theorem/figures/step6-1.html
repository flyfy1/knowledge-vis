<div class="stage">
      <canvas id="s6-canvas" height="270" style="height:270px"></canvas>
    </div>
    <div class="btn-row">
      <button class="btn pre6 active" data-pre="poll" data-i18n="prePoll"></button>
      <button class="btn pre6" data-pre="uniform" data-i18n="preUniform"></button>
      <button class="btn pre6" data-pre="exp" data-i18n="preExp"></button>
    </div>
    <div class="btn-row">
      <button class="btn ver6 active" data-ver="bern" data-i18n="vBern"></button>
      <button class="btn ver6" data-ver="uniform" data-i18n="vUniform"></button>
      <button class="btn ver6" data-ver="exp" data-i18n="vExp"></button>
    </div>
    <div class="controls">
      <label><span><span data-i18n="sigLab"></span> <span class="val" id="s6-sig-val"></span></span>
        <input type="range" id="s6-sig" min="0" max="1000" step="1" value="500">
      </label>
      <label><span><span data-i18n="eLab"></span> <span class="val" id="s6-e-val"></span></span>
        <input type="range" id="s6-e" min="0" max="1000" step="1" value="500">
      </label>
    </div>
    <div class="btn-row">
      <button class="btn primary" id="s6-calc" data-i18n="calcBtn"></button>
      <button class="btn" id="s6-seed" data-i18n="newSeed"></button>
    </div>
    <p class="readout" id="s6-readout"></p>
    <div class="app-grid">
      <div class="app-card"><h3 data-i18n="app1t"></h3><p data-i18n="app1d"></p></div>
      <div class="app-card"><h3 data-i18n="app2t"></h3><p data-i18n="app2d"></p></div>
      <div class="app-card"><h3 data-i18n="app3t"></h3><p data-i18n="app3d"></p></div>
    </div>
    <div class="finale">
      <p data-i18n-html="s6fin"></p>
      <p style="margin-top:12px">
        <a class="fourier-link" href="/" data-i18n="s6linkIdx"></a>
      </p>
    </div>
