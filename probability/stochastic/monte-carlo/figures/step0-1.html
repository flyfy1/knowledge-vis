<div class="stage">
      <canvas id="s0-canvas" height="400" style="height:400px"></canvas>
    </div>
    <div class="btn-row">
      <button class="btn primary" id="s0-play" data-i18n="pause"></button>
      <button class="btn" id="s0-seed" data-i18n="newSeed"></button>
      <button class="btn" id="s0-reset" data-i18n="reset"></button>
    </div>
    <div class="btn-row">
      <span class="seq-label" data-i18n="speedLab"></span>
      <button class="btn spd" data-rate="90" data-i18n="spdSlow"></button>
      <button class="btn spd active" data-rate="1500" data-i18n="spdMid"></button>
      <button class="btn spd" data-rate="30000" data-i18n="spdFast"></button>
    </div>
    <p class="readout" id="s0-readout"></p>
