<div class="formula-box">
      <p class="formula big">(x² + y² − 1)³ − x²y³ ≤ 0</p>
      <p class="explain small" data-i18n-html="s3formulaNote"></p>
    </div>
    <div class="stage">
      <canvas id="s3-canvas" height="380" style="height:380px"></canvas>
    </div>
    <div class="btn-row">
      <span class="seq-label" data-i18n="s3shapeLab"></span>
      <button class="btn shbtn active" data-shape="heart" data-i18n="shHeart"></button>
      <button class="btn shbtn" data-shape="star" data-i18n="shStar"></button>
      <button class="btn shbtn" data-shape="blob" data-i18n="shBlob"></button>
    </div>
    <div class="btn-row">
      <button class="btn primary" id="s3-play" data-i18n="runStart"></button>
      <button class="btn" id="s3-seed" data-i18n="newSeed"></button>
      <button class="btn" id="s3-reset" data-i18n="reset"></button>
    </div>
    <p class="readout" id="s3-readout"></p>
