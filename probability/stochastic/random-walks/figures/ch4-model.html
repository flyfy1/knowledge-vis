<figure class="lab" id="lab4">
  <h3 data-i18n="ch4.model.title"></h3>
  <p class="how" data-i18n="ch4.model.how"></p>
  <canvas class="cv" id="c4Cv" role="img" data-i18n-aria="ch4.cv.aria"></canvas>
  <div class="ctl">
    <label class="rng"><span data-i18n="ch4.ctl.mu"></span><input id="c4Mu" type="range" min="0" max="15" step="0.5" value="7"><output id="c4MuO"></output></label>
    <label class="rng"><span data-i18n="ch4.ctl.sig"></span><input id="c4Sig" type="range" min="5" max="60" step="1" value="20"><output id="c4SigO"></output></label>
    <label class="rng"><span data-i18n="ch4.ctl.T"></span><input id="c4T" type="range" min="1" max="40" step="1" value="10"><output id="c4TO"></output></label>
  </div>
  <div class="read">
    <div><span data-i18n="ch4.read.med"></span><b id="c4Med" class="c"></b></div>
    <div><span data-i18n="ch4.read.mean"></span><b id="c4Mean" class="g"></b></div>
    <div><span data-i18n="ch4.read.loss"></span><b id="c4Loss" class="r"></b></div>
    <div><span data-i18n="ch4.read.star"></span><b id="c4Star" class="n"></b></div>
  </div>
  <p class="say" id="c4Say" aria-live="polite"></p>
</figure>
