    <div><span data-i18n="ch3.read.th"></span><b id="c3Th" class="g"></b></div>
    <div><span data-i18n="ch3.read.t10"></span><b id="c3T10" class="n"></b></div>
    <div><span data-i18n="ch3.read.t1mm"></span><b id="c3T1mm" class="v"></b></div>
    <div><span data-i18n="ch3.read.t1cm"></span><b id="c3T1cm" class="r"></b></div>
  </div>
  <p class="say" id="c3Say" aria-live="polite"></p>
