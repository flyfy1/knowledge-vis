<figure class="lab" id="lab1">
  <h3 data-i18n="ch1.model.title"></h3>
  <p class="how" data-i18n="ch1.model.how"></p>
  <canvas class="cv" id="c1Cv" role="img" data-i18n-aria="ch1.cv.aria"></canvas>
  <div class="ctl">
    <label class="rng"><span data-i18n="ch1.ctl.m"></span><input id="c1M" type="range" min="20" max="400" step="20" value="200"><output id="c1MO"></output></label>
    <span class="btns"><button type="button" class="btn" id="c1Run" data-i18n="ch1.ctl.run"></button><button type="button" class="btn" id="c1Reset" data-i18n="ch1.ctl.reset"></button></span>
  </div>
  <div class="read">
    <div><span data-i18n="ch1.read.n"></span><b id="c1N"></b></div>
    <div><span data-i18n="ch1.read.rms"></span><b id="c1Rms" class="c"></b></div>
    <div><span data-i18n="ch1.read.sqrt"></span><b id="c1Sqrt" class="g"></b></div>
    <div><span data-i18n="ch1.read.in"></span><b id="c1In" class="c"></b></div>
    <div><span data-i18n="ch1.read.exact"></span><b id="c1Exact" class="g"></b></div>
  </div>
  <p class="say" id="c1Say" aria-live="polite"></p>
</figure>
