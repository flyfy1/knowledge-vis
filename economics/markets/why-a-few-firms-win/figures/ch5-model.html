<figure class="lab">
    <h3 data-i18n="ch5.model.title"></h3>
    <p class="how" data-i18n-html="ch5.model.how"></p>
    <canvas class="cv tall" id="nwCv" role="img" data-i18n-aria="ch5.model.aria"></canvas>
    <div class="legend"><span><i style="background:var(--cyan)"></i><span data-i18n="ch5.leg.hump"></span></span><span style="color:var(--gold)"><i class="dash"></i><span data-i18n="ch5.leg.p"></span></span><span><i style="background:var(--red)"></i><span data-i18n="ch5.leg.crit"></span></span><span><i style="background:var(--violet)"></i><span data-i18n="ch5.leg.path"></span></span></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch5.ctl.p"></span><input type="range" id="nwP" min="0.02" max="0.3" step="0.01" value="0.16"><output id="nwPo"></output></label><label class="rng"><span data-i18n="ch5.ctl.n0"></span><input type="range" id="nwN" min="0" max="0.6" step="0.01" value="0.25"><output id="nwNo"></output></label></div>
    <div class="ctl"><button type="button" class="b" id="nwGo" data-i18n="ch5.btn.go"></button></div>
    <div class="read"><div><b class="r" id="nwC"></b><span data-i18n="ch5.read.crit"></span></div><div><b class="g" id="nwH"></b><span data-i18n="ch5.read.high"></span></div><div><b class="v" id="nwNow"></b><span data-i18n="ch5.read.now"></span></div><div><b class="" id="nwT"></b><span data-i18n="ch5.read.t"></span></div></div>
    <p class="say" id="ch5Say" aria-live="polite"></p>
  </figure>
