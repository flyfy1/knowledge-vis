<figure class="lab">
    <h3 data-i18n="ch1.model.title"></h3>
    <p class="how" data-i18n-html="ch1.model.how"></p>
    <canvas class="cv" id="moCv" role="img" data-i18n-aria="ch1.model.aria"></canvas>
    <div class="legend"><span><i style="background:var(--cyan)"></i><span data-i18n="ch1.leg.d"></span></span><span style="color:var(--violet)"><i class="dash"></i><span data-i18n="ch1.leg.mr"></span></span><span style="color:var(--gold)"><i class="dash"></i><span data-i18n="ch1.leg.mc"></span></span><span><i class="band" style="background:rgba(233,185,73,.4)"></i><span data-i18n="ch1.leg.profit"></span></span><span><i class="band" style="background:rgba(240,122,109,.45)"></i><span data-i18n="ch1.leg.dwl"></span></span><span><i class="band" style="background:rgba(99,199,230,.3)"></i><span data-i18n="ch1.leg.cs"></span></span></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch1.ctl.eps"></span><input type="range" id="moE" min="1.25" max="8" step="0.05" value="2"><output id="moEo"></output></label></div>
    <div class="ctl"><div class="seg" role="radiogroup" data-i18n-aria="ch1.ctl.mode"><label><input type="radio" name="moMode" value="one" checked><span data-i18n="ch1.mode.one"></span></label><label><input type="radio" name="moMode" value="pd"><span data-i18n="ch1.mode.pd"></span></label></div></div>
    <div class="read"><div><b class="g" id="moP"></b><span data-i18n="ch1.read.p"></span></div><div><b class="" id="moL"></b><span data-i18n="ch1.read.l"></span></div><div><b class="c" id="moQ"></b><span data-i18n="ch1.read.q"></span></div><div><b class="r" id="moDwl"></b><span data-i18n="ch1.read.dwl"></span></div></div>
    <p class="say" id="ch1Say" aria-live="polite"></p>
  </figure>
