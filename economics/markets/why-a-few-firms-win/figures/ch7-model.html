<figure class="lab">

    <canvas class="cv" id="tsCv" role="img" data-i18n-aria="ch7.model.aria"></canvas>
    <div class="legend"><span><i class="band" style="background:var(--cyan)"></i><span data-i18n="ch7.leg.p"></span></span><span style="color:var(--gold)"><i class="dash"></i><span data-i18n="ch7.leg.f"></span></span><span><i class="band" style="background:var(--violet)"></i><span data-i18n="ch7.leg.n"></span></span></div>
