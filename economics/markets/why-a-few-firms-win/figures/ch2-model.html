<figure class="lab">
    <h3 data-i18n="ch2.model.title"></h3>
    <p class="how" data-i18n-html="ch2.model.how"></p>
    <canvas class="cv tall" id="coCv" role="img" data-i18n-aria="ch2.model.aria"></canvas>
    <div class="legend"><span><i style="background:var(--cyan)"></i><span data-i18n="ch2.leg.ac"></span></span><span style="color:var(--gold)"><i class="dash"></i><span data-i18n="ch2.leg.mes"></span></span><span style="color:var(--red)"><i class="dash"></i><span data-i18n="ch2.leg.s"></span></span><span><i style="background:var(--violet)"></i><span data-i18n="ch2.leg.k"></span></span></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch2.ctl.f"></span><input type="range" id="coF" min="2" max="7" step="0.1" value="6"><output id="coFo"></output></label><label class="rng"><span data-i18n="ch2.ctl.s"></span><input type="range" id="coS" min="3" max="7" step="0.1" value="6"><output id="coSo"></output></label></div>
    <div class="ctl"><div class="seg" role="radiogroup" data-i18n-aria="ch2.ctl.d"><span class="lbl" data-i18n="ch2.ctl.d"></span><label><input type="radio" name="coD" value="1" checked><span data-i18n="ch2.d.on"></span></label><label><input type="radio" name="coD" value="0"><span data-i18n="ch2.d.off"></span></label></div></div>
    <div class="read"><div><b class="g" id="coMes"></b><span data-i18n="ch2.read.mes"></span></div><div><b class="" id="coAc"></b><span data-i18n="ch2.read.ac"></span></div><div><b class="v" id="coK"></b><span data-i18n="ch2.read.k"></span></div><div><b class="r" id="coPen"></b><span data-i18n="ch2.read.pen"></span></div></div>
    <p class="say" id="ch2Say" aria-live="polite"></p>
  </figure>
