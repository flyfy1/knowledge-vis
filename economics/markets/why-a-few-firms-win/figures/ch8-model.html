<figure class="lab">
    <h3 data-i18n="ch8.model.title"></h3>
    <p class="how" data-i18n-html="ch8.model.how"></p>
    <canvas class="cv" id="daCv" role="img" data-i18n-aria="ch8.model.aria"></canvas>
    <div class="legend"><span><i style="background:var(--gold)"></i><span data-i18n="ch8.leg.s"></span></span><span><i style="background:var(--cyan)"></i><span data-i18n="ch8.leg.e1"></span></span><span><i style="background:var(--violet)"></i><span data-i18n="ch8.leg.e2"></span></span></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch8.ctl.beta"></span><input type="range" id="daB" min="0.05" max="0.6" step="0.05" value="0.3"><output id="daBo"></output></label><label class="rng"><span data-i18n="ch8.ctl.delta"></span><input type="range" id="daD" min="0" max="0.3" step="0.01" value="0"><output id="daDo"></output></label></div>
    <div class="ctl"><button type="button" class="b" id="daGo" data-i18n="common.replay"></button></div>
    <div class="read"><div><b class="" id="daS0"></b><span data-i18n="ch8.read.s0"></span></div><div><b class="g" id="daS"></b><span data-i18n="ch8.read.s"></span></div><div><b class="r" id="daDc"></b><span data-i18n="ch8.read.dc"></span></div><div><b class="" id="daT"></b><span data-i18n="ch8.read.t"></span></div></div>
    <p class="say" id="ch8Say" aria-live="polite"></p>
  </figure>
