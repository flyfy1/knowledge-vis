<figure class="lab">
    <h3 data-i18n="ch6.model.title"></h3>
    <p class="how" data-i18n-html="ch6.model.how"></p>
    <canvas class="cv tall" id="stCv" role="img" data-i18n-aria="ch6.model.aria"></canvas>
    <canvas class="cv short" id="stCv2" role="img" data-i18n-aria="ch6.model.aria2"></canvas>
    <div class="legend"><span><i style="background:var(--cyan)"></i><span data-i18n="ch6.leg.a"></span></span><span><i class="band" style="background:rgba(240,122,109,.35)"></i><span data-i18n="ch6.leg.lock"></span></span><span><i class="band" style="background:var(--violet)"></i><span data-i18n="ch6.leg.hist"></span></span></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch6.ctl.r"></span><input type="range" id="stR" min="0" max="0.3" step="0.01" value="0.1"><output id="stRo"></output></label></div>
    <div class="ctl"><button type="button" class="b" id="stGo" data-i18n="ch6.btn.go"></button></div>
    <div class="read"><div><b class="r" id="stThr"></b><span data-i18n="ch6.read.thr"></span></div><div><b class="" id="stAt"></b><span data-i18n="ch6.read.at"></span></div><div><b class="c" id="stLead"></b><span data-i18n="ch6.read.lead"></span></div><div><b class="v" id="stTip"></b><span data-i18n="ch6.read.tip"></span></div></div>
    <p class="say" id="ch6Say" aria-live="polite"></p>
  </figure>
