<figure class="lab">
    <h3 data-i18n="ch9.model.title"></h3>
    <p class="how" data-i18n-html="ch9.model.how"></p>
    <canvas class="cv" id="tyCv" role="img" data-i18n-aria="ch9.model.aria"></canvas>
    <div class="legend"><span><i class="band" style="background:var(--gold)"></i><span data-i18n="ch9.leg.m"></span></span><span><i class="band" style="background:var(--red)"></i><span data-i18n="ch9.leg.r"></span></span><span><i class="band" style="background:var(--cyan)"></i><span data-i18n="ch9.leg.t"></span></span></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch9.ctl.m"></span><input type="range" id="tyM" min="0" max="1" step="0.05" value="0.3"><output id="tyMo"></output></label><label class="rng"><span data-i18n="ch9.ctl.d"></span><input type="range" id="tyD" min="0" max="3" step="0.1" value="1"><output id="tyDo"></output></label></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch9.ctl.k"></span><input type="range" id="tyK" min="0" max="3" step="0.1" value="0.5"><output id="tyKo"></output></label></div>
    <div class="read"><div><b class="g" id="tyGain"></b><span data-i18n="ch9.read.gain"></span></div><div><b class="r" id="tyRiv"></b><span data-i18n="ch9.read.riv"></span></div><div><b class="c" id="tyLoss"></b><span data-i18n="ch9.read.loss"></span></div></div>
    <p class="say" id="ch9Say" aria-live="polite"></p>
  </figure>
