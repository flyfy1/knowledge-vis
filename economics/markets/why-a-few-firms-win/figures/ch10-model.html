<figure class="lab">
    <h3 data-i18n="ch10.model.title"></h3>
    <p class="how" data-i18n-html="ch10.model.how"></p>
    <canvas class="cv" id="wtCv" role="img" data-i18n-aria="ch10.model.aria"></canvas>
    <div class="legend"><span><i class="band" style="background:var(--violet)"></i><span data-i18n="ch10.leg.hist"></span></span><span><i class="band" style="background:var(--red)"></i><span data-i18n="ch10.leg.tip"></span></span></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch10.ctl.phi"></span><input type="range" id="wtPhi" min="0" max="1" step="0.05" value="0"><output id="wtPhio"></output></label><label class="rng"><span data-i18n="ch10.ctl.h"></span><input type="range" id="wtH" min="0" max="0.8" step="0.05" value="0"><output id="wtHo"></output></label></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch10.ctl.g"></span><input type="range" id="wtG" min="0.5" max="4" step="0.25" value="1"><output id="wtGo"></output></label></div>
    <div class="read"><div><b class="r" id="wtTip"></b><span data-i18n="ch10.read.tip"></span></div><div><b class="v" id="wtMean"></b><span data-i18n="ch10.read.mean"></span></div><div><b class="" id="wtThr"></b><span data-i18n="ch10.read.thr"></span></div></div>
    <p class="say" id="ch10Say" aria-live="polite"></p>
  </figure>
