<figure class="lab">
    <h3 data-i18n="ch3.model.title"></h3>
    <p class="how" data-i18n-html="ch3.model.how"></p>
    <canvas class="cv" id="olCv" role="img" data-i18n-aria="ch3.model.aria"></canvas>
    <div class="legend"><span><i style="background:var(--cyan)"></i><span data-i18n="ch3.leg.c"></span></span><span><i style="background:var(--red)"></i><span data-i18n="ch3.leg.b"></span></span><span><i style="background:var(--violet)"></i><span data-i18n="ch3.leg.l"></span></span><span style="color:var(--gold)"><i class="dash"></i><span data-i18n="ch3.leg.mc"></span></span></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch3.ctl.n"></span><input type="range" id="olN" min="1" max="10" step="1" value="2"><output id="olNo"></output></label><label class="rng"><span data-i18n="ch3.ctl.sigma"></span><input type="range" id="olS" min="2" max="20" step="1" value="8"><output id="olSo"></output></label></div>
    <div class="read"><div><b class="c" id="olC"></b><span data-i18n="ch3.read.c"></span></div><div><b class="r" id="olB"></b><span data-i18n="ch3.read.b"></span></div><div><b class="v" id="olL"></b><span data-i18n="ch3.read.l"></span></div><div><b class="g" id="olH"></b><span data-i18n="ch3.read.h"></span></div></div>
    <p class="say" id="ch3Say" aria-live="polite"></p>
  </figure>
