<figure class="lab" id="lab-ch6-model">
    <h3 data-i18n="ch6.model.title"></h3>
    <p class="how" data-i18n="ch6.model.how"></p>
    <div class="ctl"><label class="rng"><span data-i18n="ch6.ctl.lev"></span><input type="range" id="nwLev" min="8" max="30" step="1" value="20"><output id="nwLevo" for="nwLev"></output></label><label class="rng"><span data-i18n="ch6.ctl.k"></span><input type="range" id="nwK" min="0.05" max="0.5" step="0.01" value="0.2"><output id="nwKo" for="nwK"></output></label><label class="rng"><span data-i18n="ch6.ctl.x"></span><input type="range" id="nwX" min="0" max="6" step="0.5" value="2"><output id="nwXo" for="nwX"></output></label><label class="rng"><span data-i18n="ch6.ctl.shock"></span><input type="range" id="nwShock" min="1" max="10" step="0.5" value="4"><output id="nwShocko" for="nwShock"></output></label></div>
    <div class="ctl"><button type="button" class="btn" id="nwStep" data-i18n="ch6.btn.step"></button><button type="button" class="btn" id="nwPlay" data-i18n="ch6.btn.play"></button><button type="button" class="btn" id="nwReset" data-i18n="ch6.btn.reset"></button></div>
    <canvas class="cv tall" id="nwCv" role="img" data-i18n-aria="ch6.cv.aria"></canvas>
    <div class="legend"><span><i style="background:#7ad6a0"></i><span data-i18n="ch6.leg.ok"></span></span><span><i style="background:#e9b949"></i><span data-i18n="ch6.leg.sell"></span></span><span><i style="background:#f07a6d"></i><span data-i18n="ch6.leg.fail"></span></span></div>
    <div class="read"><div><span data-i18n="ch6.read.round"></span><b id="nwRound"></b></div><div><span data-i18n="ch6.read.price"></span><b id="nwPrice" class="g"></b></div><div><span data-i18n="ch6.read.failed"></span><b id="nwFailed" class="r"></b></div><div><span data-i18n="ch6.read.amp"></span><b id="nwAmp" class="c"></b></div></div>
    <p class="say" id="nwSay" aria-live="polite"></p>
  </figure>
