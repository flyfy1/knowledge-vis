<figure class="lab" id="lab-ch5-model">
    <h3 data-i18n="ch5.model.title"></h3>
    <p class="how" data-i18n="ch5.model.how"></p>
    <div class="ctl"><label class="rng"><span data-i18n="ch5.ctl.dy"></span><input type="range" id="svDy" min="0" max="5" step="0.05" value="2.5"><output id="svDyo" for="svDy"></output></label><label class="rng"><span data-i18n="ch5.ctl.t"></span><input type="range" id="svT" min="0.5" max="10" step="0.1" value="6.2"><output id="svTo" for="svT"></output></label><label class="rng"><span data-i18n="ch5.ctl.bond"></span><input type="range" id="svBond" min="10" max="60" step="1" value="55"><output id="svBondo" for="svBond"></output></label><label class="rng"><span data-i18n="ch5.ctl.run"></span><input type="range" id="svRun" min="0" max="100" step="1" value="25"><output id="svRuno" for="svRun"></output></label></div>
    <canvas class="cv" id="svCv" role="img" data-i18n-aria="ch5.cv.aria"></canvas>
    <div class="read"><div><span data-i18n="ch5.read.loss"></span><b id="svLoss" class="r"></b></div><div><span data-i18n="ch5.read.mtm"></span><b id="svMtm" class="g"></b></div><div><span data-i18n="ch5.read.sold"></span><b id="svSold" class="v"></b></div><div><span data-i18n="ch5.read.star"></span><b id="svStar" class="c"></b></div></div>
    <p class="say" id="svSay" aria-live="polite"></p>
  </figure>
