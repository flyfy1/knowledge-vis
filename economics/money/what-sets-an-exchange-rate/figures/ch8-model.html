<figure class="lab">
    <h3 data-i18n="ch8.model.title"></h3>
    <p class="how" data-i18n-html="ch8.model.how"></p>
    <canvas class="cv tall" id="pgCv" role="img" data-i18n-aria="ch8.model.aria"></canvas>
    <div class="legend"><span><i class="" style="background:var(--gold)"></i><span data-i18n="ch8.leg.r"></span></span><span><i class="dash" style="background:var(--mute)"></i><span data-i18n="ch8.leg.naive"></span></span><span><i class="" style="background:var(--cyan)"></i><span data-i18n="ch8.leg.sh"></span></span><span><i class="" style="background:var(--mute)"></i><span data-i18n="ch8.leg.peg"></span></span></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch8.ctl.mu"></span><input type="range" id="pgMu" min="0.5" max="5" step="0.5" value="2"><output id="pgMuo"></output></label></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch8.ctl.a"></span><input type="range" id="pgA" min="0" max="12" step="1" value="5"><output id="pgAo"></output></label></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch8.ctl.r"></span><input type="range" id="pgR" min="10" max="80" step="5" value="40"><output id="pgRo"></output></label></div>
    <div class="ctl"><button class="b" id="pgPlay" type="button" data-i18n="ch8.btn.play"></button></div>
    <div class="read"><div><b class="" id="pgNaive"></b><span data-i18n="ch8.read.naive"></span></div><div><b class="r" id="pgT"></b><span data-i18n="ch8.read.t"></span></div><div><b class="g" id="pgRun"></b><span data-i18n="ch8.read.run"></span></div></div>
    <p class="say" id="ch8Say" aria-live="polite"></p>
  </figure>
