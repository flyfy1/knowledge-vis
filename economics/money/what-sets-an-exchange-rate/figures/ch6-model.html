<figure class="lab">
    <h3 data-i18n="ch6.model.title"></h3>
    <p class="how" data-i18n-html="ch6.model.how"></p>
    <canvas class="cv" id="caCv" role="img" data-i18n-aria="ch6.model.aria"></canvas>
    <canvas class="cv short" id="caCv2" role="img" data-i18n-aria="ch6.model.aria"></canvas>
    <div class="ctl"><label class="rng"><span data-i18n="ch6.ctl.d"></span><input type="range" id="caD" min="0" max="8" step="0.5" value="4"><output id="caDo"></output></label></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch6.ctl.l"></span><input type="range" id="caL" min="1" max="10" step="1" value="3"><output id="caLo"></output></label></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch6.ctl.p"></span><input type="range" id="caP" min="0" max="30" step="1" value="10"><output id="caPo"></output></label></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch6.ctl.c"></span><input type="range" id="caC" min="5" max="30" step="1" value="15"><output id="caCo"></output></label></div>
    <div class="read"><div><b class="g" id="caMed"></b><span data-i18n="ch6.read.med"></span></div><div><b class="" id="caMean"></b><span data-i18n="ch6.read.mean"></span></div><div><b class="r" id="caLose"></b><span data-i18n="ch6.read.lose"></span></div><div><b class="r" id="caWipe"></b><span data-i18n="ch6.read.wipe"></span></div><div><b class="c" id="caBe"></b><span data-i18n="ch6.read.be"></span></div></div>
    <p class="say" id="ch6Say" aria-live="polite"></p>
  </figure>
