<figure class="lab">
    <h3 data-i18n="ch11.model.title"></h3>
    <p class="how" data-i18n-html="ch11.model.how"></p>
    <canvas class="cv tall" id="coCv" role="img" data-i18n-aria="ch11.model.aria"></canvas>
    <div class="ctl"><label class="rng"><span data-i18n="ch11.ctl.a"></span><input type="range" id="coA" min="-2" max="2" step="0.1" value="0"><output id="coAo"></output></label></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch11.ctl.b"></span><input type="range" id="coB" min="0" max="6" step="0.1" value="4"><output id="coBo"></output></label></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch11.ctl.s"></span><input type="range" id="coS" min="0" max="1" step="0.01" value="0.9"><output id="coSo"></output></label></div>
    <div class="read"><div><b class="g" id="coFinal"></b><span data-i18n="ch11.read.final"></span></div><div><b class="" id="coEq"></b><span data-i18n="ch11.read.eq"></span></div><div><b class="r" id="coTip"></b><span data-i18n="ch11.read.tip"></span></div></div>
    <p class="say" id="ch11Say" aria-live="polite"></p>
  </figure>
