<figure class="lab">
    <h3 data-i18n="ch3.model.title"></h3>
    <p class="how" data-i18n-html="ch3.model.how"></p>
    <canvas class="cv" id="reCv" role="img" data-i18n-aria="ch3.model.aria"></canvas>
    <div class="legend"><span><i class="" style="background:var(--gold)"></i><span data-i18n="ch3.leg.q"></span></span><span><i class="dash" style="background:var(--cyan)"></i><span data-i18n="ch3.leg.s"></span></span></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch3.ctl.a"></span><input type="range" id="reA" min="-10" max="10" step="0.5" value="0"><output id="reAo"></output></label></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch3.ctl.cn"></span><input type="range" id="reCn" min="-1" max="5" step="0.5" value="0"><output id="reCno"></output></label></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch3.ctl.us"></span><input type="range" id="reUs" min="0" max="6" step="0.5" value="3"><output id="reUso"></output></label></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch3.ctl.n"></span><input type="range" id="reN" min="1" max="10" step="1" value="3"><output id="reNo"></output></label></div>
    <div class="read"><div><b class="g" id="reQ"></b><span data-i18n="ch3.read.q"></span></div><div><b class="c" id="reBe"></b><span data-i18n="ch3.read.be"></span></div></div>
    <p class="say" id="ch3Say" aria-live="polite"></p>
  </figure>
