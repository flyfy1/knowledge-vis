<figure class="lab">
    <h3 data-i18n="ch5.model.title"></h3>
    <p class="how" data-i18n-html="ch5.model.how"></p>
    <canvas class="cv" id="ovCv" role="img" data-i18n-aria="ch5.model.aria"></canvas>
    <div class="legend"><span><i class="" style="background:var(--gold)"></i><span data-i18n="ch5.leg.s"></span></span><span><i class="" style="background:var(--cyan)"></i><span data-i18n="ch5.leg.p"></span></span><span><i class="dash" style="background:var(--mute)"></i><span data-i18n="ch5.leg.bar"></span></span></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch5.ctl.m"></span><input type="range" id="ovM" min="1" max="10" step="1" value="5"><output id="ovMo"></output></label></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch5.ctl.l"></span><input type="range" id="ovL" min="0.5" max="5" step="0.5" value="2"><output id="ovLo"></output></label></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch5.ctl.t"></span><input type="range" id="ovT" min="0.1" max="5" step="0.1" value="0.5"><output id="ovTo"></output></label></div>
    <div class="read"><div><b class="g" id="ovJ"></b><span data-i18n="ch5.read.jump"></span></div><div><b class="" id="ovLong"></b><span data-i18n="ch5.read.long"></span></div><div><b class="c" id="ovI"></b><span data-i18n="ch5.read.i"></span></div><div><b class="v" id="ovH"></b><span data-i18n="ch5.read.half"></span></div></div>
    <p class="say" id="ch5Say" aria-live="polite"></p>
  </figure>
