<figure class="lab">
    <h3 data-i18n="ch9.model.title"></h3>
    <p class="how" data-i18n-html="ch9.model.how"></p>
    <canvas class="cv" id="mmCv" role="img" data-i18n-aria="ch9.model.aria"></canvas>
    <div class="legend"><span><i class="" style="background:var(--gold)"></i><span data-i18n="ch9.leg.a"></span></span><span><i class="" style="background:var(--red)"></i><span data-i18n="ch9.leg.l"></span></span><span><i class="" style="background:var(--green)"></i><span data-i18n="ch9.leg.nw"></span></span></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch9.ctl.phi"></span><input type="range" id="mmPhi" min="0" max="100" step="5" value="50"><output id="mmPhio"></output></label></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch9.ctl.psi"></span><input type="range" id="mmPsi" min="0" max="100" step="5" value="10"><output id="mmPsio"></output></label></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch9.ctl.d"></span><input type="range" id="mmD" min="0" max="150" step="5" value="30"><output id="mmDo"></output></label></div>
    <div class="read"><div><b class="g" id="mmNw"></b><span data-i18n="ch9.read.nw"></span></div><div><b class="r" id="mmLev"></b><span data-i18n="ch9.read.lev"></span></div><div><b class="c" id="mmStar"></b><span data-i18n="ch9.read.star"></span></div></div>
    <p class="say" id="ch9Say" aria-live="polite"></p>
  </figure>
