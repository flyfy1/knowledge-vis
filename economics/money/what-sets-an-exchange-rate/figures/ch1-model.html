<figure class="lab">
    <h3 data-i18n="ch1.model.title"></h3>
    <p class="how" data-i18n-html="ch1.model.how"></p>
    <canvas class="cv" id="mkCv" role="img" data-i18n-aria="ch1.model.aria"></canvas>
    <div class="legend"><span><i class="" style="background:var(--cyan)"></i><span data-i18n="ch1.leg.s"></span></span><span><i class="" style="background:var(--gold)"></i><span data-i18n="ch1.leg.d"></span></span></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch1.ctl.k"></span><input type="range" id="mkK" min="40" max="100" step="1" value="80"><output id="mkKo"></output></label></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch1.ctl.f"></span><input type="range" id="mkF" min="0" max="150" step="5" value="60"><output id="mkFo"></output></label></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch1.ctl.g"></span><input type="range" id="mkG" min="-100" max="100" step="5" value="0"><output id="mkGo"></output></label></div>
    <div class="read"><div><b class="g" id="mkS"></b><span data-i18n="ch1.read.s"></span></div><div><b class="n" id="mkCa"></b><span data-i18n="ch1.read.ca"></span></div><div><b class="c" id="mkPriv"></b><span data-i18n="ch1.read.priv"></span></div><div><b class="v" id="mkRes"></b><span data-i18n="ch1.read.res"></span></div></div>
    <p class="say" id="ch1Say" aria-live="polite"></p>
  </figure>
