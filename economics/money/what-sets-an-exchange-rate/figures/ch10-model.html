<figure class="lab">
    <h3 data-i18n="ch10.model.title"></h3>
    <p class="how" data-i18n-html="ch10.model.how"></p>
    <canvas class="cv tall" id="fxCv" role="img" data-i18n-aria="ch10.model.aria"></canvas>
    <div class="legend"><span><i class="dash" style="background:var(--violet)"></i><span data-i18n="ch10.leg.w"></span></span><span><i class="" style="background:var(--gold)"></i><span data-i18n="ch10.leg.c"></span></span><span><i class="" style="background:var(--cyan)"></i><span data-i18n="ch10.leg.f"></span></span><span><i class="band" style="background:var(--mute)"></i><span data-i18n="ch10.leg.b"></span></span></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch10.ctl.t"></span><input type="range" id="fxT" min="-0.5" max="0.5" step="0.05" value="-0.2"><output id="fxTo"></output></label></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch10.ctl.k"></span><input type="range" id="fxK" min="0" max="0.99" step="0.01" value="0.8"><output id="fxKo"></output></label></div>
    <div class="read"><div><b class="c" id="fxFix"></b><span data-i18n="ch10.read.fix"></span></div><div><b class="g" id="fxClose"></b><span data-i18n="ch10.read.close"></span></div><div><b class="r" id="fxEdge"></b><span data-i18n="ch10.read.edge"></span></div><div><b class="r" id="fxGap"></b><span data-i18n="ch10.read.gap"></span></div></div>
    <p class="say" id="ch10Say" aria-live="polite"></p>
  </figure>
