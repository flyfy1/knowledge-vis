<figure class="lab">
    <h3 data-i18n="ch6.model.title"></h3>
    <p class="how" data-i18n-html="ch6.model.how"></p>
    <canvas class="cv" id="sCv" role="img" data-i18n-aria="ch6.model.aria"></canvas>
    <canvas class="cv short" id="sCv2" role="img" data-i18n-aria="ch6.model.aria2"></canvas>
    <div class="legend"><span><i style="background:var(--gold)"></i><span data-i18n="ch6.leg.curve"></span></span><span style="color:var(--red)"><i class="dash"></i><span data-i18n="ch6.leg.d"></span></span><span><i style="background:var(--violet)"></i><span data-i18n="ch6.leg.path"></span></span></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch6.ctl.d"></span><input type="range" id="sD" min="0" max="15" step="0.5" value="4"><output id="sDo"></output></label></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch6.ctl.k"></span><input type="range" id="sK" min="5" max="20" step="1" value="10"><output id="sKo"></output></label><label class="rng"><span data-i18n="ch6.ctl.alpha"></span><input type="range" id="sA" min="2" max="8" step="0.5" value="5"><output id="sAo"></output></label></div>
    <div class="ctl"><button type="button" class="b" id="sRe" data-i18n="common.replay"></button></div>
    <div class="read"><div><b class="g" id="sMax"></b><span data-i18n="ch6.read.max"></span></div><div><b class="r" id="sSS"></b><span data-i18n="ch6.read.ss"></span></div><div><b class="r" id="sH"></b><span data-i18n="ch6.read.hyper"></span></div><div><b class="c" id="sM"></b><span data-i18n="ch6.read.m"></span></div></div>
    <p class="say" id="ch6Say" aria-live="polite"></p>
  </figure>
