<figure class="lab">
    <h3 data-i18n="ch5.model.title"></h3>
    <p class="how" data-i18n-html="ch5.model.how"></p>
    <canvas class="cv" id="wCv" role="img" data-i18n-aria="ch5.model.aria"></canvas>
    <div class="legend"><span><i style="background:var(--red)"></i><span data-i18n="ch5.leg.pi"></span></span><span style="color:var(--gold)"><i class="dash"></i><span data-i18n="ch5.leg.w"></span></span><span><i style="background:var(--cyan)"></i><span data-i18n="ch5.leg.om"></span></span></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch5.ctl.a"></span><input type="range" id="wA" min="0" max="1" step="0.1" value="0.5"><output id="wAo"></output></label><label class="rng"><span data-i18n="ch5.ctl.theta"></span><input type="range" id="wT" min="0" max="1" step="0.05" value="0.6"><output id="wTo"></output></label></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch5.ctl.rho"></span><input type="range" id="wR" min="0" max="1" step="0.05" value="0.7"><output id="wRo"></output></label><label class="rng"><span data-i18n="ch5.ctl.s"></span><input type="range" id="wS" min="0.04" max="0.3" step="0.01" value="0.1"><output id="wSo"></output></label></div>
    <div class="read"><div><b class="r" id="wP1"></b><span data-i18n="ch5.read.pi1"></span></div><div><b class="r" id="wP8"></b><span data-i18n="ch5.read.pi8"></span></div><div><b class="c" id="wO1"></b><span data-i18n="ch5.read.om1"></span></div><div><b class="c" id="wO8"></b><span data-i18n="ch5.read.om8"></span></div></div>
    <p class="say" id="ch5Say" aria-live="polite"></p>
  </figure>
