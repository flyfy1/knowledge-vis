<figure class="lab">
    <h3 data-i18n="ch3.model.title"></h3>
    <p class="how" data-i18n-html="ch3.model.how"></p>
    <canvas class="cv" id="pCv" role="img" data-i18n-aria="ch3.model.aria"></canvas>
    <div class="legend"><span><i style="background:var(--red)"></i><span data-i18n="ch3.leg.pi"></span></span><span style="color:var(--violet)"><i class="dash"></i><span data-i18n="ch3.leg.pe"></span></span><span><i style="background:var(--cyan)"></i><span data-i18n="ch3.leg.u"></span></span></div>
    <div class="ctl"><div class="seg" role="radiogroup" data-i18n-aria="ch3.ctl.mode"><span class="lbl" data-i18n="ch3.ctl.mode"></span><label><input type="radio" name="pM" value="hot" checked><span data-i18n="ch3.mode.hot"></span></label><label><input type="radio" name="pM" value="cool"><span data-i18n="ch3.mode.cool"></span></label></div><label class="chk"><input type="checkbox" id="pO"><span data-i18n="ch3.ctl.oil"></span></label></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch3.ctl.theta"></span><input type="range" id="pT" min="0" max="1" step="0.05" value="0"><output id="pTo"></output></label><label class="rng"><span data-i18n="ch3.ctl.gap"></span><input type="range" id="pG" min="0.5" max="3" step="0.25" value="1"><output id="pGo"></output></label></div>
    <div class="ctl"><button type="button" class="b" id="pRe" data-i18n="common.replay"></button></div>
    <div class="read"><div><b class="r" id="pR1"></b><span data-i18n="ch3.read.hot1" id="pL1"></span></div><div><b class="r" id="pR2"></b><span data-i18n="ch3.read.hot2" id="pL2"></span></div><div><b class="g" id="pR3"></b><span data-i18n="ch3.read.hot3" id="pL3"></span></div></div>
    <p class="say" id="ch3Say" aria-live="polite"></p>
  </figure>
