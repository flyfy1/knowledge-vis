<figure class="lab">
    <h3 data-i18n="ch7.model.title"></h3>
    <p class="how" data-i18n-html="ch7.model.how"></p>
    <canvas class="cv" id="fCv" role="img" data-i18n-aria="ch7.model.aria"></canvas>
    <div class="legend"><span><i style="background:var(--red)"></i><span data-i18n="ch7.leg.b"></span></span><span style="color:var(--mute)"><i class="dash"></i><span data-i18n="ch7.leg.ref"></span></span></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch7.ctl.pi"></span><input type="range" id="fP" min="-10" max="6" step="0.2" value="-6.8"><output id="fPo"></output></label><label class="rng"><span data-i18n="ch7.ctl.i"></span><input type="range" id="fI" min="0" max="10" step="0.5" value="5"><output id="fIo"></output></label></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch7.ctl.b0"></span><input type="range" id="fB" min="50" max="300" step="10" value="100"><output id="fBo"></output></label><label class="rng"><span data-i18n="ch7.ctl.sigma"></span><input type="range" id="fS" min="0" max="20" step="1" value="10"><output id="fSo"></output></label></div>
    <div class="ctl"><label class="chk"><input type="checkbox" id="fF"><span data-i18n="ch7.ctl.fisher"></span></label></div>
    <div class="read"><div><b class="r" id="fB4"></b><span data-i18n="ch7.read.b4"></span></div><div><b class="r" id="fBT"></b><span data-i18n="ch7.read.bT"></span></div><div><b class="" id="fRef"></b><span data-i18n="ch7.read.ref"></span></div><div><b class="g" id="fR"></b><span data-i18n="ch7.read.rr"></span></div></div>
    <p class="say" id="ch7Say" aria-live="polite"></p>
  </figure>
