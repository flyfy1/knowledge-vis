<pre><code>def enumerate_routes(ring, key, i=0, p=0):
    if i == len(key):
        return 0
    return min(min(abs(q-p), len(ring)-abs(q-p)) + 1
               + enumerate_routes(ring, key, i+1, q)
               for q, letter in enumerate(ring) if letter == key[i])</code></pre>
