<section class="step" id="step1"><div class="step-inner"><p class="step-kicker">02</p><h2 data-i18n="s1"></h2><p class="question" data-i18n="q1"></p><p class="explain" data-i18n="baseline"></p><pre><code>def baseline(words, puzzles):
    answer = []
    for p in puzzles:
        allowed = set(p)
        answer.append(sum(1 for w in words
                          if p[0] in w and set(w) &lt;= allowed))
    return answer</code></pre><p class="explain" data-i18n="cost"></p><p class="explain" data-i18n="wrong"></p><p class="question" data-i18n="turn"></p><p class="explain" data-i18n="sixtyFour"></p><p class="explain" data-i18n="flip"></p></div></section>
