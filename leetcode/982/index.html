<section class="step" id="step1" data-step="1"><div class="step-inner"><h2 data-i18n="s1"></h2><p data-i18n="baseline"></p><pre tabindex="0"><code>def baseline(nums):
    answer = 0
    for a in nums:
        for b in nums:
            for c in nums:
                if (a &amp; b &amp; c) == 0:
                    answer += 1
    return answer
