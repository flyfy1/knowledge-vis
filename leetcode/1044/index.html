<section id="step2" class="step" data-step="2"><div class="step-inner"><h2 data-i18n="h2"></h2><p class="explain" data-i18n="p2"></p><p data-i18n="baselineText"></p><pre tabindex="0"><code>def baseline(s):
    best = ""
    for i in range(len(s)):
        for j in range(i + 1, len(s)):
            h = 0
            while j + h < len(s) and s[i + h] == s[j + h]:
                h += 1
            if h > len(best):
                best = s[i:i + h]
    return best
</code></pre><p data-i18n="orderText"></p><div class="table-wrap" tabindex="0" role="region" aria-labelledby="sortedCaption"><table><caption id="sortedCaption" data-i18n="sortedCaption"></caption><thead><tr><th scope="col" data-i18n="start"></th><th scope="col" data-i18n="suffix"></th><th scope="col" data-i18n="lcp"></th></tr></thead><tbody id="sorted"></tbody></table></div><p class="question" data-i18n="neighborProof"></p><p data-i18n="wrong"></p></div></section>
