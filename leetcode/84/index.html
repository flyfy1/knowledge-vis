    best = 0
    for l in range(len(heights)):
        low = heights[l]
        for r in range(l, len(heights)):
            low = min(low, heights[r])
            best = max(best, low * (r - l + 1))
    return best</code></pre><p class="explain" data-i18n="baselineCost"></p></div></section>
