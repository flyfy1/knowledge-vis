<section class="step" id="step1" data-step="1"><div class="step-inner"><h2 data-i18n="s1"></h2><p data-i18n="p1"></p><pre tabindex="0"><code id="baselineSource">def baseline(rods):
    def visit(i, a, b):
        if i == len(rods):
            return a if a == b else 0
        x = rods[i]
        return max(visit(i + 1, a, b),
                   visit(i + 1, a + x, b),
                   visit(i + 1, a, b + x))
    return visit(0, 0, 0)
</code></pre><p data-i18n="baselineCost"></p><p data-i18n="recursion"></p><p class="question" data-i18n="wrong"></p></div></section>
