<section class="step" id="step1" data-step="1"><div class="step-inner"><p class="step-kicker">02</p><h2 data-i18n="s1"></h2><p class="explain" data-i18n="baselineIntro"></p><pre tabindex="0"><code>import random

class Baseline:
    def __init__(self, n, blacklist):
        blocked = set(blacklist)
        self.allowed = [x for x in range(n) if x not in blocked]

    def pick(self):
        return self.allowed[random.randrange(len(self.allowed))]</code></pre><p class="explain" data-i18n="baselineCost"></p><p class="explain" data-i18n="retry"></p><p class="question" data-i18n="wrong"></p></div></section>
