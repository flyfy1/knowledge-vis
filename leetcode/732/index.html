<section class="step" id="step1"><div class="step-inner"><h2 data-i18n="s1t"></h2><p class="explain" data-i18n="baseline"></p><pre><code># Small-domain baseline / 小范围基线
class CellCalendar:
    def __init__(self, U):
        self.cells = [0] * U

    def book(self, startTime, endTime):
        for x in range(startTime, endTime):
            self.cells[x] += 1
        return max(self.cells)
