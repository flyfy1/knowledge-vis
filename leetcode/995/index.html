    a = nums[:]
    flips = 0
    for i in range(len(a)):
        if a[i] == 0:
            if i + k > len(a):
                return -1
            for j in range(i, i + k):
                a[j] = 1 - a[j]
            flips += 1
    return flips
</code></pre></details></div></section><section id="step3" class="step" data-step="3"><div class="step-inner"><h2 data-i18n="h3"></h2><p class="explain" data-i18n="p3"></p><p data-i18n="expiryBridge"></p><p class="formula" data-i18n="formula"></p><div class="stage"><label for="preset" data-i18n="preset"></label><select id="preset"><option value="0" data-i18n="sel0"></option><option value="1" data-i18n="sel1"></option><option value="2" data-i18n="sel2"></option><option value="3" data-i18n="sel3"></option><option value="4" data-i18n="sel4"></option><option value="5" data-i18n="sel5"></option><option value="6" data-i18n="sel6"></option><option value="7" data-i18n="sel7"></option></select><p id="presetDescription" class="readout"></p><p class="hint" data-i18n="presetsHelp"></p><h3 data-i18n="valuesLabel"></h3><div id="bits" class="bits"></div><div class="controls"><button class="btn" id="prev" data-i18n="backStep"></button><button class="btn primary" id="next" data-i18n="next"></button><button class="btn" id="reset" data-i18n="reset"></button><button class="btn" id="end" data-i18n="end"></button></div><p id="event" class="question" aria-live="polite"></p><p id="progress" class="readout"></p><h3 id="ledgerTitle" data-i18n="ledgerTitle"></h3><div id="ledgerScroll" class="table-wrap" tabindex="0" role="region" aria-labelledby="ledgerTitle"><table><thead><tr><th scope="col" data-i18n="colI"></th><th scope="col" data-i18n="colParity"></th><th scope="col" data-i18n="colTest"></th><th scope="col" data-i18n="colDecision"></th></tr></thead><tbody id="ledger"></tbody></table></div></div><p data-i18n="invariant"></p></div></section><section id="step4" class="step" data-step="4"><div class="step-inner"><h2 data-i18n="h4"></h2><p class="explain" data-i18n="p4"></p><fieldset class="prediction-options"><legend data-i18n="choose"></legend><label><input type="radio" name="prediction" value="0"><span data-i18n="opt0"></span></label><label><input type="radio" name="prediction" value="1"><
