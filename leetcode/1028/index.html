<section id="step1" class="step" data-step="1"><div class="step-inner"><h2 data-i18n="h1"></h2><p class="explain" data-i18n="p1"></p><p class="formula" data-i18n="tokens"></p><div class="stage"><p class="hint" data-i18n="handHint"></p><div id="handTree" class="tree" tabindex="0" role="region"></div><p id="handText" class="readout" aria-live="polite"></p><div class="controls"><button type="button" class="btn" id="handPrev" data-i18n="handPrev"></button><button type="button" class="btn" id="handNext" data-i18n="handNext"></button></div></div><p data-i18n="limits"></p></div></section>
<section id="step2" class="step" data-step="2"><div class="step-inner"><h2 data-i18n="h2"></h2><p class="explain" data-i18n="p2"></p><p data-i18n="baseline"></p><details><summary data-i18n="baseSource"></summary><pre tabindex="0"><code>def split_tree(ts):
    if not ts:
        return None
    depth, value = ts[0]
    cut = len(ts)
    for j in range(2, len(ts)):
        if ts[j][0] == depth + 1:
            cut = j
            break
    left = split_tree(ts[1:cut])
    right = split_tree(ts[cut:])
    return (value, left, right)
</code></pre></details><p class="question" data-i18n="wrongRule"></p><p data-i18n="bridge"></p></div></section>
