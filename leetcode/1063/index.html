<details><summary data-i18n="baseSource"></summary><pre tabindex="0" aria-label="基线 Python / Baseline Python"><code id="baselineCode">def baseline(nums):
    count = 0
    for i in range(len(nums)):
        for j in range(i, len(nums)):
            if nums[j] &lt; nums[i]:
                break  # every longer subarray from i also contains nums[j]
            count += 1
    return count
</code></pre></details><p class="question" data-i18n="slowCase"></p></div></section>
