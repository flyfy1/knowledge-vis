def pop_scan(a):
    counts = Counter(a)
    highest = max(counts.values())
    for i in range(len(a) - 1, -1, -1):
        if counts[a[i]] == highest:
            return a.pop(i)</code></pre><p class="explain" data-i18n="baselineCost"></p><p class="question" data-i18n="wrong"></p></div></section><section class="step" id="step2" data-step="2"><div class="step-inner"><p class="step-kicker">03</p><h2 data-i18n="s2"></h2><p class="question" data-i18n="q2"></p><p class="explain" data-i18n="derive"></p><p class="explain" data-i18n="derive2"></p><p class="explain" data-i18n="proof"></p><p class="explain" data-i18n="proof2"></p><p class="explain" data-i18n="task"></p><div class="stage"><p class="hint" data-i18n="simulation"></p><label for="preset" data-i18n="preset"></label><select id="preset" aria-describedby="presetSummary"><option value="0">A</option><option value="1">B</option><option value="2">C</option></select><p id="presetSummary" class="readout"></p><div class="controls"><button type="button" class="btn" id="prev" data-i18n="prev"></button><button type="button" class="btn" id="next" data-i18n="next"></button><button type="button" class="btn" id="reset" data-i18n="reset"></button><button type="button" class="btn" id="end" data-i18n="end"></button></div><label for="position" data-i18n="position"></label><input id="position" type="range" min="0" value="0"><p id="progress" aria-live="polite"></p><p id="operation" class="readout"></p><div class="states"><div><h3 data-i18n="before"></h3><div id="before"></div></div><div><h3 data-i18n="after"></h3><div id="after"></div></div></div><p id="outputs" class="readout"></p><h3 data-i18n="history"></h3><ol id="history"></ol></div></div></section><section class="step" id="step3" data-step="3"><div class="step-inner"><p class="step-kicker">04</p><h2 data-i18n="s3"></h2><p class="question" data-i18n="q3"></p><fieldset class="prediction-options"><legend data-i18n="quiz"></legend><label><input type="radio" name="prediction" value="0"><span data-i18n="option0"></span></label><label><input type="radio" name="prediction" value="1"><span data-i18n="option1"></span></label><label><input
