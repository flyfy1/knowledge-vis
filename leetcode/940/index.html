<section class="step" id="step1"><div class="step-inner"><h2 data-i18n="s1"></h2><p data-i18n="p1"></p><pre tabindex="0"><code>def baseline(s):
    seen = set()
    for mask in range(1, 1 &lt;&lt; len(s)):
        word = ''.join(s[i] for i in range(len(s))
                       if mask &amp; (1 &lt;&lt; i))
        seen.add(word)
    return len(seen)
</code></pre><p data-i18n="baselineCost"></p><p class="question" data-i18n="wrong"></p></div></section>
