<div class="controls">
<label>
<span data-i18n="lenLab">
</span>
<input id="s2-len" type="range" min="3" max="8" step="0.1" value="6">
</label>
<label for="s2-lam">
<span data-i18n="lamLab">
</span>
<input id="s2-lam" type="range" min="2" max="14" step="any" value="4">
</label>
</div>
<output id="s2-lam-value" for="s2-lam" aria-live="off"></output>
<div class="btn-row">
<button type="button" class="btn big" id="s2-near" data-i18n="boundaryNear"></button>
<button type="button" class="btn big" id="s2-reset" data-i18n="boundaryReset"></button>
<button type="button" class="btn big" id="s2-snap" data-i18n="btnSnap">
</button>
<button type="button" class="btn big" id="s2-play" data-i18n="pause">
</button>
</div>
