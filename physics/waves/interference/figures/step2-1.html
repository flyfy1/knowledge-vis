<p class="step-kicker" data-i18n="s2k">
</p>
<h2 data-i18n="s2t">
</h2>
<p class="explain" data-i18n-html="s2e">
</p>
<div class="stage">
<canvas id="s2-canvas" height="360" data-i18n-aria="canvasLabel" role="img">
</canvas>
</div>
<div class="controls">
<label>
<span data-i18n="lamLab">
</span>
<input id="s2-lam" type="range" min="1" max="3" step="0.1" value="2">
</label>
<label>
<span data-i18n="pxLab">
</span>
<input id="s2-px" type="range" min="-7.5" max="7.5" step="0.1" value="1.5">
</label>
<label>
<span data-i18n="pyLab">
</span>
<input id="s2-py" type="range" min="-4.5" max="4.5" step="0.1" value="1.5">
</label>
</div>
<label class="check-label">
<input id="s2-env" type="checkbox" checked>
<span data-i18n="envLab">
</span>
</label>
<div class="btn-row">
<span class="row-label legend-max" data-i18n="legMax">
</span>
<span class="row-label legend-min" data-i18n="legMin">
</span>
<button type="button" class="btn big" id="s2-play" data-i18n="pause">
</button>
</div>
<p class="readout" id="s2-readout" aria-live="polite">
</p>
<p class="readout" id="s2-cls" aria-live="polite">
</p>
