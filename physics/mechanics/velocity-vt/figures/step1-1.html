<div class="stage">
      <canvas id="s1-track" height="230"></canvas>
    </div>
    <div class="btn-row">
      <button class="btn big active" id="s1-m-xt" data-i18n="s1mXt"></button>
      <button class="btn big" id="s1-m-vt" data-i18n="s1mVt"></button>
    </div>
    <div class="stage">
      <canvas id="s1-chart" height="300"></canvas>
    </div>
    <div class="btn-row">
      <button class="btn big primary" id="s1-play" data-i18n="play"></button>
      <button class="btn big" id="s1-restart" data-i18n="restart"></button>
    </div>
    <div class="controls">
      <label><span><span data-i18n="s1probeLab"></span> <span class="val" id="s1-t-val">t = 0 s</span></span>
        <input type="range" id="s1-probe" min="0" max="8" step="0.1" value="0">
      </label>
    </div>
    <p class="readout" id="s1-readout"></p>
