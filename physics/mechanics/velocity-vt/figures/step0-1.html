<div class="stage">
      <canvas id="s0-track" height="190"></canvas>
    </div>
    <div class="stage">
      <canvas id="s0-chart" height="300"></canvas>
    </div>
    <div class="btn-row">
      <button class="btn big primary" id="s0-play" data-i18n="play"></button>
      <button class="btn big" id="s0-restart" data-i18n="restart"></button>
    </div>
    <div class="controls">
      <label><span><span data-i18n="s0probeLab"></span> <span class="val" id="s0-t-val">t = 0 s</span></span>
        <input type="range" id="s0-probe" min="0" max="10" step="0.1" value="0">
      </label>
    </div>
    <p class="readout" id="s0-readout"></p>
