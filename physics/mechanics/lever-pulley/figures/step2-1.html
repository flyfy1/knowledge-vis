<div class="stage">
      <p class="stage-title" data-i18n="dragHint3d"></p>
      <div class="viewport3d"><canvas id="s2-canvas" tabindex="0" role="img" aria-label="3D scene"></canvas><div class="labels" aria-hidden="true"></div></div>
    </div>
    <div class="btn-row">
      <button class="btn" id="s2-view" data-i18n="viewBtn"></button>
    </div>
    <div class="btn-row">
      <span class="row-label" data-i18n="s2ratioLab"></span>
      <button class="btn big" id="s2-r2" aria-pressed="false">2 : 1</button>
      <button class="btn big active" id="s2-r3" aria-pressed="true">3 : 1</button>
      <button class="btn big" id="s2-r4" aria-pressed="false">4 : 1</button>
      <button class="btn big primary" id="s2-play" data-i18n="s2play"></button>
    </div>
    <div class="ledger">
      <div class="ledger-row">
        <span class="ledger-lab" data-i18n="s2ledgerIn"></span>
        <div class="ledger-track"><div class="ledger-fill in" id="s2-fill-in"></div></div>
        <span class="ledger-val" id="s2-val-in">0 J</span>
      </div>
      <div class="ledger-row">
        <span class="ledger-lab" data-i18n="s2ledgerOut"></span>
        <div class="ledger-track"><div class="ledger-fill out" id="s2-fill-out"></div></div>
        <span class="ledger-val" id="s2-val-out">0 J</span>
      </div>
    </div>
    <p class="readout" id="s2-readout"></p>
