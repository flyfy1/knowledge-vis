<div class="stage"><canvas id="s4-plot" height="360"></canvas></div>
    <div class="controls">
      <label><span><span data-i18n="s4nLab"></span> <span class="val" id="s4-n-val">100</span></span>
        <input type="range" id="s4-n" min="1" max="3.5" step="0.01" value="2"></label>
    </div>
    <p class="readout" id="s4-readout"></p>
    <p class="readout" id="s4-cross"></p>
    <h3 style="margin-top:24px;font-size:19px" data-i18n="s4termT"></h3>
    <p class="explain" data-i18n-html="s4termE" style="margin-top:8px"></p>
    <div class="stage"><canvas id="s4-term" height="120"></canvas></div>
    <div class="btn-row" id="s4-term-btns">
      <button class="btn" data-termn="10">n = 10</button>
      <button class="btn" data-termn="50">n = 50</button>
      <button class="btn active" data-termn="100">n = 100</button>
      <button class="btn" data-termn="1000">n = 1000</button>
      <button class="btn" data-termn="10000">n = 10000</button>
    </div>
