<figure class="lab" id="lab-ch10-model">
    <h3 data-i18n="ch10.model.title"></h3>
    <p class="how" data-i18n-html="ch10.model.how"></p>
    <div class="ctl">
      <label class="rng"><span data-i18n="ch10.ctl.refs"></span><input type="range" id="c10Refs" min="3" max="6" step="0.1" value="5"><output id="c10Refso" for="c10Refs"></output></label>
      <label class="rng"><span data-i18n="ch10.ctl.act"></span><input type="range" id="c10Act" min="1" max="20" step="1" value="2"><output id="c10Acto" for="c10Act"></output></label>
      <label class="chk"><input type="checkbox" id="c10Del" checked><span data-i18n="ch10.ctl.del"></span></label>
    </div>
    <canvas class="cv" id="c10Cv" role="img" data-i18n-aria="ch10.cv.aria"></canvas>
    <div class="read">
      <div><span data-i18n="ch10.read.packed"></span><b id="c10Packed" class="r"></b></div>
      <div><span data-i18n="ch10.read.reft"></span><b id="c10Reft" class="n"></b></div>
      <div><span data-i18n="ch10.read.amp"></span><b id="c10Amp" class="g"></b></div>
      <div><span data-i18n="ch10.read.sparse"></span><b id="c10Sparse" class="c"></b></div>
    </div>
    <p class="say" id="c10Say" aria-live="polite"></p>
  </figure>
