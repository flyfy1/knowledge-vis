<figure class="lab" id="lab-ch8-model">
    <h3 data-i18n="ch8.model.title"></h3>
    <p class="how" data-i18n-html="ch8.model.how"></p>
    <div class="ctl">
      <label class="rng"><span data-i18n="ch8.ctl.win"></span><input type="range" id="c8Win" min="0" max="8" step="1" value="4"><output id="c8Wino" for="c8Win"></output></label>
      <label class="chk"><input type="checkbox" id="c8Sort" checked><span data-i18n="ch8.ctl.sort"></span></label>
      <label class="rng"><span data-i18n="ch8.ctl.slot"></span><input type="range" id="c8Slot" min="0" max="9" step="1" value="3"><output id="c8Sloto" for="c8Slot"></output></label>
    </div>
    <canvas class="cv tall" id="c8Cv" role="img" data-i18n-aria="ch8.cv.aria"></canvas>
    <div class="read">
      <div><span data-i18n="ch8.read.loose"></span><b id="c8Loose" class="r"></b></div>
      <div><span data-i18n="ch8.read.pack"></span><b id="c8Pack" class="n"></b></div>
      <div><span data-i18n="ch8.read.save"></span><b id="c8Save" class="g"></b></div>
      <div><span data-i18n="ch8.read.probe"></span><b id="c8Probe" class="c"></b></div>
    </div>
    <p class="say" id="c8Say" aria-live="polite"></p>
  </figure>
