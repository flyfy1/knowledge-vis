<figure class="lab" id="lab-ch5-model">
    <h3 data-i18n="ch5.model.title"></h3>
    <p class="how" data-i18n-html="ch5.model.how"></p>
    <div class="ctl">
      <label class="rng"><span data-i18n="ch5.ctl.n"></span><input type="range" id="c5N" min="100" max="20000" step="100" value="2000"><output id="c5No" for="c5N"></output></label>
      <label class="rng"><span data-i18n="ch5.ctl.mod"></span><input type="range" id="c5Mod" min="0" max="100" step="1" value="3"><output id="c5Modo" for="c5Mod"></output></label>
      <label class="rng"><span data-i18n="ch5.ctl.touch"></span><input type="range" id="c5Touch" min="0" max="100" step="1" value="5"><output id="c5Toucho" for="c5Touch"></output></label>
      <label class="chk"><input type="checkbox" id="c5Racy"><span data-i18n="ch5.ctl.racy"></span></label>
    </div>
    <canvas class="cv" id="c5Cv" role="img" data-i18n-aria="ch5.cv.aria"></canvas>
    <div class="read">
      <div><span data-i18n="ch5.read.skip"></span><b id="c5Skip" class="n"></b></div>
      <div><span data-i18n="ch5.read.hash"></span><b id="c5Hash" class="g"></b></div>
      <div><span data-i18n="ch5.read.racy"></span><b id="c5RacyCnt" class="r"></b></div>
      <div><span data-i18n="ch5.read.idx"></span><b id="c5Idx" class="c"></b></div>
    </div>
    <p class="say" id="c5Say" aria-live="polite"></p>
  </figure>
