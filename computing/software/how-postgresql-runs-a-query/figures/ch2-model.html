<figure class="lab" id="lab-ch2-model">
  <h3 data-i18n="ch2.model.title"></h3>
  <p class="how" data-i18n="ch2.model.how"></p>
  <div class="ctl">
    <label class="rng"><span data-i18n="ch2.ctl.sel"></span><input type="range" id="c2Sel" min="0.1" max="35" step="0.1" value="3.0"><output id="c2Selo" for="c2Sel"></output></label>
    <label class="rng"><span data-i18n="ch2.ctl.rpc"></span><input type="range" id="c2Rpc" min="1.0" max="4.0" step="0.1" value="4.0"><output id="c2Rpco" for="c2Rpc"></output></label>
    <label class="chk"><input type="checkbox" id="c2Vis"><span data-i18n="ch2.ctl.vis"></span></label>
  </div>
  <canvas class="cv" id="c2Cv" role="img" data-i18n-aria="ch2.cv.aria"></canvas>
  <div class="legend">
    <span><i style="background:var(--gold)"></i><span data-i18n="ch2.leg.seq"></span></span>
    <span><i style="background:var(--cyan)"></i><span data-i18n="ch2.leg.idx"></span></span>
    <span><i style="background:var(--green)"></i><span data-i18n="ch2.leg.bmp"></span></span>
    <span><i style="background:var(--violet)"></i><span data-i18n="ch2.leg.ios"></span></span>
  </div>
  <div class="read">
    <div><span data-i18n="ch2.read.win"></span><b id="c2Win" class="g"></b></div>
    <div><span data-i18n="ch2.read.seq"></span><b id="c2Seq"></b></div>
    <div><span data-i18n="ch2.read.bmp"></span><b id="c2Bmp" class="n"></b></div>
    <div><span data-i18n="ch2.read.idx"></span><b id="c2Idx" class="c"></b></div>
  </div>
  <p class="say" id="c2Say" aria-live="polite"></p>
</figure>
