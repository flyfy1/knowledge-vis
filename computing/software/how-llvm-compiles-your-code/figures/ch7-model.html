<figure class="lab" id="lab-ch7-model">

    <p class="how" data-i18n="ch7.model.how"></p>

      <div class="seg" role="radiogroup" data-i18n-aria="ch7.ctl.pre">

        <label><input type="radio" name="c7Pre" value="shiftAdd"><span data-i18n="ch7.pre.shiftAdd"></span></label>
