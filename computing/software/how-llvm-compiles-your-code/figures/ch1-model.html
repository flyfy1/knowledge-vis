<figure class="lab" id="lab-ch1-model">
    <h3 data-i18n="ch1.model.title"></h3>
    <p class="how" data-i18n="ch1.model.how"></p>
    <div class="ctl">
      <label class="rng"><span data-i18n="ch1.ctl.fe"></span><input type="range" id="c1Fe" min="1" max="8" step="1" value="6"><output id="c1Feo" for="c1Fe"></output></label>
      <label class="rng"><span data-i18n="ch1.ctl.be"></span><input type="range" id="c1Be" min="1" max="8" step="1" value="5"><output id="c1Beo" for="c1Be"></output></label>
      <label class="rng"><span data-i18n="ch1.ctl.pass"></span><input type="range" id="c1Pass" min="1" max="20" step="1" value="10"><output id="c1Passo" for="c1Pass"></output></label>
      <label class="chk"><input type="checkbox" id="c1Mono"><span data-i18n="ch1.ctl.mono"></span></label>
    </div>
    <canvas class="cv" id="c1Cv" role="img" data-i18n-aria="ch1.cv.aria"></canvas>
    <div class="read">
      <div><span data-i18n="ch1.read.mono"></span><b id="c1RM" class="r"></b></div>
      <div><span data-i18n="ch1.read.llvm"></span><b id="c1RL" class="c"></b></div>
      <div><span data-i18n="ch1.read.passes"></span><b id="c1RP" class="g"></b></div>
      <div><span data-i18n="ch1.read.ratio"></span><b id="c1RR" class="n"></b></div>
    </div>
    <p class="say" id="c1Say" aria-live="polite"></p>
  </figure>
