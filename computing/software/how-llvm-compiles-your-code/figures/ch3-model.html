<figure class="lab" id="lab-ch3-model">
    <h3 data-i18n="ch3.model.title"></h3>
    <p class="how" data-i18n="ch3.model.how"></p>
    <div class="ctl">
      <div class="seg" role="radiogroup" data-i18n-aria="ch3.ctl.cfg">
        <span class="lbl" data-i18n="ch3.ctl.cfg"></span>
        <label><input type="radio" name="c3Cfg" value="diamond" checked><span data-i18n="ch3.cfg.diamond"></span></label>
        <label><input type="radio" name="c3Cfg" value="ifThen"><span data-i18n="ch3.cfg.ifThen"></span></label>
        <label><input type="radio" name="c3Cfg" value="loop"><span data-i18n="ch3.cfg.loop"></span></label>
        <label><input type="radio" name="c3Cfg" value="chained"><span data-i18n="ch3.cfg.chained"></span></label>
      </div>
      <label class="chk"><input type="checkbox" id="c3Pass" checked><span data-i18n="ch3.ctl.pass"></span></label>
    </div>
    <canvas class="cv tall" id="c3Cv" role="img" data-i18n-aria="ch3.cv.aria"></canvas>
    <div class="read">
      <div><span data-i18n="ch3.read.phi"></span><b id="c3Phi" class="n"></b></div>
      <div><span data-i18n="ch3.read.ver"></span><b id="c3Ver" class="c"></b></div>
      <div><span data-i18n="ch3.read.mem"></span><b id="c3Mem" class="g"></b></div>
      <div><span data-i18n="ch3.read.df"></span><b id="c3Df" class="v"></b></div>
    </div>
    <p class="say" id="c3Say" aria-live="polite"></p>
  </figure>
