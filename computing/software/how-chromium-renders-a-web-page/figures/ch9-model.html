        <span class="lbl" data-i18n="ch9.ctl.prop"></span>

      <div><span data-i18n="ch9.read.max"></span><b id="c9Max" class="g"></b></div>
      <div><span data-i18n="ch9.read.fps"></span><b id="c9Fps" class="n"></b></div>
    </div>
    <p class="say" id="c9Say" aria-live="polite"></p>
