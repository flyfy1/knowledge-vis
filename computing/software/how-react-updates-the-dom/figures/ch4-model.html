<figure class="lab" id="lab-ch4-model">
  <h3 data-i18n="ch4.model.title"></h3>
  <p class="how" data-i18n="ch4.model.how"></p>
  <div class="ctl">
    <div class="seg" role="radiogroup" data-i18n-aria="ch4.ctl.sc">
      <span class="lbl" data-i18n="ch4.ctl.sc"></span>
      <label><input type="radio" name="c4Sc" value="prepend" checked><span data-i18n="ch4.sc.prepend"></span></label>
      <label><input type="radio" name="c4Sc" value="reverse"><span data-i18n="ch4.sc.reverse"></span></label>
      <label><input type="radio" name="c4Sc" value="swap"><span data-i18n="ch4.sc.swap"></span></label>
      <label><input type="radio" name="c4Sc" value="deleteB"><span data-i18n="ch4.sc.deleteB"></span></label>
    </div>
    <div class="seg" role="radiogroup" data-i18n-aria="ch4.ctl.key">
      <span class="lbl" data-i18n="ch4.ctl.key"></span>
      <label><input type="radio" name="c4Key" value="id" checked><span data-i18n="ch4.key.id"></span></label>
      <label><input type="radio" name="c4Key" value="index"><span data-i18n="ch4.key.index"></span></label>
    </div>
  </div>
  <canvas class="cv" id="c4Cv" role="img" data-i18n-aria="ch4.cv.aria"></canvas>
  <div class="read">
    <div><span data-i18n="ch4.read.reused"></span><b id="c4Reuse" class="n"></b></div>
    <div><span data-i18n="ch4.read.moves"></span><b id="c4Moves" class="g"></b></div>
    <div><span data-i18n="ch4.read.mounts"></span><b id="c4Mounts" class="c"></b></div>
    <div><span data-i18n="ch4.read.bug"></span><b id="c4Bug" class="r"></b></div>
  </div>
  <p class="say" id="c4Say" aria-live="polite"></p>
</figure>
