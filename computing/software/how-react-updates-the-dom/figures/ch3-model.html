<figure class="lab" id="lab-ch3-model">
  <h3 data-i18n="ch3.model.title"></h3>
  <p class="how" data-i18n="ch3.model.how"></p>
  <div class="ctl">
    <label class="rng"><span data-i18n="ch3.ctl.units"></span><input type="range" id="c3Units" min="0" max="11" step="1" value="5"><output id="c3Unitso" for="c3Units"></output></label>
    <label class="rng"><span data-i18n="ch3.ctl.budget"></span><input type="range" id="c3Budget" min="2" max="10" step="0.5" value="5"><output id="c3Budgeto" for="c3Budget"></output></label>
  </div>
  <div class="ctl">
    <button type="button" class="btn pri" id="c3StepBtn" data-i18n="ch3.btn.step"></button>
    <button type="button" class="btn" id="c3SliceBtn" data-i18n="ch3.btn.slice"></button>
    <button type="button" class="btn" id="c3ResetBtn" data-i18n="ch3.btn.reset"></button>
    <label class="chk"><input type="checkbox" id="c3Preempt"><span data-i18n="ch3.ctl.preempt"></span></label>
  </div>
  <canvas class="cv tall" id="c3Cv" role="img" data-i18n-aria="ch3.cv.aria"></canvas>
  <div class="read">
    <div><span data-i18n="ch3.read.cursor"></span><b id="c3Cur" class="g"></b></div>
    <div><span data-i18n="ch3.read.yields"></span><b id="c3Yld" class="c"></b></div>
    <div><span data-i18n="ch3.read.alt"></span><b id="c3Alt" class="v"></b></div>
    <div><span data-i18n="ch3.read.dom"></span><b id="c3Dom" class="n"></b></div>
  </div>
  <p class="say" id="c3Say" aria-live="polite"></p>
</figure>
