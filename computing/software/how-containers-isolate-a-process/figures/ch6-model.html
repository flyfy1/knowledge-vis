<figure class="lab" id="lab-ch6-model">
  <h3 data-i18n="ch6.model.title"></h3>
  <p class="how" data-i18n="ch6.model.how"></p>
  <div class="ctl">
    <label class="rng"><span data-i18n="ch6.ctl.cpus"></span><input type="range" id="c6Cpus" min="0.25" max="4" step="0.25" value="0.5"><output id="c6Cpuso" for="c6Cpus"></output></label>
    <label class="rng"><span data-i18n="ch6.ctl.thr"></span><input type="range" id="c6Thr" min="1" max="8" step="1" value="4"><output id="c6Thro" for="c6Thr"></output></label>
    <div class="seg" role="radiogroup" data-i18n-aria="ch6.ctl.per">
      <span class="lbl" data-i18n="ch6.ctl.per"></span>
      <label><input type="radio" name="c6Per" value="100" checked><span data-i18n="ch6.per.100"></span></label>
      <label><input type="radio" name="c6Per" value="20"><span data-i18n="ch6.per.20"></span></label>
      <label><input type="radio" name="c6Per" value="10"><span data-i18n="ch6.per.10"></span></label>
    </div>
  </div>
  <canvas class="cv" id="c6Cv" role="img" data-i18n-aria="ch6.cv.aria"></canvas>
  <div class="read">
    <div><span data-i18n="ch6.read.burn"></span><b id="c6Burn" class="g"></b></div>
    <div><span data-i18n="ch6.read.freeze"></span><b id="c6Freeze" class="r"></b></div>
    <div><span data-i18n="ch6.read.rpc"></span><b id="c6Rpc" class="c"></b></div>
    <div><span data-i18n="ch6.read.stat"></span><b id="c6Stat"></b></div>
  </div>
  <p class="say" id="c6Say" aria-live="polite"></p>
</figure>
