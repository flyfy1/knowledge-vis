<figure class="lab" id="lab-ch2-model">
    <h3 data-i18n="ch2.model.title"></h3>
    <p class="how" data-i18n="ch2.model.how"></p>
    <div class="ctl"><label class="rng"><span data-i18n="ch2.ctl.day"></span><input type="range" id="c2Day" min="0" max="6.28" step="0.01" value="0.3"><output id="c2Dayo" for="c2Day"></output></label><label class="rng"><span data-i18n="ch2.ctl.scale"></span><input type="range" id="c2Scale" min="0.25" max="2" step="0.25" value="0.5"><output id="c2Scaleo" for="c2Scale"></output></label><label class="chk"><input type="checkbox" id="c2Stale"><span data-i18n="ch2.ctl.stale"></span></label></div>
    <canvas class="cv" id="c2Cv" role="img" data-i18n-aria="ch2.cv.aria"></canvas>
    <div class="read"><div><span data-i18n="ch2.read.pos"></span><b id="c2Pos"></b></div><div><span data-i18n="ch2.read.orbit"></span><b id="c2Orb" class=g></b></div><div><span data-i18n="ch2.read.work"></span><b id="c2Work" class=c></b></div><div><span data-i18n="ch2.read.lag"></span><b id="c2Lag" class=r></b></div></div>
    <p class="say" id="c2Say" aria-live="polite"></p>
  </figure>
