<figure class="lab" id="lab-ch5-model">
    <h3 data-i18n="ch5.model.title"></h3>
    <p class="how" data-i18n="ch5.model.how"></p>
    <div class="ctl"><label class="rng"><span data-i18n="ch5.ctl.yaw"></span><input type="range" id="c5Yaw" min="-0.8" max="0.8" step="0.05" value="-0.3"><output id="c5Yawo" for="c5Yaw"></output></label><label class="rng"><span data-i18n="ch5.ctl.fov"></span><input type="range" id="c5Fov" min="30" max="75" step="5" value="50"><output id="c5Fovo" for="c5Fov"></output></label><label class="rng"><span data-i18n="ch5.ctl.far"></span><input type="range" id="c5Far" min="8" max="30" step="1" value="18"><output id="c5Faro" for="c5Far"></output></label><label class="chk"><input type="checkbox" id="c5Sort" checked><span data-i18n="ch5.ctl.sort"></span></label></div>
    <canvas class="cv tall" id="c5Cv" role="img" data-i18n-aria="ch5.cv.aria"></canvas>
    <div class="read"><div><span data-i18n="ch5.read.vis"></span><b id="c5Vis" class=g></b></div><div><span data-i18n="ch5.read.cull"></span><b id="c5Cull"></b></div><div><span data-i18n="ch5.read.fp"></span><b id="c5Fp" class=r></b></div><div><span data-i18n="ch5.read.sw"></span><b id="c5Sw" class=c></b></div></div>
    <p class="say" id="c5Say" aria-live="polite"></p>
  </figure>
