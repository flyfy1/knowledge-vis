<figure class="lab" id="lab-ch2-model">
  <h3 data-i18n="ch2.model.title"></h3>
  <p class="how" data-i18n-html="ch2.model.how"></p>
  <div class="ctl">
    <label class="rng"><span data-i18n="ch2.ctl.time"></span><input type="range" id="c2Time" min="0" max="4000" step="50" value="1200"><output id="c2Timeo" for="c2Time"></output></label>
    <label class="rng"><span data-i18n="ch2.ctl.tail"></span><input type="range" id="c2Tail" min="400" max="3000" step="200" value="1200"><output id="c2Tailo" for="c2Tail"></output></label>
    <div class="seg" role="radiogroup" data-i18n-aria="ch2.ctl.mode">
      <span class="lbl" data-i18n="ch2.ctl.mode"></span>
      <label><input type="radio" name="c2Mode" value="graceful" checked><span data-i18n="ch2.mode.graceful"></span></label>
      <label><input type="radio" name="c2Mode" value="hard"><span data-i18n="ch2.mode.hard"></span></label>
    </div>
  </div>
  <canvas class="cv" id="c2Cv" role="img" data-i18n-aria="ch2.cv.aria"></canvas>
  <div class="legend">
    <span><i style="background:var(--gold)"></i><span data-i18n="ch2.leg.old"></span></span>
    <span><i style="background:var(--green)"></i><span data-i18n="ch2.leg.new"></span></span>
    <span><i style="background:var(--red)"></i><span data-i18n="ch2.leg.drop"></span></span>
  </div>
  <div class="read">
    <div><span data-i18n="ch2.read.old"></span><b id="c2Old" class="g"></b></div>
    <div><span data-i18n="ch2.read.new"></span><b id="c2New" class="n"></b></div>
    <div><span data-i18n="ch2.read.inflight"></span><b id="c2Inf" class="c"></b></div>
    <div><span data-i18n="ch2.read.drop"></span><b id="c2Drop" class="r"></b></div>
  </div>
  <p class="say" id="c2Say" aria-live="polite"></p>
</figure>
