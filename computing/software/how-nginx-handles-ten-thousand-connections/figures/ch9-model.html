<figure class="lab" id="lab-ch9-model">
  <h3 data-i18n="ch9.model.title"></h3>
  <p class="how" data-i18n-html="ch9.model.how"></p>
  <div class="ctl">
    <div class="seg" role="radiogroup" data-i18n-aria="ch9.ctl.scen">
      <span class="lbl" data-i18n="ch9.ctl.scen"></span>
      <label><input type="radio" name="c9Scen" value="static" checked><span data-i18n="ch9.scen.static"></span></label>
      <label><input type="radio" name="c9Scen" value="proxy"><span data-i18n="ch9.scen.proxy"></span></label>
    </div>
    <label class="chk"><input type="checkbox" id="c9Opt" checked><span id="c9OptLbl" data-i18n="ch9.ctl.opt"></span></label>
    <label class="rng"><span data-i18n="ch9.ctl.size"></span><input type="range" id="c9Size" min="1" max="64" step="1" value="16"><output id="c9Sizeo" for="c9Size"></output></label>
    <label class="rng"><span data-i18n="ch9.ctl.mbps"></span><input type="range" id="c9Mbps" min="1" max="100" step="1" value="2"><output id="c9Mbpso" for="c9Mbps"></output></label>
  </div>
  <canvas class="cv" id="c9Cv" role="img" data-i18n-aria="ch9.cv.aria"></canvas>
  <div class="read">
    <div><span data-i18n="ch9.read.copy"></span><b id="c9Copy" class="r"></b></div>
    <div><span data-i18n="ch9.read.sys"></span><b id="c9Sys" class="c"></b></div>
    <div><span data-i18n="ch9.read.up"></span><b id="c9Up" class="g"></b></div>
    <div><span data-i18n="ch9.read.cli"></span><b id="c9Cli" class="v"></b></div>
  </div>
  <p class="say" id="c9Say" aria-live="polite"></p>
</figure>
