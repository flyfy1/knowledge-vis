<figure class="lab" id="lab-ch6-model">
  <h3 data-i18n="ch6.model.title"></h3>

    <div><span data-i18n="ch6.read.streak"></span><b id="c6Str" class="c"></b></div>

    <div><span data-i18n="ch6.read.sum"></span><b id="c6Sum" class="n"></b></div>
