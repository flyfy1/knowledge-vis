<figure class="lab" id="lab-ch1-model">
  <h3 data-i18n="ch1.model.title"></h3>
  <p class="how" data-i18n="ch1.model.how"></p>
  <div class="ctl">
    <label class="rng"><span data-i18n="ch1.ctl.calls"></span><input type="range" id="c1Calls" min="1" max="5000" step="10" value="50"><output id="c1Callso" for="c1Calls"></output></label>
    <label class="rng"><span data-i18n="ch1.ctl.size"></span><input type="range" id="c1Size" min="33" max="500" step="11" value="121"><output id="c1Sizeo" for="c1Size"></output></label>
    <label class="chk"><input type="checkbox" id="c1Lazy" checked><span data-i18n="ch1.ctl.lazy"></span></label>
  </div>
  <canvas class="cv" id="c1Cv" role="img" data-i18n-aria="ch1.cv.aria"></canvas>
  <div class="read">
    <div><span data-i18n="ch1.read.tier"></span><b id="c1Tier" class="g"></b></div>
    <div><span data-i18n="ch1.read.tiered"></span><b id="c1Tiered" class="c"></b></div>
    <div><span data-i18n="ch1.read.ign"></span><b id="c1Ign" class="r"></b></div>
    <div><span data-i18n="ch1.read.always"></span><b id="c1Always" class="v"></b></div>
  </div>
  <p class="say" id="c1Say" aria-live="polite"></p>
</figure>
