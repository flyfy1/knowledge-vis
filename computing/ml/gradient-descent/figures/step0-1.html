<div class="stage">
      <canvas id="s0-canvas" height="400"></canvas>
    </div>
    <div class="controls">
      <label><span><span data-i18n="s0etaLab"></span> <span class="val" id="s0-eta-val">0.90</span></span>
        <input type="range" id="s0-eta" min="0.02" max="1.5" step="0.01" value="0.9"></label>
    </div>
    <div class="btn-row">
      <button class="btn" data-eta="0.1">η = 0.10</button>
      <button class="btn" data-eta="0.5">η = 0.50</button>
      <button class="btn" data-eta="0.9">η = 0.90</button>
      <button class="btn" data-eta="1">η = 1.00</button>
      <button class="btn" data-eta="1.05">η = 1.05</button>
    </div>
    <div class="btn-row">
      <button class="btn" id="s0-step" data-i18n="s0step"></button>
      <button class="btn" id="s0-play" data-i18n="s0play"></button>
      <button class="btn" id="s0-reset" data-i18n="s0reset"></button>
    </div>
    <p class="readout" id="s0-readout"></p>
    <p class="readout" id="s0-divnote" style="display:none"></p>
