  .pair { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .ctl { display:flex; flex-wrap:wrap; gap:4px 22px; align-items:center; margin:12px 0 2px; font-size:14.5px; color:var(--mute); }

  .read { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-top:14px; }

  .src { font-size:13px; color:var(--mute); margin-top:8px; line-height:1.6; }

  .flow { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin:6px 0 4px; }
  .flow .bx { background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:13.5px; line-height:1.55; color:var(--body); min-width:0; }

  /* frontier (ch10) */
  .fr { list-style:none; padding:0 !important; margin:0 0 1.4em !important; }

  .fr li .when { font:12px/1.4 var(--mono); color:var(--mute); display:block; margin-bottom:2px; }
  .fr li .who { font-size:13px; color:var(--mute); }
  table.recs { width:100%; border-collapse:collapse; font-size:14px; margin:0 0 1.2em; }
  .tblwrap { overflow-x:auto; margin:0 0 1.2em; }
  table.recs th, table.recs td { text-align:left; padding:8px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  table.recs th { color:var(--mute); font-weight:600; font-size:13px; }
  table.recs td.n { font:600 14px/1.4 var(--mono); color:var(--gold); white-space:nowrap; }
  @media (max-width:420px) { table.recs { font-size:12.5px; } table.recs th, table.recs td { padding:7px 4px; } table.recs th { font-size:12px; } table.recs td.n { font-size:12.5px; white-space:normal; } table.recs th { white-space:nowrap; } }

  .sum { margin:50px 0 0; padding:24px 24px; border:1px solid var(--line); border-radius:16px; background:linear-gradient(180deg,rgba(233,185,73,.07),transparent); font:400 clamp(17px,2.2vw,20px)/1.95 var(--serif); }
  .sum em { font-style:normal; color:var(--gold); }
  .qs { counter-reset:q; list-style:none; padding:0 !important; }
  .qs li { counter-increment:q; position:relative; padding:14px 0 14px 46px !important; border-bottom:1px solid var(--line); margin:0 !important; }
  .qs li::before { content:counter(q); position:absolute; left:0; top:14px; width:30px; height:30px; border-radius:50%; border:1px solid var(--gold); color:var(--gold); font:600 14px/28px var(--mono); text-align:center; }

  footer { margin:100px 0 0; padding:40px 0 70px; border-top:1px solid var(--line); color:var(--mute); font-size:14px; line-height:1.8; }

  @media (max-width:640px) {

  @media (max-width:420px) {
    .ctl label.rng { flex-wrap:wrap; gap:0 10px; justify-content:space-between; }
    .ctl label.rng input[type=range] { order:3; flex:1 1 100%; }
    .flow { grid-template-columns:1fr; }
    .read b { font-size:16px; }
  }
</style>
