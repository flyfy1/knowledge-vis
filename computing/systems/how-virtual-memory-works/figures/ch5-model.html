<figure class="lab">
    <h3 data-i18n="ch5.model.title"></h3>
    <p class="how" data-i18n-html="ch5.model.how"></p>
    <canvas class="cv" id="wcCv" role="img" data-i18n-aria="ch5.model.aria"></canvas>
    <div class="legend"><span><i class="band" style="background:var(--gold)"></i><span data-i18n="ch5.leg.best"></span></span><span><i class="band" style="background:var(--red)"></i><span data-i18n="ch5.leg.worst"></span></span></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch5.ctl.w"></span><input type="range" id="wcW" min="0" max="6" step="1" value="3"><output id="wcWo"></output></label></div>
    <div class="ctl"><label class="chk"><input type="checkbox" id="wcC" checked><span data-i18n="ch5.ctl.pwc"></span></label><div class="seg" role="radiogroup" data-i18n-aria="ch5.ctl.lv"><span class="lbl" data-i18n="ch5.ctl.lv"></span><label><input type="radio" name="wcL" value="4" checked><span data-i18n="ch3.lv.4"></span></label><label><input type="radio" name="wcL" value="5"><span data-i18n="ch3.lv.5"></span></label></div></div>
    <div class="read">
      <div><b class="r" id="wcM"></b><span data-i18n-html="ch5.read.miss"></span></div>
      <div><b class="c" id="wcR"></b><span data-i18n-html="ch5.read.refs"></span></div>
      <div><b class="g" id="wcB"></b><span data-i18n-html="ch5.read.best"></span></div>
      <div><b class="r" id="wcX"></b><span data-i18n-html="ch5.read.worst"></span></div>
    </div>
    <p class="say" id="wcSay" aria-live="polite"></p>
  </figure>
