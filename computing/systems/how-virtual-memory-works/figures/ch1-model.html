<figure class="lab">
    <h3 data-i18n="ch1.model.title"></h3>
    <p class="how" data-i18n-html="ch1.model.how"></p>
    <canvas class="cv" id="fgCv" role="img" data-i18n-aria="ch1.model.aria"></canvas>
    <div class="legend"><span><i class="band" style="background:var(--cyan)"></i><span data-i18n="ch1.leg.used"></span></span><span><i class="band" style="background:var(--dimfill)"></i><span data-i18n="ch1.leg.free"></span></span><span><i style="background:var(--red)"></i><span data-i18n="ch1.leg.fail"></span></span></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch1.ctl.mean"></span><input type="range" id="fgM" min="0" max="10" step="1" value="4"><output id="fgMo"></output></label></div>
    <div class="ctl"><button type="button" class="b" id="fgPlay" data-i18n="ch1.btn.play"></button><button type="button" class="b" id="fgEnd" data-i18n="ch1.btn.end"></button></div>
    <div class="read">
      <div><b class="r" id="fgB"></b><span data-i18n-html="ch1.read.bb"></span></div>
      <div><b class="c" id="fgP"></b><span data-i18n-html="ch1.read.pg"></span></div>
      <div><b class="" id="fgF"></b><span data-i18n-html="ch1.read.free"></span></div>
      <div><b class="g" id="fgL"></b><span data-i18n-html="ch1.read.hole"></span></div>
    </div>
    <p class="say" id="fgSay" aria-live="polite"></p>
  </figure>
