<figure class="lab">
    <h3 data-i18n="ch4.model.title"></h3>
    <p class="how" data-i18n-html="ch4.model.how"></p>
    <canvas class="cv " id="nmCv" role="img" data-i18n-aria="ch4.model.aria"></canvas>
    <div class="ctl"><button type="button" class="b" id="nmLocal" data-i18n="ch4.btn.local"></button><button type="button" class="b" id="nmIl" data-i18n="ch4.btn.il"></button><button type="button" class="b" id="nmFar" data-i18n="ch4.btn.far"></button></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch4.ctl.pkg"></span><input type="range" id="nmP" min="0" max="100" step="0.5" value="37.5"><output id="nmPo"></output></label><label class="rng"><span data-i18n="ch4.ctl.remote"></span><input type="range" id="nmR" min="0" max="100" step="0.5" value="50"><output id="nmRo"></output></label></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch4.ctl.mlp"></span><input type="range" id="nmM" min="1" max="20" step="1" value="10"><output id="nmMo"></output></label></div>
    <div class="read">
      <div><b class="g" id="nmLat"></b><span data-i18n-html="ch4.read.lat"></span></div>
      <div><b class="r" id="nmX"></b><span data-i18n-html="ch4.read.x"></span></div>
      <div><b class="c" id="nmBw"></b><span data-i18n-html="ch4.read.bw"></span></div>
      <div><b class="" id="nmL"></b><span data-i18n-html="ch4.read.local"></span></div>
    </div>
    <p class="say" id="nmSay" aria-live="polite"></p>
  </figure>
