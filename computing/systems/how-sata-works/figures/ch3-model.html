<figure class="lab">
    <h3 data-i18n="ch3.model.title"></h3>
    <p class="how" data-i18n-html="ch3.model.how"></p>
    <div class="ctl"><label class="txt"><span data-i18n="ch3.ctl.in"></span><input type="text" id="enIn" maxlength="12" spellcheck="false" autocomplete="off"></label></div>
    <div class="ctl"><div class="seg" role="radiogroup" data-i18n-aria="ch3.ctl.preset"><span class="lbl" data-i18n="ch3.ctl.preset"></span><label><input type="radio" name="enP" value="text" checked><span data-i18n="ch3.preset.text"></span></label><label><input type="radio" name="enP" value="zero"><span data-i18n="ch3.preset.zero"></span></label><label><input type="radio" name="enP" value="ff"><span data-i18n="ch3.preset.ff"></span></label><label><input type="radio" name="enP" value="align"><span data-i18n="ch3.preset.align"></span></label></div><label class="chk"><input type="checkbox" id="enScr"><span data-i18n="ch3.ctl.scr"></span></label></div>
    <canvas class="cv tall" id="enCv" role="img" data-i18n-aria="ch3.model.aria"></canvas>
    <div class="legend"><span><i style="background:var(--mute)"></i><span data-i18n="ch3.leg.raw"></span></span><span><i style="background:var(--gold)"></i><span data-i18n="ch3.leg.coded"></span></span><span><i style="background:var(--cyan)"></i><span data-i18n="ch3.leg.rds"></span></span><span><i style="background:var(--red)"></i><span data-i18n="ch3.leg.comma"></span></span></div>
    <div class="syms" id="enSyms" aria-live="off"></div>
    <div class="read">
      <div><b class="" id="enRawRun"></b><span data-i18n-html="ch3.read.rawRun"></span></div>
      <div><b class="g" id="enRun"></b><span data-i18n-html="ch3.read.run"></span></div>
      <div><b class="c" id="enSwing"></b><span data-i18n-html="ch3.read.swing"></span></div>
      <div><b class="r" id="enComma"></b><span data-i18n-html="ch3.read.comma"></span></div>
    </div>
    <p class="say" id="enSay" aria-live="polite"></p>
  </figure>
