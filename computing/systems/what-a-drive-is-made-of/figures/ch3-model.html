<figure class="lab">
    <h3 data-i18n="ch3.model.title"></h3>
    <p class="how" data-i18n-html="ch3.model.how"></p>
    <canvas class="cv" id="smCv" role="img" data-i18n-aria="ch3.model.aria"></canvas>
    <div class="legend"><span><i style="background:var(--gold)"></i><span data-i18n="ch3.cv.g"></span></span><span><i style="background:var(--red)"></i><span data-i18n="ch3.cv.c"></span></span></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch3.ctl.B"></span><input type="range" id="smB" min="1" max="100" step="1" value="10"><output id="smBo"></output></label><label class="rng"><span data-i18n="ch3.ctl.q"></span><input type="range" id="smQ" min="0.5" max="0.95" step="0.05" value="0.8"><output id="smQo"></output></label></div>
    <div class="read">
      <div><b class="g" id="smG"></b><span data-i18n-html="ch3.read.gain"></span></div>
      <div><b class="r" id="smTr"></b><span data-i18n-html="ch3.read.tr"></span></div>
      <div><b class="c" id="smMs"></b><span data-i18n-html="ch3.read.ms"></span></div>
      <div><b class="" id="smX"></b><span data-i18n-html="ch3.read.x"></span></div>
    </div>
    <p class="say" id="smSay" aria-live="polite"></p>
  </figure>
