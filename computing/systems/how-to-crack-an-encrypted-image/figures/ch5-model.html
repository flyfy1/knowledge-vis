<figure class="lab" id="lab5">
  <h3 data-i18n="ch5.model.title"></h3>
  <p class="how" data-i18n="ch5.model.how"></p>
  <div class="ctl">
    <label class="rng"><span data-i18n="ch5.ctl.ram"></span><input id="c5Ram" type="range" min="256" max="3072" step="128" value="1350"><output id="c5RamO"></output></label>
    <label class="rng"><span data-i18n="ch5.ctl.life"></span><input id="c5Life" type="range" min="0.5" max="100" step="0.5" value="1"><output id="c5LifeO"></output></label>
    <label class="rng"><span data-i18n="ch5.ctl.rounds"></span><input id="c5Rounds" type="range" min="1" max="100" step="1" value="30"><output id="c5RoundsO"></output></label>
  </div>
  <canvas class="cv short" id="c5Cv" role="img" data-i18n-aria="ch5.cv.aria"></canvas>
  <div class="read">
    <div><span data-i18n="ch5.read.scan"></span><b id="c5Scan" class="c"></b></div>
    <div><span data-i18n="ch5.read.p1"></span><b id="c5P1" class="r"></b></div>
    <div><span data-i18n="ch5.read.pn"></span><b id="c5Pn" class="g"></b></div>
  </div>
  <p class="say" id="c5Say" aria-live="polite"></p>
</figure>
