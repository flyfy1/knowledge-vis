<figure class="lab">
    <h3 data-i18n="ch5.model.title"></h3>
    <p class="how" data-i18n-html="ch5.model.how"></p>
    <canvas class="cv" id="cpCv" role="img" data-i18n-aria="ch5.model.aria"></canvas>
    <div class="legend"><span><i style="background:var(--cyan)"></i><span data-i18n="ch5.leg.imem"></span></span><span><i style="background:var(--violet)"></i><span data-i18n="ch5.leg.reg"></span></span><span><i style="background:var(--gold)"></i><span data-i18n="ch5.leg.alu"></span></span><span><i style="background:var(--green)"></i><span data-i18n="ch5.leg.dmem"></span></span></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch5.ctl.mem"></span><input type="range" id="cpM" min="100" max="400" step="50" value="200"><output id="cpMo"></output></label></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch5.ctl.alu"></span><input type="range" id="cpA" min="100" max="400" step="50" value="200"><output id="cpAo"></output></label></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch5.ctl.reg"></span><input type="range" id="cpR" min="50" max="400" step="50" value="100"><output id="cpRo"></output></label></div>
    <div class="read">
      <div><b class="g" id="cpP"></b><span data-i18n-html="ch5.read.period"></span></div>
      <div><b class="" id="cpAvg"></b><span data-i18n-html="ch5.read.avg"></span></div>
      <div><b class="r" id="cpW"></b><span data-i18n-html="ch5.read.waste"></span></div>
      <div><b class="c" id="cpS"></b><span data-i18n-html="ch5.read.stage"></span></div>
      <div><b class="n" id="cpI"></b><span data-i18n-html="ch5.read.ideal"></span></div>
    </div>
    <p class="say" id="cpSay" aria-live="polite"></p>
  </figure>
