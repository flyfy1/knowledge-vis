<figure class="lab">
    <h3 data-i18n="ch6.model.title"></h3>
    <p class="how" data-i18n-html="ch6.model.how"></p>
    <canvas class="cv short" id="poCv" role="img" data-i18n-aria="ch6.model.aria"></canvas>
    <div class="ctl"><label class="rng"><span data-i18n="ch6.ctl.n"></span><input type="range" id="poN" min="0" max="6" step="1" value="4"><output id="poNo"></output></label></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch6.ctl.rho"></span><input type="range" id="poR" min="0" max="4" step="1" value="2"><output id="poRo"></output></label></div>
    <div class="read">
      <div><b class="g" id="poSaved"></b><span data-i18n-html="ch6.read.saved"></span></div>
      <div><b class="c" id="poPool"></b><span data-i18n-html="ch6.read.pool"></span></div>
      <div><b class="" id="poOwn"></b><span data-i18n-html="ch6.read.own"></span></div>
      <div><b class="r" id="poAdd"></b><span data-i18n-html="ch6.read.add"></span></div>
    </div>
    <p class="say" id="poSay" aria-live="polite"></p>
  </figure>
