<figure class="lab">
    <h3 data-i18n="ch6.model.title"></h3>
    <p class="how" data-i18n-html="ch6.model.how"></p>
    <canvas class="cv tall" id="ilCv" role="img" data-i18n-aria="ch6.model.aria"></canvas>
    <div class="legend"><span><i style="background:var(--cyan)"></i><span data-i18n="ch6.k.load"></span></span><span><i style="background:var(--red)"></i><span data-i18n="ch6.k.mul"></span></span><span><i style="background:var(--gold)"></i><span data-i18n="ch6.k.alu"></span></span><span><i style="background:var(--violet)"></i><span data-i18n="ch6.k.br"></span></span></div>

      <div><b class="r" id="ilIn"></b><span data-i18n-html="ch6.read.in"></span></div>
      <div><b class="g" id="ilOo"></b><span data-i18n-html="ch6.read.oo"></span></div>
      <div><b class="" id="ilCap"></b><span data-i18n-html="ch6.read.cap"></span></div>

    <p class="say" id="ilSay" aria-live="polite"></p>
