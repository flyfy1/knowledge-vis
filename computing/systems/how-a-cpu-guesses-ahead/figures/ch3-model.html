<figure class="lab">
    <h3 data-i18n="ch3.model.title"></h3>
    <p class="how" data-i18n-html="ch3.model.how"></p>
    <canvas class="cv" id="gsCv" role="img" data-i18n-aria="ch3.model.aria"></canvas>
    <div class="ctl"><div class="seg wrapmany" role="radiogroup" data-i18n-aria="ch3.ctl.trace"><span class="lbl" data-i18n="ch3.ctl.trace"></span><label><input type="radio" name="gsT" value="corr" checked><span data-i18n="ch3.tr.corr"></span></label><label><input type="radio" name="gsT" value="loop4"><span data-i18n="ch3.tr.loop4"></span></label><label><input type="radio" name="gsT" value="mix"><span data-i18n="ch3.tr.mix"></span></label></div></div>
    <div class="ctl"><div class="seg" role="radiogroup" data-i18n-aria="ch3.ctl.size"><span class="lbl" data-i18n="ch3.ctl.size"></span><label><input type="radio" name="gsN" value="6"><span data-i18n="ch3.size.6"></span></label><label><input type="radio" name="gsN" value="10" checked><span data-i18n="ch3.size.10"></span></label></div></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch3.ctl.h"></span><input type="range" id="gsH" min="0" max="10" step="1" value="2"><output id="gsHo"></output></label></div>
    <div class="read">
      <div><b class="g" id="gsG"></b><span data-i18n-html="ch3.read.g"></span></div>
      <div><b class="" id="gsB"></b><span data-i18n-html="ch3.read.b"></span></div>
      <div><b class="c" id="gsD"></b><span data-i18n-html="ch3.read.d"></span></div>
    </div>
    <p class="say" id="gsSay" aria-live="polite"></p>
  </figure>
