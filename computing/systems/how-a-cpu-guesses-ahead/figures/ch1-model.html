<figure class="lab">
    <h3 data-i18n="ch1.model.title"></h3>
    <p class="how" data-i18n-html="ch1.model.how"></p>
    <canvas class="cv" id="cpCv" role="img" data-i18n-aria="ch1.model.aria"></canvas>
    <div class="legend"><span><i style="background:var(--gold)"></i><span data-i18n="ch1.cv.you"></span></span><span><i style="background:var(--mute)"></i><span data-i18n="ch1.cv.a1"></span></span></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch1.ctl.w"></span><input type="range" id="cpW" min="1" max="8" step="1" value="8"><output id="cpWo"></output></label></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch1.ctl.p"></span><input type="range" id="cpP" min="2" max="25" step="1" value="15"><output id="cpPo"></output></label></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch1.ctl.a"></span><input type="range" id="cpA" min="0" max="11" step="1" value="5"><output id="cpAo"></output></label></div>
    <div class="ctl"><button type="button" class="b" id="cpA1" data-i18n="ch1.btn.a1"></button><button type="button" class="b" id="cpZen" data-i18n="ch1.btn.zen"></button></div>
    <div class="read">
      <div><b class="g" id="cpCpi"></b><span data-i18n-html="ch1.read.cpi"></span></div>
      <div><b class="c" id="cpIpc"></b><span data-i18n-html="ch1.read.ipc"></span></div>
      <div><b class="r" id="cpLost"></b><span data-i18n-html="ch1.read.lost"></span></div>
      <div><b class="" id="cpSlots"></b><span data-i18n-html="ch1.read.slots"></span></div>
    </div>
    <p class="say" id="cpSay" aria-live="polite"></p>
  </figure>
