<figure class="lab">
    <h3 data-i18n="ch2.model.title"></h3>
    <p class="how" data-i18n-html="ch2.model.how"></p>
    <div class="ctl"><label class="rng"><span data-i18n="ch2.ctl.k"></span><input type="range" id="k2K" min="0" max="8" step="1" value="2"><output id="k2Ko"></output></label></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch2.ctl.p"></span><input type="range" id="k2P" min="0" max="6" step="1" value="4"><output id="k2Po"></output></label></div>
    <div class="ctl"><div class="seg" role="radiogroup" data-i18n-aria="ch2.ctl.kind"><span class="lbl" data-i18n="ch2.ctl.kind"></span><label><input type="radio" name="k2Kind" value="nt"><span data-i18n="ch2.kind.nt"></span></label><label><input type="radio" name="k2Kind" value="btfn"><span data-i18n="ch2.kind.btfn"></span></label><label><input type="radio" name="k2Kind" value="1bit"><span data-i18n="ch2.kind.1bit"></span></label><label><input type="radio" name="k2Kind" value="2bit" checked><span data-i18n="ch2.kind.2bit"></span></label></div></div>
    <div class="strip" id="k2Strip" role="img" data-i18n-aria="ch2.model.aria"></div>
    <div class="legend"><span><i style="background:var(--gold)"></i><span data-i18n="ch2.strip.fwd"></span></span><span><i style="background:var(--cyan)"></i><span data-i18n="ch2.strip.inner"></span></span><span><i style="background:var(--violet)"></i><span data-i18n="ch2.strip.outer"></span></span></div>
    <div class="read">
      <div><b class="" id="k2nt"></b><span data-i18n-html="ch2.read.nt"></span></div>
      <div><b class="v" id="k2bt"></b><span data-i18n-html="ch2.read.btfn"></span></div>
      <div><b class="c" id="k2b1"></b><span data-i18n-html="ch2.read.1bit"></span></div>
      <div><b class="g" id="k2b2"></b><span data-i18n-html="ch2.read.2bit"></span></div>
    </div>
    <p class="say" id="k2Say" aria-live="polite"></p>
  </figure>
