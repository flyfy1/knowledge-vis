<style>
  :root { --bg:#0c0e13; --card:#141821; --card2:#1a1f2b; --line:#2b3242; --ink:#ebe8e0; --body:#d5d7de; --mute:#a3aab8; --dim:#9098a8;
    --gold:#e9b949; --cyan:#63c7e6; --red:#f07a6d; --green:#7ad6a0; --violet:#b39dfb;

  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }

  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.85 var(--sans); -webkit-font-smoothing:antialiased; overflow-x:hidden; }

  sup, sub { line-height:0; }

  .topbar { position:absolute; top:0; left:0; right:0; z-index:5; display:flex; justify-content:space-between; align-items:center; padding:8px 12px; gap:8px; }
  .back { display:inline-flex; align-items:center; min-height:48px; padding:0 10px; color:var(--mute); text-decoration:none; font-size:14px; }
  .back:hover { color:var(--ink); }
  #langToggle { display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--card); }
  #langToggle button { min-width:48px; min-height:48px; border:0; border-radius:0; background:transparent; color:var(--mute); font:600 14px/1 var(--sans); padding:0 12px; cursor:pointer; }
  #langToggle button + button { border-left:1px solid var(--line); }
  #langToggle button[aria-pressed="true"] { background:rgba(233,185,73,.16); color:var(--gold); }

  .hero { min-height:88vh; display:flex; align-items:center; border-bottom:1px solid var(--line); }
  .hero .wrap { padding-top:96px; padding-bottom:64px; width:100%; }

  .lead { color:var(--body); max-width:36em; }
  .note { font-size:15px; color:var(--mute); border-left:2px solid var(--line); padding-left:14px; margin-top:1.8em; max-width:36em; line-height:1.75; }
  .note strong { color:var(--ink); font-weight:600; }

  .toc ol { list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:0 22px; }
  .toc a { display:flex; align-items:center; gap:12px; min-height:48px; text-decoration:none; color:var(--ink); border-bottom:1px solid var(--line); font-size:15px; line-height:1.4; }
  .toc a:hover { color:var(--gold); }
  .toc a span { font:12px/1 var(--mono); color:var(--mute); }

  .ch { padding-top:96px; }

  .ch h2 { font:400 clamp(26px,4.2vw,38px)/1.35 var(--serif); margin:.45em 0 .5em; letter-spacing:.02em; }
  .ch h3.sec { font:600 18px/1.5 var(--sans); margin:1.8em 0 .6em; color:var(--ink); }
  .law { font:400 clamp(19px,2.5vw,23px)/1.7 var(--serif); border-left:3px solid var(--gold); padding:4px 0 4px 18px; margin:0 0 1.5em; }
  .ch p { margin:0 0 1.15em; color:var(--body); }
  .ch p strong, .ch li strong { color:var(--ink); font-weight:600; }
  .ch ul, .ch ol.plain { padding-left:1.3em; margin:0 0 1.2em; color:var(--body); }
  .ch li { margin:.45em 0; }
  .take { color:var(--mute) !important; font-size:15.5px; }
  .eq { font:500 16px/1.7 var(--mono); color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin:0 0 1.2em; overflow-wrap:anywhere; }
  .tag { display:inline-block; font:600 12px/1 var(--sans); padding:5px 8px; border-radius:6px; margin-right:6px; vertical-align:2px; white-space:nowrap; }
  .tag.h { background:rgba(122,214,160,.16); color:var(--green); } .tag.m { background:rgba(233,185,73,.16); color:var(--gold); } .tag.l { background:rgba(240,122,109,.16); color:var(--red); } .tag.c { background:rgba(99,199,230,.16); color:var(--cyan); }

  figure.lab { margin:34px auto; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px 22px 18px; }
  .lab h3 { margin:0 0 4px; font:600 16px/1.5 var(--sans); color:var(--ink); }
  .lab .how { margin:0 0 14px; font-size:14.5px; color:var(--mute); line-height:1.65; }
  .cv { width:100%; height:300px; display:block; border-radius:10px; background:#0f1219; touch-action:pan-y; }
  .cv.tall { height:380px; } .cv.short { height:200px; }
  .ctl { display:flex; flex-wrap:wrap; gap:4px 22px; align-items:center; margin:12px 0 2px; font-size:14.5px; color:var(--mute); }
  .ctl label.rng { display:flex; align-items:center; gap:10px; flex:1 1 260px; min-width:0; min-height:48px; }
  .ctl label.rng > span { flex:0 0 auto; white-space:nowrap; }
  .ctl output { flex:0 0 auto; white-space:nowrap; min-width:4.6em; text-align:right; color:var(--ink); font:500 14px/1.3 var(--mono); }
  input[type=range] { flex:1 1 auto; min-width:80px; height:48px; margin:0; accent-color:var(--gold); background:transparent; cursor:pointer; }
  label.chk { display:inline-flex; align-items:center; gap:10px; min-height:48px; padding:0 4px; cursor:pointer; color:var(--ink); }
  input[type=checkbox], input[type=radio] { accent-color:var(--gold); width:20px; height:20px; margin:0; cursor:pointer; }
  .seg { display:inline-flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .seg .lbl { margin-right:4px; }
  .seg label { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; min-width:48px; padding:0 14px; border:1px solid var(--line); border-radius:999px; background:var(--card2); color:var(--ink); cursor:pointer; font-size:14px; line-height:1.3; text-align:center; }
  .seg label:has(input:checked) { border-color:var(--gold); color:var(--gold); background:rgba(233,185,73,.12); }
  .seg input { position:absolute; opacity:0; width:1px; height:1px; }
  .seg label:has(input:focus-visible) { outline:2px solid var(--gold); outline-offset:2px; }
  button.b { font:inherit; font-size:14.5px; color:var(--ink); background:var(--card2); border:1px solid var(--line); border-radius:999px; min-height:48px; padding:0 18px; cursor:pointer; line-height:1.3; }
  button.b:hover { border-color:var(--gold); }
  button.b[aria-pressed="true"] { background:rgba(233,185,73,.16); border-color:var(--gold); color:var(--gold); }
  .read { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-top:14px; }
  .read div { background:var(--card2); border-radius:10px; padding:10px 12px; font-size:13px; color:var(--mute); line-height:1.5; min-width:0; }
  .read b { display:block; font:600 20px/1.3 var(--sans); color:var(--ink); font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
  .read b.sm { font-size:15px; font-family:var(--mono); font-weight:500; }
  .read b.g, .g { color:var(--gold); } .read b.r, .r { color:var(--red); } .read b.c, .c { color:var(--cyan); } .read b.n, .n { color:var(--green); } .read b.v, .v { color:var(--violet); }
  .say { margin:14px 0 0; font-size:15px; color:var(--ink); line-height:1.7; min-height:3.4em; }
  .say em { font-style:normal; color:var(--gold); }
  .legend { display:flex; flex-wrap:wrap; gap:6px 18px; font-size:13.5px; color:var(--mute); margin-top:10px; }
  .legend i { display:inline-block; width:14px; height:4px; border-radius:2px; margin-right:6px; vertical-align:3px; }
  .legend i.dot { width:9px; height:9px; border-radius:50%; vertical-align:0; }
  .legend i.dash { background:repeating-linear-gradient(90deg,currentColor 0 4px,transparent 4px 7px) !important; }

  /* square-and-multiply trace */
  .trace { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:6px; margin-top:12px; }
  .trace div { background:var(--card2); border-radius:8px; padding:6px 10px; font:13px/1.5 var(--mono); color:var(--mute); }
  .trace div b { color:var(--ink); font-weight:500; }
  .trace div.mul b { color:var(--gold); }
  .bits { font:500 18px/1.6 var(--mono); letter-spacing:.12em; color:var(--ink); overflow-wrap:anywhere; }

  /* Diffie–Hellman board */
  .board { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:6px; }
  .board.mal { grid-template-columns:1fr 1fr 1fr 1fr; }
  .board .col { background:var(--card2); border-radius:12px; padding:10px 12px; min-width:0; }
  .board .col h4 { margin:0 0 6px; font:600 14px/1.4 var(--sans); }
  .board .col.alice h4 { color:var(--cyan); } .board .col.bob h4 { color:var(--green); } .board .col.wire h4 { color:var(--mute); } .board .col.mallory h4 { color:var(--red); }
  .board dl { margin:0; font-size:13px; line-height:1.5; }
  .board dt { color:var(--mute); }
  .board dd { margin:0 0 6px; font:500 16px/1.4 var(--mono); color:var(--ink); overflow-wrap:anywhere; }
  .board dd.key { color:var(--gold); }
  .board dd.bad { color:var(--red); }
  .board .col.wire { border:1px dashed var(--line); background:transparent; }

  /* certificate cards */
  .certs { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
  .cert { background:var(--card2); border-radius:12px; padding:12px; border:1px solid var(--line); min-width:0; font-size:13px; line-height:1.55; color:var(--mute); }
  .cert h4 { margin:0 0 6px; font:600 14px/1.4 var(--sans); color:var(--ink); }
  .cert .v { color:var(--ink); font-family:var(--mono); overflow-wrap:anywhere; }
  .cert .st { margin-top:8px; font:600 14px/1.4 var(--sans); }
  .cert.bad { border-color:var(--red); } .cert.ok { border-color:rgba(122,214,160,.5); }
  .verdict { margin-top:12px; font:600 16px/1.5 var(--sans); }

  /* tables generated from the models */
  table.t { width:100%; border-collapse:collapse; font-size:14px; margin:0 0 1.3em; color:var(--body); table-layout:fixed; }
  table.t th, table.t td { border-bottom:1px solid var(--line); padding:7px 6px; text-align:left; vertical-align:top; overflow-wrap:anywhere; }
  table.t th { color:var(--mute); font-weight:600; font-size:13px; }
  table.t td.num, table.t th.num { text-align:right; font:inherit; font-family:var(--mono); letter-spacing:0; color:inherit; line-height:1.45; }
  #recTable th:first-child, #meritTable th:first-child { width:38%; }
  table.t td.num { overflow-wrap:normal; }
  .tcap { font-size:13px; color:var(--mute); margin:-.8em 0 1.4em; }

  /* Mosca bars */
  .bars { margin-top:10px; display:grid; gap:8px; }
  .bar { display:grid; grid-template-columns:7.5em 1fr; gap:10px; align-items:center; font-size:13.5px; color:var(--mute); }
  .bar .track { position:relative; height:24px; background:#0f1219; border-radius:6px; overflow:hidden; }
  .bar .fill { position:absolute; top:0; bottom:0; border-radius:6px; }
  .bar .tick { position:absolute; top:0; bottom:0; width:2px; background:var(--red); }

  /* frontier */
  .fxg { margin:0 0 1.6em; }
  .fxg h3 { font:600 17px/1.5 var(--sans); margin:1.4em 0 .4em; }
  .fxg ul { list-style:none; padding:0 !important; margin:0; }
  .fxg li { border-bottom:1px solid var(--line); padding:10px 0; margin:0 !important; color:var(--body); }
  .fxg li .when { display:inline-block; font:500 12px/1 var(--mono); color:var(--gold); border:1px solid rgba(233,185,73,.45); border-radius:6px; padding:4px 6px; margin-right:8px; vertical-align:2px; white-space:nowrap; }
  .notbuilt { border:1px dashed var(--violet); border-radius:14px; padding:16px 18px; margin:1.6em 0; }
  .notbuilt p:last-child { margin-bottom:0; }

  .sum { margin:50px 0 0; padding:24px 24px; border:1px solid var(--line); border-radius:16px; background:linear-gradient(180deg,rgba(233,185,73,.07),transparent); font:400 clamp(17px,2.2vw,20px)/1.95 var(--serif); }
  .sum em { font-style:normal; color:var(--gold); }
  .qs { counter-reset:q; list-style:none; padding:0 !important; }
  .qs li { counter-increment:q; position:relative; padding:14px 0 14px 46px !important; border-bottom:1px solid var(--line); margin:0 !important; }
  .qs li::before { content:counter(q); position:absolute; left:0; top:14px; width:30px; height:30px; border-radius:50%; border:1px solid var(--gold); color:var(--gold); font:600 14px/28px var(--mono); text-align:center; }

  footer { margin:100px 0 0; padding:40px 0 70px; border-top:1px solid var(--line); color:var(--mute); font-size:14px; line-height:1.8; }
  footer a { color:var(--mute); }
  @media (max-width:640px) {
    body { font-size:16px; } .wrap,.wide { padding:0 16px; }
    figure.lab { padding:16px 12px 14px; border-radius:14px; }
    .cv { height:250px; } .cv.tall { height:330px; } .cv.short { height:180px; }
    .ch { padding-top:76px; } .read { grid-template-columns:repeat(2,minmax(0,1fr)); } .read b { font-size:17px; }
    .ctl label.rng { flex-basis:100%; }
    .board, .board.mal { grid-template-columns:1fr 1fr; }
    .board .col.wire { grid-column:1 / -1; order:3; }
    .board.mal .col.mallory { grid-column:1 / -1; order:4; }
    .certs { grid-template-columns:1fr; }
    table.t { font-size:12.5px; } table.t th { font-size:12px; }
    .bar { grid-template-columns:6em 1fr; }
  }
  @media (max-width:420px) {
    .ctl label.rng { flex-wrap:wrap; gap:0 10px; justify-content:space-between; }
    .ctl label.rng input[type=range] { order:3; flex:1 1 100%; }
    .read { grid-template-columns:minmax(0,1fr) minmax(0,1fr); }
  }
</style>
