<figure class="lab">
    <h3 data-i18n="ch3.model.title"></h3>
    <p class="how" data-i18n-html="ch3.model.how"></p>
    <canvas class="cv short" id="isCv" role="img" data-i18n-aria="ch3.model.aria"></canvas>
    <div class="legend"><span><i style="background:var(--red)"></i><span data-i18n="ch3.cv.wait"></span></span><span><i style="background:var(--gold)"></i><span data-i18n="ch3.cv.data"></span></span></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch3.ctl.w"></span><input type="range" id="isW" min="12" max="24" step="1" value="20"><output id="isWo"></output></label><label class="rng"><span data-i18n="ch3.ctl.rtt"></span><input type="range" id="isR" min="0" max="10" step="1" value="2"><output id="isRo"></output></label></div>
    <div class="ctl"><div class="seg" role="radiogroup" data-i18n-aria="ch3.ctl.prof"><span class="lbl" data-i18n="ch3.ctl.prof"></span><label><input type="radio" name="isP" value="rfc" checked><span data-i18n="ch3.prof.rfc"></span></label><label><input type="radio" name="isP" value="noimm"><span data-i18n="ch3.prof.noimm"></span></label><label><input type="radio" name="isP" value="unsol"><span data-i18n="ch3.prof.unsol"></span></label><label><input type="radio" name="isP" value="big"><span data-i18n="ch3.prof.big"></span></label></div></div>
    <div class="ctl"><div class="seg" role="radiogroup" data-i18n-aria="ch3.ctl.g"><span class="lbl" data-i18n="ch3.ctl.g"></span><label><input type="radio" name="isG" value="10" checked><span data-i18n="u.gb10"></span></label><label><input type="radio" name="isG" value="25"><span data-i18n="u.gb25"></span></label><label><input type="radio" name="isG" value="100"><span data-i18n="u.gb100"></span></label></div></div>
    <div class="read"><div><b class="r" id="isRt"></b><span data-i18n-html="ch3.read.rt"></span></div><div><b class="" id="isPdu"></b><span data-i18n-html="ch3.read.pdu"></span></div><div><b class="g" id="isT"></b><span data-i18n-html="ch3.read.T"></span></div><div><b class="c" id="isMB"></b><span data-i18n-html="ch3.read.MB"></span></div></div>
    <p class="say" id="isSay" aria-live="polite"></p>
  </figure>
