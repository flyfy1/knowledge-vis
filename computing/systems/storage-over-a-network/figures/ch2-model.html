<figure class="lab">
    <h3 data-i18n="ch2.model.title"></h3>
    <p class="how" data-i18n-html="ch2.model.how"></p>
    <canvas class="cv tall" id="nsCv" role="img" data-i18n-aria="ch2.model.aria"></canvas>
    <div class="legend"><span><i style="background:var(--gold)"></i><span data-i18n="ch2.leg.many"></span></span><span><i style="background:var(--cyan)"></i><span data-i18n="ch2.leg.big"></span></span></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch2.ctl.s"></span><input type="range" id="nsS" min="2" max="14" step="0.1" value="6"><output id="nsSo"></output></label><label class="rng"><span data-i18n="ch2.ctl.rtt"></span><input type="range" id="nsR" min="0" max="12" step="1" value="4"><output id="nsRo"></output></label></div>
    <div class="ctl"><div class="seg" role="radiogroup" data-i18n-aria="ch2.ctl.k"><span class="lbl" data-i18n="ch2.ctl.k"></span><label><input type="radio" name="nsK" value="1"><span data-i18n="ch2.k.1"></span></label><label><input type="radio" name="nsK" value="2"><span data-i18n="ch2.k.2"></span></label><label><input type="radio" name="nsK" value="3" checked><span data-i18n="ch2.k.3"></span></label><label><input type="radio" name="nsK" value="4"><span data-i18n="ch2.k.4"></span></label></div></div>
    <div class="ctl"><div class="seg" role="radiogroup" data-i18n-aria="ch2.ctl.p"><span class="lbl" data-i18n="ch2.ctl.p"></span><label><input type="radio" name="nsP" value="1" checked><span>1</span></label><label><input type="radio" name="nsP" value="4"><span>4</span></label><label><input type="radio" name="nsP" value="16"><span>16</span></label><label><input type="radio" name="nsP" value="64"><span>64</span></label></div><div class="seg" role="radiogroup" data-i18n-aria="ch2.ctl.g"><span class="lbl" data-i18n="ch2.ctl.g"></span><label><input type="radio" name="nsG" value="1" checked><span data-i18n="u.gb1"></span></label><label><input type="radio" name="nsG" value="10"><span data-i18n="u.gb10"></span></label></div></div>
    <div class="read"><div><b class="g" id="nsT"></b><span data-i18n-html="ch2.read.T"></span></div><div><b class="c" id="nsB"></b><span data-i18n-html="ch2.read.big"></span></div><div><b class="r" id="nsX"></b><span data-i18n-html="ch2.read.ratio"></span></div><div><b class="" id="nsU"></b><span data-i18n-html="ch2.read.util"></span></div></div>
    <p class="say" id="nsSay" aria-live="polite"></p>
