<figure class="lab">
    <h3 data-i18n="ch8.model.title"></h3>
    <p class="how" data-i18n-html="ch8.model.how"></p>
    <canvas class="cv tall" id="mpCv" role="img" data-i18n-aria="ch8.model.aria"></canvas>
    <div class="legend"><span><i style="background:var(--gold)"></i><span data-i18n="ch8.leg.opt"></span></span><span><i style="background:var(--violet)"></i><span data-i18n="ch8.leg.rr"></span></span><span><i style="background:var(--cyan)"></i><span data-i18n="ch8.leg.prop"></span></span><span><i style="background:var(--green)"></i><span data-i18n="ch8.leg.best"></span></span><span><i class="dash" style="background:var(--red)"></i><span data-i18n="ch8.leg.fail"></span></span></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch8.ctl.l"></span><input type="range" id="mpL" min="5" max="145" step="1" value="80"><output id="mpLo"></output></label><label class="rng"><span data-i18n="ch8.ctl.q"></span><input type="range" id="mpQ" min="0.2" max="1" step="0.01" value="0.5"><output id="mpQo"></output></label></div>
    <div class="read"><div><b class="g" id="mpO"></b><span data-i18n-html="ch8.read.opt"></span></div><div><b class="n" id="mpB"></b><span data-i18n-html="ch8.read.best"></span></div><div><b class="" id="mpS"></b><span data-i18n-html="ch8.read.pb"></span></div><div><b class="r" id="mpF"></b><span data-i18n-html="ch8.read.fail"></span></div></div>
    <p class="say" id="mpSay" aria-live="polite"></p>
  </figure>
