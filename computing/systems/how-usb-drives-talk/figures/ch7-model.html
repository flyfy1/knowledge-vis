<figure class="lab">
    <h3 data-i18n="ch7.model.title"></h3>
    <p class="how" data-i18n-html="ch7.model.how"></p>
    <canvas class="cv tall" id="htCv" role="img" data-i18n-aria="ch7.model.aria"></canvas>
    <div class="legend"><span><i style="background:var(--red)"></i><span data-i18n="ch7.cv.t"></span></span><span><i style="background:var(--gold)"></i><span data-i18n="ch7.cv.r"></span></span></div>
    <div class="ctl"><div class="seg" role="radiogroup" data-i18n-aria="ch7.ctl.box"><span class="lbl" data-i18n="ch7.ctl.box"></span><label><input type="radio" name="htX" value="g2x1"><span data-i18n="ch7.box.g2x1"></span></label><label><input type="radio" name="htX" value="g2x2" checked><span data-i18n="ch7.box.g2x2"></span></label><label><input type="radio" name="htX" value="tb5"><span data-i18n="ch7.box.tb5"></span></label></div><div class="seg" role="radiogroup" data-i18n-aria="ch7.ctl.shell"><span class="lbl" data-i18n="ch7.ctl.shell"></span><label><input type="radio" name="htS" value="al"><span data-i18n="ch7.shell.al"></span></label><label><input type="radio" name="htS" value="plastic" checked><span data-i18n="ch7.shell.plastic"></span></label></div></div>
    <div class="ctl"><label class="rng"><span data-i18n="ch7.ctl.ta"></span><input type="range" id="htA" min="15" max="40" step="1" value="25"><output id="htAo"></output></label><button type="button" class="b" id="htPlay" aria-pressed="false" data-i18n="ch7.btn.play"></button><button type="button" class="b" id="htReset" data-i18n="ch7.btn.reset"></button></div>
    <div class="read">
      <div><b class="r" id="htT"></b><span data-i18n-html="ch7.read.tinf"></span></div>
      <div><b class="" id="htF"></b><span data-i18n-html="ch7.read.tfirst"></span></div>
      <div><b class="g" id="htV"></b><span data-i18n-html="ch7.read.avg"></span></div>
      <div><b class="c" id="htL"></b><span data-i18n-html="ch7.read.slow"></span></div>
    </div>
    <p class="say" id="htSay" aria-live="polite"></p>
  </figure>
